[project]
name = "crash-feature-matcher"
version = "0.1.1"
description = "宕机特征提取与已知问题匹配 Skill"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0,<4.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "click>=8.0.0",
    "requests>=2.0.0",
    "jieba>=0.42.0",
    "synonyms>=3.23.0",
]

[project.scripts]
crash-matcher = "crash_matcher.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crash_matcher"]
