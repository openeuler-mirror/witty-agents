mandatory:
  'received exception':
    - '^\\s+at '
    - '^\\s+Caused by:'
    - '^\\s+\\.\\.\\. '
  'Exception java\\.io\\.IOException':
    - '^\\s+at '
    - '^\\s+Caused by:'
    - '^\\s+\\.\\.\\. '
  'terminating':
    - '^\\s+at '
    - '^\\s+Caused by:'
    - '^\\s+\\.\\.\\. ' 
capture_patterns:
  timestamp: '\\b\\d{6}\\s+\\d{6}\\b'
  level: '\\b(INFO|WARN|ERROR|DEBUG|TRACE|FATAL)\\b'
  block_id: '\\bblk_-?\\d+\\b'
  ip_address: '\\b(?:25[0-5]|2[0-4]\\d|[01]?\\d\\d?)(?:\\.(?:25[0-5]|2[0-4]\\d|[01]?\\d\\d?)){3}\\b'
