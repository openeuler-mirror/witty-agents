    'py:': 1.5
    'import |from ': 1.4
    def \\w+: 1.4
  anomalous:
    'Traceback :': 2.0
    File ".+", line \\d+, in \\w+: 1.9
    ^\\s+(\\w+\\.)*\\w+()?: 1.8
