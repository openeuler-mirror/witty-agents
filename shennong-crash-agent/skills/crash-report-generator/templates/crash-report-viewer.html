<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内核崩溃报告 · Crash Report Viewer</title>
<style>
  :root {
    --bg: #eef1f6;
    --bg-grad: linear-gradient(135deg, #eef1f6 0%, #e6eaf2 100%);
    --card: #ffffff;
    --border: #e4e7eb;
    --text: #1f2329;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    --danger: #dc2626;
    --danger-soft: #fef2f2;
    --code-bg: #f8fafc;
    --code-border: #e2e8f0;
    --shadow: 0 1px 3px rgba(15,23,42,.06), 0 4px 12px rgba(15,23,42,.04);
    --shadow-lg: 0 8px 28px rgba(15,23,42,.10);
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg-grad);
    background-attachment: fixed;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 1100px; margin: 0 auto; padding: 28px 20px 80px; }
  .header {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 24px 28px; margin-bottom: 22px; box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .header::before { content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:linear-gradient(180deg,var(--danger),var(--accent)); }
  .header h1 { margin:0 0 10px; font-size:22px; display:flex; align-items:center; gap:10px; }
  .header .meta { color:var(--muted); font-size:13px; display:flex; gap:22px; flex-wrap:wrap; }
  .header .meta b { color:var(--text); font-weight:600; }
  .card {
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:20px 26px; margin-bottom:18px; box-shadow:var(--shadow);
  }
  .card h2 { margin:0 0 16px; font-size:15px; font-weight:600; display:flex; align-items:center; gap:9px; border-bottom:1px solid var(--border); padding-bottom:12px; }
  .card h2 .ico { font-size:16px; }
  .host-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; }
  .kv { display:flex; flex-direction:column; gap:3px; padding:8px 12px; background:var(--code-bg); border-radius:8px; border:1px solid var(--code-border); }
  .kv .k { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.3px; }
  .kv .v { color:var(--text); font-weight:600; word-break:break-all; }
  .bug-summary { background:var(--danger-soft); border-left:4px solid var(--danger); padding:14px 18px; border-radius:8px; font-weight:500; font-size:14.5px; }
  .bug-summary.empty { color:var(--muted); font-style:italic; font-weight:400; background:var(--code-bg); border-left-color:var(--code-border); }

  /* ===== 调用链路：Flex 流式蛇形 ===== */
  .chain-wrap { display:flex; flex-direction:column; align-items:center; padding:32px 0 40px; overflow:visible; }
  .chain {
    --nw:160px; --nh:40px; --gw:22px; --turn-h:48px;
    display:flex; flex-direction:column; align-items:stretch;
    width:calc(5 * var(--nw) + 4 * var(--gw));
    max-width:100%;
  }
  .chain-row { display:flex; align-items:center; justify-content:flex-start; min-height:var(--nh); }
  .chain-row.has-seg { padding-top:26px; }
  .chain-row.has-crash-bubble { padding-bottom:48px; }
  .chain-row.reverse { flex-direction:row-reverse; }
  .node {
    flex:0 0 var(--nw); width:var(--nw); min-width:0; height:var(--nh); padding:0 12px; border-radius:8px;
    background:var(--card); border:1.5px solid var(--accent); border-top-width:4px;
    font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace; font-size:12px;
    display:flex; align-items:center; white-space:nowrap;
    box-shadow:0 2px 8px rgba(37,99,235,0.12); position:relative; cursor:default;
  }
  .node .node-body { display:flex; align-items:center; gap:8px; flex:1; min-width:0; overflow:hidden; }
  .node .fname { flex:1; min-width:0; font-weight:600; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .node .tip{
    position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%);
    background:#1e293b; color:#f8fafc; padding:6px 12px; border-radius:6px;
    font-size:12px; font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    white-space:nowrap; font-weight:600; pointer-events:none; opacity:0;
    box-shadow:0 4px 14px rgba(15,23,42,.25); z-index:50; transition:opacity .15s;
  }
  .node .tip::after{
    content:""; position:absolute; top:100%; left:50%; transform:translateX(-50%);
    border:6px solid transparent; border-top-color:#1e293b;
  }
  .node { transition:box-shadow .15s, transform .15s, border-color .15s; }
  .node:hover { z-index:10; box-shadow:0 6px 20px rgba(37,99,235,.28); transform:translateY(-2px); border-color:var(--accent); }
  .node.crash:hover { box-shadow:0 6px 20px rgba(220,38,38,.32); border-color:var(--danger); }
  .node.entry:hover { box-shadow:0 6px 20px rgba(100,116,139,.25); border-color:#64748b; }
  .node.thunk:hover { box-shadow:0 6px 16px rgba(100,116,139,.18); border-color:#94a3b8; }
  .node:hover .tip { opacity:1; }
  .node .badge {
    font-size:10px; padding:2px 7px; border-radius:8px; font-weight:600; white-space:nowrap; flex-shrink:0;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
  }
  .node.crash { border-color:var(--danger); background:var(--danger-soft); box-shadow:0 2px 8px rgba(220,38,38,0.20); }
  .node.crash .fname { color:var(--danger); font-weight:700; }
  .node.crash .badge { background:var(--danger); color:#fff; }
  .node.entry { border-color:#94a3b8; background:#f8fafc; box-shadow:0 2px 8px rgba(148,163,184,0.18); }
  .node.entry .fname { color:#475569; }
  .node.entry .badge { background:#94a3b8; color:#fff; }
  .node.mid .badge { background:var(--accent-soft); color:var(--accent); }
  .node.thunk { background:#f8fafc; border-color:#e2e8f0; box-shadow:none; border-top-width:2px; border-radius:6px; }
  .node.thunk .fname { color:#94a3b8; font-weight:500; font-style:italic; }
  .node.thunk .badge { display:none; }

  .h-link { flex:0 0 var(--gw); height:2px; background:var(--accent); position:relative; align-self:center; }
  .h-link.crash { background:var(--danger); }
  .h-link::after {
    content:"▶"; position:absolute; right:-2px; top:50%; transform:translateY(-50%);
    font-size:12px; color:var(--accent); font-weight:700; line-height:1;
    text-shadow:0 0 3px #fff, -1px 0 0 #fff, 1px 0 0 #fff, 0 -1px 0 #fff, 0 1px 0 #fff;
  }
  .h-link.crash::after { color:var(--danger); }
  .chain-row.reverse .h-link::after { right:auto; left:-2px; content:"◀"; }

  .v-turn { flex:0 0 var(--turn-h); position:relative; width:100%; }
  .v-turn .v-line { position:absolute; top:0; bottom:0; width:2px; background:var(--accent); }
  .v-turn.right .v-line { right:calc(var(--nw)/2); }
  .v-turn.left  .v-line { left:calc(var(--nw)/2); }
  .v-turn.crash .v-line { background:var(--danger); }
  .v-turn::after {
    content:"▼"; position:absolute; bottom:-2px;
    font-size:12px; color:var(--accent); font-weight:700; line-height:1;
    text-shadow:0 0 3px #fff, -1px 0 0 #fff, 1px 0 0 #fff, 0 -1px 0 #fff, 0 1px 0 #fff;
  }
  .v-turn.right::after { right:calc(var(--nw)/2 - 6px); }
  .v-turn.left::after  { left:calc(var(--nw)/2 - 6px); }
  .v-turn.crash::after { color:var(--danger); }

  .fold-row { display:flex; justify-content:center; margin:8px 0; }
  .fold-btn {
    padding:8px 18px; border-radius:10px;
    background:repeating-linear-gradient(45deg,#f1f5f9,#f1f5f9 6px,#e2e8f0 6px,#e2e8f0 12px);
    border:1px dashed #94a3b8; color:#475569; font-size:13px; font-weight:600;
    cursor:pointer; user-select:none; font-family:inherit;
  }
  .fold-btn .pill { background:#fff; padding:1px 8px; border-radius:10px; border:1px solid #cbd5e1; margin-left:8px; font-size:11px; font-weight:600; }
  .fold-btn:hover { background:#e2e8f0; }
  .chain-legend {
    margin-top:14px; display:flex; gap:18px; flex-wrap:wrap; font-size:11px;
    color:var(--muted); align-items:center; justify-content:center; width:100%;
  }
  .chain-legend .dot { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:middle; }
  .chain-legend .dot.crash { background:var(--danger); }
  .chain-legend .dot.entry { background:#94a3b8; }
  .chain-legend .dot.mid { background:var(--accent); }
  .chain-legend .hint { margin-left:auto; color:#94a3b8; }

  /* 子系统配色 - mid 节点的边框/标签颜色覆盖 */
  .node.ss-netdrv { border-color:#0284c7; }
  .node.ss-netdrv .badge { background:#e0f2fe; color:#0284c7; }
  .node.ss-netcore { border-color:#0891b2; }
  .node.ss-netcore .badge { background:#cffafe; color:#0891b2; }
  .node.ss-nettcp { border-color:#059669; }
  .node.ss-nettcp .badge { background:#d1fae5; color:#059669; }
  .node.ss-netip { border-color:#0d9488; }
  .node.ss-netip .badge { background:#ccfbf1; color:#0d9488; }
  .node.ss-netsock { border-color:#0f766e; }
  .node.ss-netsock .badge { background:#ccfbf1; color:#0f766e; }
  .node.ss-softirq { border-color:#d97706; }
  .node.ss-softirq .badge { background:#fef3c7; color:#d97706; }
  .node.ss-hardirq { border-color:#c2410c; }
  .node.ss-hardirq .badge { background:#ffedd5; color:#c2410c; }
  .node.ss-syscall { border-color:#7c3aed; }
  .node.ss-syscall .badge { background:#ede9fe; color:#7c3aed; }
  .node.ss-mm { border-color:#db2777; }
  .node.ss-mm .badge { background:#fce7f3; color:#db2777; }
  .node.ss-vfs { border-color:#ca8a04; }
  .node.ss-vfs .badge { background:#fef9c3; color:#ca8a04; }
  .node.ss-sched { border-color:#6d28d9; }
  .node.ss-sched .badge { background:#ede9fe; color:#6d28d9; }
  .node.ss-lock { border-color:#9f1239; }
  .node.ss-lock .badge { background:#ffe4e6; color:#9f1239; }
  .node.ss-driver { border-color:#475569; }
  .node.ss-driver .badge { background:#f1f5f9; color:#475569; }
  .node.ss-other .badge { background:var(--accent-soft); color:var(--accent); }

  /* 子系统连线颜色（h-link 和 v-line 跟随目标节点子系统） */
  .h-link.to-netdrv, .v-turn.to-netdrv .v-line { background:#0284c7; }
  .h-link.to-netdrv::after, .v-turn.to-netdrv::after { color:#0284c7; }
  .h-link.to-netcore, .v-turn.to-netcore .v-line { background:#0891b2; }
  .h-link.to-netcore::after, .v-turn.to-netcore::after { color:#0891b2; }
  .h-link.to-nettcp, .v-turn.to-nettcp .v-line { background:#059669; }
  .h-link.to-nettcp::after, .v-turn.to-nettcp::after { color:#059669; }
  .h-link.to-netip, .v-turn.to-netip .v-line { background:#0d9488; }
  .h-link.to-netip::after, .v-turn.to-netip::after { color:#0d9488; }
  .h-link.to-netsock, .v-turn.to-netsock .v-line { background:#0f766e; }
  .h-link.to-netsock::after, .v-turn.to-netsock::after { color:#0f766e; }
  .h-link.to-softirq, .v-turn.to-softirq .v-line { background:#d97706; }
  .h-link.to-softirq::after, .v-turn.to-softirq::after { color:#d97706; }
  .h-link.to-hardirq, .v-turn.to-hardirq .v-line { background:#c2410c; }
  .h-link.to-hardirq::after, .v-turn.to-hardirq::after { color:#c2410c; }
  .h-link.to-syscall, .v-turn.to-syscall .v-line { background:#7c3aed; }
  .h-link.to-syscall::after, .v-turn.to-syscall::after { color:#7c3aed; }
  .h-link.to-mm, .v-turn.to-mm .v-line { background:#db2777; }
  .h-link.to-mm::after, .v-turn.to-mm::after { color:#db2777; }
  .h-link.to-vfs, .v-turn.to-vfs .v-line { background:#ca8a04; }
  .h-link.to-vfs::after, .v-turn.to-vfs::after { color:#ca8a04; }
  .h-link.to-sched, .v-turn.to-sched .v-line { background:#6d28d9; }
  .h-link.to-sched::after, .v-turn.to-sched::after { color:#6d28d9; }
  .h-link.to-lock, .v-turn.to-lock .v-line { background:#9f1239; }
  .h-link.to-lock::after, .v-turn.to-lock::after { color:#9f1239; }
  .h-link.to-driver, .v-turn.to-driver .v-line { background:#475569; }
  .h-link.to-driver::after, .v-turn.to-driver::after { color:#475569; }

  /* 链条导语 - 一句话故事融入链上方 */
  .chain-story {
    text-align:center;
    font-size:13.5px; line-height:1.7; color:#475569; font-style:italic;
    padding:10px 20px 0; max-width:780px; margin:0 auto;
    position:relative;
  }
  .chain-story::before{
    content:""; position:absolute; left:50%; top:0; transform:translateX(-50%);
    width:40px; height:3px; background:linear-gradient(90deg,transparent,var(--accent),transparent); border-radius:2px;
  }

  /* 段标签 - 显示在段首节点上方 */
  .node .seg-label{
    position:absolute; bottom:calc(100% + 4px); left:50%; transform:translateX(-50%);
    font-size:10.5px; font-weight:700; font-style:normal; white-space:nowrap;
    padding:2px 8px; border-radius:10px; line-height:1.4;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
    pointer-events:none; z-index:5;
  }
  .node.ss-netdrv .seg-label { background:#0284c7; color:#fff; }
  .node.ss-netcore .seg-label { background:#0891b2; color:#fff; }
  .node.ss-nettcp .seg-label { background:#059669; color:#fff; }
  .node.ss-netip .seg-label { background:#0d9488; color:#fff; }
  .node.ss-netsock .seg-label { background:#0f766e; color:#fff; }
  .node.ss-softirq .seg-label { background:#d97706; color:#fff; }
  .node.ss-hardirq .seg-label { background:#c2410c; color:#fff; }
  .node.ss-syscall .seg-label { background:#7c3aed; color:#fff; }
  .node.ss-mm .seg-label { background:#db2777; color:#fff; }
  .node.ss-vfs .seg-label { background:#ca8a04; color:#fff; }
  .node.ss-sched .seg-label { background:#6d28d9; color:#fff; }
  .node.ss-lock .seg-label { background:#9f1239; color:#fff; }
  .node.ss-driver .seg-label { background:#475569; color:#fff; }
  .node.ss-other .seg-label { background:var(--accent); color:#fff; }
  .node.entry .seg-label { background:#64748b; color:#fff; }
  /* 段首标签下方的小三角 */
  .node .seg-label::after{
    content:""; position:absolute; top:100%; left:50%; transform:translateX(-50%);
    border:4px solid transparent;
  }
  .node.ss-netdrv .seg-label::after { border-top-color:#0284c7; }
  .node.ss-netcore .seg-label::after { border-top-color:#0891b2; }
  .node.ss-nettcp .seg-label::after { border-top-color:#059669; }
  .node.ss-netip .seg-label::after { border-top-color:#0d9488; }
  .node.ss-netsock .seg-label::after { border-top-color:#0f766e; }
  .node.ss-softirq .seg-label::after { border-top-color:#d97706; }
  .node.ss-hardirq .seg-label::after { border-top-color:#c2410c; }
  .node.ss-syscall .seg-label::after { border-top-color:#7c3aed; }
  .node.ss-mm .seg-label::after { border-top-color:#db2777; }
  .node.ss-vfs .seg-label::after { border-top-color:#ca8a04; }
  .node.ss-sched .seg-label::after { border-top-color:#6d28d9; }
  .node.ss-lock .seg-label::after { border-top-color:#9f1239; }
  .node.ss-driver .seg-label::after { border-top-color:#475569; }
  .node.ss-other .seg-label::after { border-top-color:var(--accent); }
  .node.entry .seg-label::after { border-top-color:#64748b; }

  /* 崩溃点注释气泡 */
  .node.crash .crash-note{
    position:absolute; top:calc(100% + 6px); left:50%; transform:translateX(-50%);
    background:var(--danger); color:#fff; font-size:10.5px; font-weight:600;
    padding:4px 10px; border-radius:6px; white-space:normal; max-width:260px; text-align:center; line-height:1.4;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
    pointer-events:none; z-index:5;
  }
  .node.crash .crash-note::before{
    content:""; position:absolute; bottom:100%; left:50%; transform:translateX(-50%);
    border:5px solid transparent; border-bottom-color:var(--danger);
  }

  /* 关键观察点 - 紧凑横向芯片条 */
  .chain-observations{
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
    margin-top:16px; padding:0 8px;
  }
  .chain-obs-chip{
    font-size:12px; line-height:1.5; color:#334155;
    background:#f8fafc; border:1px solid #e2e8f0; border-radius:14px;
    padding:6px 12px; display:inline-flex; align-items:flex-start; gap:5px;
    max-width:420px; white-space:normal; word-break:break-word;
  }
  .chain-obs-chip .chip-tag{ font-size:13px; flex-shrink:0; line-height:1.5; }

  /* 原始栈折叠块（保留） */
  .trace-raw { margin-top:12px; }
  .trace-raw details { margin:0; box-shadow:none; border:1px solid var(--border); border-radius:8px; }
  .trace-raw summary { cursor:pointer; padding:8px 14px; font-size:12px; font-weight:600; color:#64748b; background:#f8fafc; user-select:none; }
  .trace-raw pre { margin:0; padding:12px 16px; background:#0f172a; color:#e2e8f0; font-size:11px; line-height:1.65; overflow-x:auto; font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace; white-space:pre; border-radius:0; max-height:300px; }

  .prose { white-space:pre-wrap; word-break:break-word; line-height:1.8; color:#334155; }
  details { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:14px; box-shadow:var(--shadow); overflow:hidden; }
  details[open] { box-shadow:var(--shadow-lg); }
  summary { padding:16px 26px; cursor:pointer; font-weight:600; font-size:14px; user-select:none; list-style:none; display:flex; align-items:center; gap:9px; }
  summary::-webkit-details-marker { display:none; }
  summary::before { content:"▸"; color:var(--accent); font-size:12px; display:inline-block; }
  details[open] summary::before { transform:rotate(90deg); }
  summary:hover { background:#f8fafc; }
  .detail-body { padding:0 26px 20px; }
  pre.json { background:var(--code-bg); border:1px solid var(--code-border); border-radius:8px; padding:16px; margin:0; overflow-x:auto; font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace; font-size:12.5px; line-height:1.6; max-height:540px; overflow-y:auto; }
  .json-key { color:#0369a1; } .json-str { color:#15803d; } .json-num { color:#b45309; } .json-bool { color:#7c3aed; } .json-null { color:var(--muted); }
  /* Workflow trace (new) */
  .wf-header { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px; font-size:12px; color:var(--muted); }
  .wf-badge { font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px; letter-spacing:.3px; text-transform:uppercase; }
  .wf-badge.export { background:#dbeafe; color:#1e40af; }
  .wf-badge.manual { background:#fef3c7; color:#92400e; }
  .wf-duration { font-variant-numeric:tabular-nums; }
  .wf-step { display:flex; gap:12px; margin-bottom:2px; position:relative; }
  .wf-step:not(:last-child)::after { content:""; position:absolute; left:11px; top:26px; bottom:-2px; width:2px; background:var(--border); }
  .wf-dot-col { flex:0 0 24px; display:flex; flex-direction:column; align-items:center; padding-top:4px; }
  .wf-dot { width:24px; height:24px; border-radius:50%; background:var(--accent); color:#fff; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; z-index:1; }
  .wf-dot.fail { background:#ef4444; }
  .wf-dot.partial { background:#f59e0b; }
  .wf-card-col { flex:1; min-width:0; padding-bottom:14px; }
  .wf-card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:10px 14px; }
  .wf-card-head { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
  .wf-stage { font-size:10px; font-weight:700; padding:2px 8px; border-radius:4px; text-transform:uppercase; letter-spacing:.3px; }
  .wf-stage.init { background:#f1f5f9; color:#475569; }

<body>
<div class="container" id="app">
  <div class="header">
    <h1 id="header-title"><span>📋</span> 加载中…</h1>
    <div class="meta" id="header-meta">加载中…</div>
  </div>
  <div id="core-section">
    <div class="card" id="host-card"><h2><span class="ico">🖥️</span> 宿主机信息</h2><div id="host-body"></div></div>
    <div class="card"><h2><span class="ico">🔍</span> 根因分析</h2><div id="rootcause-body"></div></div>
    <div class="card"><h2><span class="ico">🛠️</span> 解决方案</h2><div id="solution-body"></div></div>
    <div class="card"><h2><span class="ico">🔗</span> 调用链路</h2><div id="trace-body"></div></div>
    <details id="crash-match-details"><summary>🔬 崩溃特征 & 知识库匹配</summary><div class="detail-body" id="crash-match-body"></div></details>
  </div>
  <div id="details-section">
<details><summary>🔍 诊断工作流追踪</summary><div class="detail-body" id="workflow-body"></div></details>
  </div>
</div>
<script>
const FULL_URL='report.json';
const EMBED_FULL = /*__FULL_DATA__*/null;
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function fetchJSON(url){return fetch(url).then(r=>{if(!r.ok)throw new Error(url+' HTTP '+r.status);return r.json();});}

// 从 report.json 提取渲染所需的精简视图字段（core 视图）
function buildCore(report){
  const cf=report.crash_feature_info||{};
  const ra=report.root_cause_analysis||{};
  const hb=report.host_base_info||{};
  return {
    report_id: report.report_id,
    crash_time: cf.crash_time,
    bug_summary: cf.bug_summary,
    host: {
      host_name: hb.host_name, machine_model: hb.machine_model, cpu_model: hb.cpu_model,
      cpu_num: hb.cpu_num, kernel_version: hb.kernel_version, memory_size: hb.memory_size,
    },
    call_trace: cf.call_trace_signature||[],
    call_trace_text: cf.call_trace_text||'',
    rip_offset: cf.rip_offset||'',
    call_trace_summary: cf.call_trace_summary||null,
    conclusion: ra.conclusion,
    analysis: ra.analysis,
    solution: ra.solution,
  };
}

function renderHeader(core){
  const h=(core.host||{});
  const d=String(core.crash_time||'').slice(0,10);
  document.getElementById('header-title').innerHTML=`<span>📋</span> ${d?esc(d)+' · ':''}${esc(core.bug_summary||'内核崩溃报告')}`;
  document.getElementById('header-meta').innerHTML=
    `<span>报告ID: <b>${esc(core.report_id)}</b></span>`+
    `<span>崩溃时间: <b>${esc(core.crash_time)}</b></span>`+
    `<span>主机: <b>${esc(h.host_name)}</b></span>`+
    `<span>内核: <b>${esc(h.kernel_version)}</b></span>`;
}
function renderHost(core){
  const h=core.host||{};
  const fs=[['主机名',h.host_name],['机型',h.machine_model],['CPU',h.cpu_model],['CPU 数',h.cpu_num],['内核版本',h.kernel_version],['内存',h.memory_size]];
  document.getElementById('host-body').innerHTML=`<div class="host-grid">${fs.map(([k,v])=>`<div class="kv"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join('')}</div>`;
}

/* ============ 调用链路：Flex 流式蛇形（融入式路径解读） ============ */
const THUNK_PATTERNS=[/^srso_alias_/,/^srso_/,/^ret_from_fork/,/^entry_SYSCALL_/,/^asm_sysvec_/,/^asm_exc_/,/__x86_return_thunk/,/__retain_return_poison/,/__cfi_/];
const isThunk=fn=>THUNK_PATTERNS.some(re=>re.test(fn));
const ROW_LEN=5, FOLD_THRESHOLD=12, HEAD_SHOW=2, TAIL_SHOW=3;
const UNIT=182; // 节点宽 160 + 间隙 22 = 182

// 子系统分类规则（按优先级顺序，先匹配先命中）
const SUBSYS_RULES=[
  {re:/^(mlx5e?_|mlx4e?_|ixgbe_|i40e_|ice_|bnxt_|r8169_|virtnet_|e1000e?_|enic_|tg3_|be2net_|qede_|sfc_|nfp_)/,key:'netdrv',label:'网卡',icon:'📡'},
  {re:/^(napi_|napi_gro_|gro_|netif_|dev_queue_xmit|netif_receive|__netif_receive|xdp_|skb_|__skb|dev_hard_start|enqueue_to_backlog|process_backlog|do_xdp_generic)/,key:'netcore',label:'网络核心',icon:'🌐'},
  {re:/^(tcp_v[46]_|tcp_|__tcp|tcp_time_wait|tcp_v[46]_send|tcp_v[46]_rcv|tcp_rcv|tcp_send|udp_v[46]_|udp_|__inet_lookup|inet_)/,key:'nettcp',label:'TCP/UDP',icon:'🔌'},
  {re:/^(ip_rcv|ip_local|ip_output|ip_forward|ip_protocol|ip6_rcv|ip6_local|icmp_|icmpv6_|ip_send|ip_finish|ip_route)/,key:'netip',label:'IP层',icon:'📦'},
  {re:/^(sock_|sk_|sock_def|unix_.*recv|unix_.*send|af_)/,key:'netsock',label:'Socket',icon:'🔗'},
  {re:/(__do_softirq|do_softirq|net_rx_action|tasklet_action|irq_poll_|raise_softirq)/,key:'softirq',label:'软中断',icon:'🔄'},
  {re:/^(do_IRQ|irq_exit|handle_irq|generic_handle_irq|handle_edge_irq|__handle_irq)/,key:'hardirq',label:'硬中断',icon:'⚡'},
  {re:/^(do_syscall|do_sys|sys_call|SyS_|__x64_sys_|__arm64_sys_|__se_sys_|do_execveat|do_execve|do_fork|do_exit|sys_init_module|sys_delete_module|ksys_)/,key:'syscall',label:'系统调用',icon:'📝'},
  {re:/^(kmalloc|kfree|kzalloc|kcalloc|krealloc|vmalloc|vfree|__get_free_pages|alloc_pages|__alloc_pages|get_free_page|free_page|__free_pages|slab_|kmem_cache|slob_|slub_|page_alloc|__free_page|buddy_)/,key:'mm',label:'内存管理',icon:'💾'},
  {re:/^(vfs_|__vfs|ext4_|xfs_|btrfs_|btrfs_|nfs_|d_instantiate|dentry|inode|do_filp|filp_open|do_sys_open|path_openat|do_lookup|generic_file|address_space)/,key:'vfs',label:'VFS',icon:'📂'},
  {re:/^(schedule|_schedule|try_to_wake_up|wake_up|__wake_up|dequeue_task|enqueue_task|pick_next|scheduler_tick|copy_process|do_fork|kernel_clone|finish_task_switch|context_switch)/,key:'sched',label:'调度',icon:'🔀'},
  {re:/^(rcu_|_raw_spin|spin_lock|spin_unlock|read_lock|write_lock|mutex_|rwlock|raw_spin|rcu_read|rcu_exit|rcu_enter|synchronize_rcu|preempt_disable|preempt_enable|local_bh_disable|local_bh_enable)/,key:'lock',label:'锁/RCU',icon:'🔒'},
  {re:/^(pci_|pcie_|usb_|ata_|nvme_|scsi_|nvme_rdma|nvmet_|ib_|rdma_)/,key:'driver',label:'设备驱动',icon:'🔧'},
];
function classifySubsystem(fn){
  for(const r of SUBSYS_RULES) if(r.re.test(fn)) return {key:r.key,label:r.label,icon:r.icon,cls:'ss-'+r.key,toCls:'to-'+r.key};
  return {key:'other',label:'其他',icon:'•',cls:'ss-other',toCls:'to-other'};
}

function nodeHTML(fn,i,n,opts){
  const {ripOffset='', isSegStart=false, segLabel='', crashNote='', isCrash=false, isEntry=false, isThunkFn=false, ssCls='', ssKey='other'} = opts;
  let badge='';
  let nodeTypeCls='mid';
  if(isEntry){
    nodeTypeCls='entry'; badge='入口';
  }else if(isCrash){
    nodeTypeCls='crash'; badge='💥'+(ripOffset||'');
  }else{
    badge=isThunkFn?'跳板':classifySubsystem(fn).label;
  }
  let classes=['node',nodeTypeCls];
  if(isSegStart) classes.push('seg-start');
  if(!isEntry && !isCrash && ssCls && !isThunkFn) classes.push(ssCls);
  if(isThunkFn) classes.push('thunk');
  const segLabelHtml = isSegStart && segLabel ? `<span class="seg-label">${segLabel}</span>` : '';
  const crashNoteHtml = isCrash && crashNote ? `<span class="crash-note">${esc(crashNote)}</span>` : '';
  const tipText=isCrash?`${fn}${ripOffset||''} · 崩溃点${crashNote?' · '+crashNote:''}`:(isEntry?`${fn} · 调用入口`:fn);
  return `<div class="${classes.join(' ')}" title="${esc(tipText)}" data-fn="${esc(fn)}" data-ss="${ssKey}">`+
    `${segLabelHtml}<span class="tip">${esc(tipText)}</span>`+
    `<div class="node-body"><span class="fname">${esc(fn)}</span><span class="badge">${badge}</span></div>`+
    `${crashNoteHtml}</div>`;
}

// 渲染从 from 到 to（含）的连续段
function snakeSegment(order, from, to, n, opts){
  const {ripOffset='', nodeSs=null, effectiveSs=null, segStarts=null, crashNote=''} = opts;
  const html=[];
  const startRow=Math.floor(from/ROW_LEN);
  const endRow=Math.floor(to/ROW_LEN);
  for(let r=startRow;r<=endRow;r++){
    const isReverse=(r%2===1);
    const idxs=[];
    for(let i=r*ROW_LEN;i<=Math.min((r+1)*ROW_LEN-1,n-1);i++) if(i>=from&&i<=to) idxs.push(i);
    if(!idxs.length) continue;
    const hasNext=(r<endRow);
    const firstCol=idxs[0]%ROW_LEN;
    const lastCol=idxs[idxs.length-1]%ROW_LEN;

    // v-turn (vertical connector between rows)
    // Forward rows (side=left): connects to first node (col 0)
    // Reverse rows with hasNext (side=right): connects to first node (col ROW_LEN-1 due to spacers)
    // Reverse last row (side=right, no spacers): connects to last node (right-aligned)
    if(r>startRow){
      const side=isReverse?'right':'left';
      let connectIdx;
      if(!isReverse){
        connectIdx = idxs[0];
      }else if(hasNext){
        connectIdx = idxs[0];
      }else{
        connectIdx = idxs[idxs.length-1];
      }
      const connectEff = effectiveSs[connectIdx];
      const isCrashTurn = (connectIdx===n-1);
      let toCls = '';
      if(!isCrashTurn && connectEff && connectEff.toCls){
        toCls = ' '+connectEff.toCls;
      }
      html.push(`<div class="v-turn ${side}${toCls}${isCrashTurn?' crash':''}"><div class="v-line"></div></div>`);
    }
    // Build row content
    let parts=[];
    for(let k=0;k<idxs.length;k++){
      const i=idxs[k];
      const fn=order[i];
      const ss=nodeSs[i];
      const isThunkFn=isThunk(fn);
      const isEntry=(i===0);
      const isCrash=(i===n-1);
      const isSegStart=segStarts.has(i);
      let segLabel='';
      if(isSegStart){
        if(isEntry){
          const entrySs=classifySubsystem(fn);
          const ctxLabel = isThunkFn?'执行入口':(entrySs.key==='other'?'调用入口':entrySs.icon+' '+entrySs.label+'入口');
          segLabel='🚪 '+ctxLabel;
        }else if(isCrash){
          segLabel='💥 崩溃点';
        }else{
          segLabel=ss.icon+' '+ss.label;
        }
      }
      parts.push(nodeHTML(fn,i,n,{
        ripOffset, isSegStart, segLabel, crashNote:isCrash?crashNote:'',
        isCrash, isEntry, isThunkFn, ssCls:ss.cls, ssKey:ss.key
      }));
      if(k<idxs.length-1){
        // h-link color follows effective subsystem of destination node
        const nextI=idxs[k+1];
        const nextEff=effectiveSs[nextI];
        const isCrashLink=(nextI===n-1);
        let linkCls='h-link';
        if(isCrashLink) linkCls+=' crash';
        else if(nextEff && nextEff.toCls) linkCls+=' '+nextEff.toCls;
        parts.push(`<div class="${linkCls}"></div>`);
      }
    }
    // Spacers to align start/end to grid columns (only when row has a turn)
    if(hasNext){
      if(!isReverse){
        if(firstCol>0) parts.unshift(`<div style="flex:0 0 ${firstCol*UNIT}px"></div>`);
        const trail=ROW_LEN-1-lastCol;
        if(trail>0) parts.push(`<div style="flex:0 0 ${trail*UNIT}px"></div>`);
      } else {
        const trail=ROW_LEN-1-firstCol;
        if(trail>0) parts.push(`<div style="flex:0 0 ${trail*UNIT}px"></div>`);
        if(lastCol>0) parts.unshift(`<div style="flex:0 0 ${lastCol*UNIT}px"></div>`);
      }
    }
    // Determine if this row has any seg-start node or crash node
    let rowHasSeg=false, rowHasCrash=false;
    for(const ki of idxs){
      if(segStarts.has(ki)) rowHasSeg=true;
      if(ki===n-1) rowHasCrash=true;
    }
    html.push(`<div class="chain-row${isReverse?' reverse':''}${rowHasSeg?' has-seg':''}${rowHasCrash?' has-crash-bubble':''}">${parts.join('')}</div>`);
  }
  return html.join('');
}

function renderTrace(core){
  const t=core.call_trace||[];
  const el=document.getElementById('trace-body');
  if(!t.length){el.innerHTML=`<div class="empty-line">无调用栈数据</div>`;return;}
  const order=t.slice().reverse();
  const n=order.length;
  const folded=n>FOLD_THRESHOLD;
  const ripOffset=core.rip_offset||'';
  const sum=core.call_trace_summary;
  const rawText=core.call_trace_text||'';

  // 预计算每个节点的子系统信息
  const nodeSs=order.map(fn=>{
    if(isThunk(fn)) return {key:'thunk',label:'跳板',icon:'',cls:'',toCls:''};
    if(fn===order[0]) return classifySubsystem(fn); // entry
    if(fn===order[n-1]) return {key:'crash',label:'崩溃',icon:'',cls:'',toCls:''}; // crash
    return classifySubsystem(fn);
  });
  // 计算有效子系统：other 节点延续最近一个已分类子系统的颜色
  const effectiveSs=new Array(n);
  let lastClassified=null;
  for(let i=0;i<n;i++){
    const s=nodeSs[i];
    if(s.key==='thunk'){
      effectiveSs[i]=lastClassified||{key:'other',toCls:''};
    }else if(s.key==='other'){
      effectiveSs[i]=lastClassified||s;
    }else{
      effectiveSs[i]=s;
      lastClassified=s;
    }
  }
  // 计算段起始点（子系统变化处、entry、crash）
  // 规则：entry 和 crash 总是段首；进入一个"已分类"（非 other/非 thunk）的子系统时启动新段
  const segStarts=new Set([0]);
  for(let i=1;i<n-1;i++){
    const cur = nodeSs[i].key;
    if(cur==='thunk' || cur==='other') continue; // thunk/other 不启动新段
    // 找前一个非 thunk 节点做比较
    let pi=i-1;
    while(pi>0 && nodeSs[pi].key==='thunk') pi--;
    const prev = nodeSs[pi].key;
    if(prev!==cur) segStarts.add(i);
  }
  segStarts.add(n-1); // crash point always gets a label

  // 崩溃点注释（优先用 key_observations 中📍标签的条目，否则自动生成）
  let crashNote='';
  if(sum && sum.key_observations){
    const locObs = sum.key_observations.find(o=>/^📍/.test(o));
    if(locObs){
      crashNote = locObs.replace(/^📍\s*/,'').substring(0,50);
    }
  }
  if(!crashNote){
    crashNote = ripOffset?'RIP+'+ripOffset+' 崩溃':'崩溃点';
  }

  // 链条导语（一句话故事）
  const storyHtml = (sum && sum.summary) ? `<div class="chain-story">${esc(sum.summary)}</div>` : '';

  // 图例
  const legend=`<div class="chain-legend">
    <span><span class="dot entry"></span>调用入口</span>
    <span><span class="dot mid"></span>子系统路径</span>
    <span><span class="dot crash"></span>崩溃触发点</span>
  </div>`;

  // 关键观察点芯片
  let obsChips='';
  if(sum && sum.key_observations && sum.key_observations.length){
    obsChips=`<div class="chain-observations">`+
      sum.key_observations.map(o=>{
        const m=String(o).match(/^(\S+)\s+(.*)$/);
        const tag=m?m[1]:'💡';
        const text=m?m[2]:o;
        return `<span class="chain-obs-chip" title="${esc(tag+' '+text)}"><span class="chip-tag">${esc(tag)}</span>${esc(text)}</span>`;
      }).join('')+
      `</div>`;
  }

  // 原始栈折叠块
  const rawHtml=rawText?`<div class="trace-raw"><details><summary>📜 查看完整调用栈（带偏移量）</summary><pre>${esc(rawText)}</pre></details></div>`:'';

  const segOpts={ripOffset, nodeSs, effectiveSs, segStarts, crashNote};

  const buildChain=(bodyHtml)=>`<div class="chain-wrap">${storyHtml}<div class="chain">${bodyHtml}</div>${legend}${obsChips}</div>`;

  const renderAll=()=>{
    const body=snakeSegment(order,0,n-1,n,segOpts);
    el.innerHTML=buildChain(body)+rawHtml;
  };
  const renderFolded=()=>{
    const tailStart=n-TAIL_SHOW;
    const skipped=tailStart-HEAD_SHOW;
    const head=snakeSegment(order,0,HEAD_SHOW-1,n,segOpts);
    const tail=snakeSegment(order,tailStart,n-1,n,segOpts);
    const body=head+
      `<div class="fold-row"><button class="fold-btn" id="fold-expand">⋯ 省略中间 <b>${skipped}</b> 层<span class="pill">点击展开</span></button></div>`+
      tail;
    el.innerHTML=buildChain(body)+rawHtml;
    document.getElementById('fold-expand').addEventListener('click',renderAll);
  };
  folded?renderFolded():renderAll();
}

function hlJSON(obj){
  let s=JSON.stringify(obj,null,2);
  s=s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return s.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g,m=>{
    let cls='json-num';
    if(/^"/.test(m))cls=/:$/.test(m)?'json-key':'json-str';
    else if(/true|false/.test(m))cls='json-bool';
    else if(/null/.test(m))cls='json-null';
    return `<span class="${cls}">${m}</span>`;
  });
}
const preJSON=o=>`<pre class="json">${hlJSON(o)}</pre>`;

function renderCrashMatch(report){
  const cf=report.crash_feature_info||{};
  const diag=report.diagnosis_repair_result||{};
  const inr=diag.internal_kernel_result||[], com=diag.community_kernel_result||[];
  const allCases=[...inr.map(c=>({...c,source:'内部知识库'})),...com.map(c=>({...c,source:'社区案例'}))];
  const scoreOrder={高:0,中:1,低:2};
  allCases.sort((a,b)=>(scoreOrder[a.match_score]??9)-(scoreOrder[b.match_score]??9));

  const rm=cf.related_modules||[], an=cf.anomaly_features||{};
  const sig=cf.call_trace_signature||[];
  const rows=[['signature',cf.signature],['bug_type',cf.bug_type],['bug_key',cf.bug_key],['rip',cf.rip],['rip_function',cf.rip_function],['rip_offset',cf.rip_offset]];

  let h='<div class="match-section">';
  h+=`<div class="sec-label">📊 崩溃特征</div>`;
  h+=`<div class="host-grid">${rows.map(([k,v])=>`<div class="kv"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join('')}</div>`;
  if(rm.length) h+=`<div class="sec-label">关联模块</div><div class="modules-chips">${rm.map(m=>`<span class="chip">${esc(m)}</span>`).join('')}</div>`;
  if(Object.keys(an).length) h+=`<div class="sec-label">异常特征</div>${renderAnomaly(an)}`;
  if(sig.length) h+=`<div class="sec-label">调用栈签名</div><div class="modules-chips">${sig.map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</div>`;
  h+='</div>';

  h+='<div class="match-section">';
  h+=`<div class="sec-label">📚 知识库案例匹配 (${allCases.length} 条)</div>`;
  if(!allCases.length){
    h+='<div class="match-empty">无匹配案例</div>';
  } else {
    const scoreCls={高:'high',中:'mid',低:'low'};
    const levelDesc={
      L1:'指纹精确命中（崩溃特征签名完全一致）',
      L2:'RAG语义检索+评分确认（特征高重叠）',
      L3:'扩大召回弱匹配（需人工核验）'
    };
    // Add L-level legend
    h+=`<div class="match-level-legend">`+
      `<span style="font-weight:600;color:#334155;">匹配层级说明：</span>`+
      `<span class="leg"><span class="leg-dot L1">L1</span>${levelDesc.L1}</span>`+
      `<span class="leg"><span class="leg-dot L2">L2</span>${levelDesc.L2}</span>`+
      `<span class="leg"><span class="leg-dot L3">L3</span>${levelDesc.L3}</span>`+
      `</div>`;
    h+=`<div class="match-cases${allCases.length>1?' collapsed':''}" id="match-cases">`;
    allCases.forEach((c,i)=>{
      const fp=c.fingerprints||[];
      const level=c.match_level||'';
      h+=`<div class="match-case">`;
      // Score badge + Level badge
      h+=`<span class="mc-score ${scoreCls[c.match_score]||'low'}">${esc(c.match_score||'—')}匹配</span>`;
      if(level){
        h+=`<span class="mc-level ${level}" title="${esc(levelDesc[level]||'')}">${level}</span>`;
      }
      h+=`<div class="mc-id">${esc(c.source)} · ${esc(c.knowledge_id||c.id||'')}</div>`;
      // Case summary
      const summary=c.bug_summary||c.title||'';
      if(summary) h+=`<div class="mc-label">案例摘要</div><div class="mc-text">${esc(summary)}</div>`;

      // Build effective reasons: prefer match_reason from matcher; auto-synthesize when empty
      const rawReason=c.match_reason||{};
      let reason={...rawReason};
      if(!Object.keys(reason).length){
        // Synthesize reasoning by comparing crash features (cf) with case (c)
        if(level==='L1'){
          reason['_l1_fingerprint']='指纹精确命中：崩溃特征签名在案例指纹库中完全匹配';
        }
        if(cf.bug_type && c.bug_type){
          if(cf.bug_type===c.bug_type) reason['bug_type_match']=`bug_type 一致: ${cf.bug_type}`;
        }
        if(cf.rip_function && c.rip_function){
          if(cf.rip_function===c.rip_function) reason['rip_match']=`RIP 函数一致: ${cf.rip_function}`;
        }
        if(cf.bug_key && c.bug_key && cf.bug_key===c.bug_key){
          reason['bug_key_overlap']=`bug_key 语义一致: ${cf.bug_key}`;
        }
        // call_trace overlap
        const cfCt=Array.isArray(cf.call_trace_signature)?cf.call_trace_signature:[];
        const cCt=Array.isArray(c.call_trace_signature)?c.call_trace_signature:[];
        if(cfCt.length && cCt.length){
          const cfSet=new Set(cfCt.map(s=>s.toLowerCase()));
          const common=cCt.filter(f=>cfSet.has(f.toLowerCase()));
          if(common.length>=2){
            reason['call_trace_overlap']=`调用栈共同函数: ${common.slice(0,5).join(', ')} (${common.length}个)`;
          }
        }
        // module overlap
        const cfMods=Array.isArray(cf.related_modules)?cf.related_modules:[];
        const cMods=Array.isArray(c.related_modules)?c.related_modules:[];
        if(cfMods.length && cMods.length){
          const cfMSet=new Set(cfMods.map(s=>s.toLowerCase()));
          const commonMods=cMods.filter(m=>cfMSet.has(m.toLowerCase()));
          if(commonMods.length) reason['module_match']=`关联模块一致: ${commonMods.join(', ')}`;
        }
        // kernel version
        if(cf.kernel_version && Array.isArray(c.kernel_versions) && c.kernel_versions.length){
          const cfKv=cf.kernel_version.toLowerCase();
          const kvMatch=c.kernel_versions.some(kv=>kv && (kv.toLowerCase()===cfKv || kv.toLowerCase().startsWith(cfKv.split('.').slice(0,2).join('.'))));
          if(kvMatch) reason['kernel_version_match']=`内核版本匹配 (当前: ${cf.kernel_version})`;
        }
        // error keywords
        const cfEks=(cf.anomaly_features&&cf.anomaly_features.error_keywords)||[];
        const cEks=Array.isArray(c.error_keywords)?c.error_keywords:[];
        if(cfEks.length && cEks.length){
          const cfESet=new Set(cfEks.map(s=>s.toLowerCase()));
          const commonEks=cEks.filter(k=>cfESet.has(k.toLowerCase()));
          if(commonEks.length) reason['error_keyword_match']=`异常关键词一致: ${commonEks.join(', ')}`;
        }
        // L2/L3 without reason: note retrieval method
        if(level==='L2' && !Object.keys(reason).length){
          reason['_l2_rag']='RAG语义检索召回：综合评分达到匹配阈值';
        }
        if(level==='L3' && !Object.keys(reason).length){
          reason['_l3_expand']='扩大召回弱匹配：语义相似度较高，建议人工核验';
        }
      }

      // Match reasoning - structured rendering
      const reasonKeys=Object.keys(reason);
      if(reasonKeys.length){
        h+=`<div class="mc-label">匹配论证${level?' · '+level:''}</div>`;
        h+=`<ul class="mc-reason-list">`;
        // Chinese label mapping for known reason keys
        const reasonLabel={
          _l1_fingerprint:'指纹命中', _l2_rag:'检索方式', _l3_expand:'检索方式',
          bug_type_match:'崩溃类型', rip_match:'RIP函数一致', rip_consistency:'RIP函数一致',
          call_trace_overlap:'调用栈重叠', module_match:'模块匹配', kernel_version_match:'内核版本',
          phenomenon_similarity:'现象相似度', content_similarity:'内容/根因匹配',
          exact_token_match:'关键词精确命中', title_score:'标题匹配', content_score:'内容匹配',
          exact_token_score:'技术词命中', kernel_version_score:'版本匹配',
          commit_relevance:'补丁相关性', commit_summary:'补丁摘要',
          bug_key_overlap:'bug_key语义关联', error_keyword_match:'异常关键词一致',
          keyword_overlap:'共同关键词', rip_mismatch:'RIP函数不一致',
        };
        // Display order: L-level marker first, then positive matches, then warnings/negatives
        const priorityKeys=['_l1_fingerprint','_l2_rag','_l3_expand'];
        const positiveKeys=['bug_type_match','rip_match','rip_consistency','call_trace_overlap',
          'module_match','kernel_version_match','phenomenon_similarity','content_similarity',
          'exact_token_match','commit_relevance','commit_summary','bug_key_overlap',
          'error_keyword_match','keyword_overlap','title_score','content_score',
          'exact_token_score','kernel_version_score'];
        const negativeKeys=['rip_mismatch'];
        // Build ordered key list
        const orderedKeys=[];
        for(const k of priorityKeys){ if(reason[k]) orderedKeys.push(k); }
        for(const k of positiveKeys){ if(reason[k] && !orderedKeys.includes(k)) orderedKeys.push(k); }
        for(const k of reasonKeys){ if(!orderedKeys.includes(k) && !negativeKeys.includes(k)) orderedKeys.push(k); }
        for(const k of negativeKeys){ if(reason[k]) orderedKeys.push(k); }
        for(const k of orderedKeys){
          const v=reason[k];
          if(!v) continue;
          let liCls='';
          if(negativeKeys.includes(k)) liCls=' class="miss"';
          else if(k.startsWith('_l3')) liCls=' class="warn"';
          const label=reasonLabel[k]||k;
          h+=`<li${liCls}><b>${esc(label)}</b>：${esc(v)}</li>`;
        }
        h+=`</ul>`;
      }
      // Phenomenon as supplementary description (never as matching argument)
      if(c.phenomenon){
        h+=`<div class="mc-label">现象描述</div><div class="mc-text">${esc(c.phenomenon)}</div>`;
      }
      if(fp.length) h+=`<div class="mc-label">匹配指纹</div><div class="mc-chips">${fp.map(f=>`<span class="mc-chip">${esc(f)}</span>`).join('')}</div>`;
      if(c.root_cause) h+=`<div class="mc-label">案例根因</div><div class="mc-text">${esc(c.root_cause)}</div>`;
      if(c.solution) h+=`<div class="mc-label">案例解决方案</div><div class="mc-text">${esc(c.solution)}</div>`;
      if(c.hotpatch) h+=`<div class="mc-label">热补丁</div><div class="mc-text">${esc(c.hotpatch)}</div>`;
      h+='</div>';
    });
    h+='</div>';
    if(allCases.length>1){
      h+=`<div class="match-expand"><button id="match-expand-btn" onclick="toggleMatchCases()">展开全部 ${allCases.length} 条匹配</button></div>`;
    }
  }
  h+='</div>';

  document.getElementById('crash-match-body').innerHTML=h;
}

  if(sourceBadge) h+=sourceBadge;
  h+=`<span>${esc(wt.step_count??steps.length)} 个关键决策</span>`;
  if(sid) h+=`<span style="font-family:monospace;font-size:10px;opacity:.7">${esc(sid)}</span>`;
  if(dur) h+=`<span class="wf-duration">总耗时 ${dur}</span>`;
  h+=`</div>`;
  if(!steps.length){h+=`<div class="empty-line">无工作流记录</div>`;}
  steps.forEach(s=>{
    const isFail = s.status==='failed', isPartial = s.status==='partial', isSkip = s.status==='skipped';
    const dotCls = isFail?'fail':(isPartial?'partial':'');
    const stageLabel = (s.stage||'').replace(/_/g,' ');
    const stageCls = (s.stage||'').replace(/_/g,'-');
    let toolsHtml = '';
    (s.tools||[]).forEach(t=>{
      const tOk = t.status==='success' || t.status==='completed';
      const tWarn = t.status==='timeout' || t.status==='partial';
      const tErr = t.status==='failed' || t.status==='error';
      const tIcon = tOk ? '<span class="wf-tool-icon ok">✓</span>'
        : tWarn ? '<span class="wf-tool-icon warn">⏱</span>'
        : tErr ? '<span class="wf-tool-icon err">✗</span>'
        : '<span class="wf-tool-icon">•</span>';
      let durTxt = '';
      if(t.duration_ms!=null){
        durTxt = t.duration_ms<1000 ? t.duration_ms+'ms' : (t.duration_ms/1000).toFixed(1)+'s';
      }
      const title = t.title||'';
      toolsHtml += `<div class="wf-tool">${tIcon}<span class="wf-tool-title" title="${esc(t.tool_name+': '+title)}">${esc(t.tool_name)}${title?': '+esc(title):''}</span>${durTxt?`<span class="wf-tool-meta">${durTxt}</span>`:''}</div>`;
    });
    const statusText = s.status==='success'?'成功':s.status==='failed'?'失败':s.status==='partial'?'部分成功':s.status==='skipped'?'跳过':s.status||'';
    h+=`<div class="wf-step">`+
      `<div class="wf-dot-col"><div class="wf-dot ${dotCls}">${s.step}</div></div>`+
      `<div class="wf-card-col"><div class="wf-card">`+
        `<div class="wf-card-head"><span class="wf-stage ${esc(s.stage||'')}">${esc(stageLabel)}</span>`+
          `<span class="wf-step-status ${esc(s.status||'success')}">${esc(statusText)}</span></div>`+
        `<div class="wf-decision">${esc(s.decision||'')}</div>`+
        (s.observations?`<div class="wf-observations">${esc(s.observations)}</div>`:'')+
        (s.judgment?`<div class="wf-judgment">→ ${esc(s.judgment)}</div>`:'')+
        (s.reason?`<div class="wf-reason">⚠ ${esc(s.reason)}</div>`:'')+
        (toolsHtml?`<div class="wf-tools">${toolsHtml}</div>`:'')+
        `<div class="wf-time">${esc(s.start_time||'')} → ${esc(s.end_time||'')}</div>`+
      `</div></div></div>`;
  });
  document.getElementById('workflow-body').innerHTML=h;
}
const loadFull = EMBED_FULL ? Promise.resolve(EMBED_FULL) : fetchJSON(FULL_URL);
loadFull.then(report=>{
  const core=buildCore(report);
  renderHeader(core);renderHost(core);renderTrace(core);
  renderRootCause(core);renderProse('solution-body',core.solution);
  renderCrashMatch(report);renderWorkflow(report);
}).catch(err=>{
  document.getElementById('app').innerHTML=`<div class="error">加载失败: ${esc(err.message)}<br><br>需通过本地 HTTP 服务访问（如 <code>python3 -m http.server</code>），不能直接 file:// 打开。</div>`;
});
</script>
</body>
</html>
