<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内核崩溃报告 · Crash Report Viewer</title>
<style>
  :root {
    --bg: #eef1f6;
    --bg-grad: linear-gradient(135deg, #eef1f6 0%, #e6eaf2 100%);
    --card: #ffffff;
    --border: #e4e7eb;
    --text: #1f2329;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    --danger: #dc2626;
    --danger-soft: #fef2f2;
    --code-bg: #f8fafc;
    --code-border: #e2e8f0;
    --shadow: 0 1px 3px rgba(15,23,42,.06), 0 4px 12px rgba(15,23,42,.04);
    --shadow-lg: 0 8px 28px rgba(15,23,42,.10);
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg-grad);
    background-attachment: fixed;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 1100px; margin: 0 auto; padding: 28px 20px 80px; }
  .header {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 24px 28px; margin-bottom: 22px; box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .header::before { content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:linear-gradient(180deg,var(--danger),var(--accent)); }
  .header h1 { margin:0 0 10px; font-size:22px; display:flex; align-items:center; gap:10px; }
  .header .meta { color:var(--muted); font-size:13px; display:flex; gap:22px; flex-wrap:wrap; }
  .header .meta b { color:var(--text); font-weight:600; }
  .card {
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:20px 26px; margin-bottom:18px; box-shadow:var(--shadow);
  }
  .card h2 { margin:0 0 16px; font-size:15px; font-weight:600; display:flex; align-items:center; gap:9px; border-bottom:1px solid var(--border); padding-bottom:12px; }
  .card h2 .ico { font-size:16px; }
  .host-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; }
  .kv { display:flex; flex-direction:column; gap:3px; padding:8px 12px; background:var(--code-bg); border-radius:8px; border:1px solid var(--code-border); }
  .kv .k { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.3px; }
  .kv .v { color:var(--text); font-weight:600; word-break:break-all; }
  .bug-summary { background:var(--danger-soft); border-left:4px solid var(--danger); padding:14px 18px; border-radius:8px; font-weight:500; font-size:14.5px; }
  .bug-summary.empty { color:var(--muted); font-style:italic; font-weight:400; background:var(--code-bg); border-left-color:var(--code-border); }

  /* ===== 调用链路：Flex 流式蛇形 ===== */
  .chain-wrap { display:flex; flex-direction:column; align-items:center; padding:32px 0 16px; overflow:visible; }
  .chain {
    --nw:160px; --nh:40px; --gw:22px; --turn-h:48px;
    display:flex; flex-direction:column; align-items:stretch;
    width:calc(5 * var(--nw) + 4 * var(--gw));
    max-width:100%;
  }
  .chain-row { display:flex; align-items:center; justify-content:flex-start; height:var(--nh); }
  .chain-row.reverse { flex-direction:row-reverse; }
  .node {
    flex:0 0 var(--nw); width:var(--nw); min-width:0; height:var(--nh); padding:0 12px; border-radius:8px;
    background:var(--card); border:1.5px solid var(--accent); border-top-width:4px;
    font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace; font-size:12px;
    display:flex; align-items:center; white-space:nowrap;
    box-shadow:0 2px 8px rgba(37,99,235,0.12); position:relative; cursor:default;
  }
  .node .node-body { display:flex; align-items:center; gap:8px; flex:1; min-width:0; overflow:hidden; }
  .node .fname { flex:1; min-width:0; font-weight:600; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .node .tip{
    position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%);
    background:#1e293b; color:#f8fafc; padding:6px 12px; border-radius:6px;
    font-size:12px; font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    white-space:nowrap; font-weight:600; pointer-events:none; opacity:0;
    box-shadow:0 4px 14px rgba(15,23,42,.25); z-index:50; transition:opacity .15s;
  }
  .node .tip::after{
    content:""; position:absolute; top:100%; left:50%; transform:translateX(-50%);
    border:6px solid transparent; border-top-color:#1e293b;
  }
  .node { transition:box-shadow .15s, transform .15s, border-color .15s; }
  .node:hover { z-index:10; box-shadow:0 6px 20px rgba(37,99,235,.28); transform:translateY(-2px); border-color:var(--accent); }
  .node.crash:hover { box-shadow:0 6px 20px rgba(220,38,38,.32); border-color:var(--danger); }
  .node.entry:hover { box-shadow:0 6px 20px rgba(100,116,139,.25); border-color:#64748b; }
  .node.thunk:hover { box-shadow:0 6px 16px rgba(100,116,139,.18); border-color:#94a3b8; }
  .node:hover .tip { opacity:1; }
  .node .badge {
    font-size:10px; padding:2px 7px; border-radius:8px; font-weight:600; white-space:nowrap; flex-shrink:0;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
  }
  .node.crash { border-color:var(--danger); background:var(--danger-soft); box-shadow:0 2px 8px rgba(220,38,38,0.20); }
  .node.crash .fname { color:var(--danger); font-weight:700; }
  .node.crash .badge { background:var(--danger); color:#fff; }
  .node.entry { border-color:#94a3b8; background:#f8fafc; box-shadow:0 2px 8px rgba(148,163,184,0.18); }
  .node.entry .fname { color:#475569; }
  .node.entry .badge { background:#94a3b8; color:#fff; }
  .node.mid .badge { background:var(--accent-soft); color:var(--accent); }
  .node.thunk { background:#f8fafc; border-color:#e2e8f0; box-shadow:none; border-top-width:2px; border-radius:6px; }
  .node.thunk .fname { color:#94a3b8; font-weight:500; font-style:italic; }
  .node.thunk .badge { display:none; }

  .h-link { flex:0 0 var(--gw); height:2px; background:var(--accent); position:relative; align-self:center; }
  .h-link.crash { background:var(--danger); }
  .h-link::after {
    content:"▶"; position:absolute; right:-2px; top:50%; transform:translateY(-50%);
    font-size:12px; color:var(--accent); font-weight:700; line-height:1;
    text-shadow:0 0 3px #fff, -1px 0 0 #fff, 1px 0 0 #fff, 0 -1px 0 #fff, 0 1px 0 #fff;
  }
  .h-link.crash::after { color:var(--danger); }
  .chain-row.reverse .h-link::after { right:auto; left:-2px; content:"◀"; }

  .v-turn { flex:0 0 var(--turn-h); position:relative; width:100%; }
  .v-turn .v-line { position:absolute; top:0; bottom:0; width:2px; background:var(--accent); }
  .v-turn.right .v-line { right:calc(var(--nw)/2); }
  .v-turn.left  .v-line { left:calc(var(--nw)/2); }
  .v-turn.crash .v-line { background:var(--danger); }
  .v-turn::after {
    content:"▼"; position:absolute; bottom:-2px;
    font-size:12px; color:var(--accent); font-weight:700; line-height:1;
    text-shadow:0 0 3px #fff, -1px 0 0 #fff, 1px 0 0 #fff, 0 -1px 0 #fff, 0 1px 0 #fff;
  }
  .v-turn.right::after { right:calc(var(--nw)/2 - 6px); }
  .v-turn.left::after  { left:calc(var(--nw)/2 - 6px); }
  .v-turn.crash::after { color:var(--danger); }

  .fold-row { display:flex; justify-content:center; margin:8px 0; }
  .fold-btn {
    padding:8px 18px; border-radius:10px;
    background:repeating-linear-gradient(45deg,#f1f5f9,#f1f5f9 6px,#e2e8f0 6px,#e2e8f0 12px);
    border:1px dashed #94a3b8; color:#475569; font-size:13px; font-weight:600;
    cursor:pointer; user-select:none; font-family:inherit;
  }
  .fold-btn .pill { background:#fff; padding:1px 8px; border-radius:10px; border:1px solid #cbd5e1; margin-left:8px; font-size:11px; font-weight:600; }
  .fold-btn:hover { background:#e2e8f0; }
  .chain-legend {
    margin-top:14px; display:flex; gap:18px; flex-wrap:wrap; font-size:11px;
    color:var(--muted); align-items:center; justify-content:center; width:100%;
  }
  .chain-legend .dot { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:middle; }
  .chain-legend .dot.crash { background:var(--danger); }
  .chain-legend .dot.entry { background:#94a3b8; }
  .chain-legend .dot.mid { background:var(--accent); }
  .chain-legend .hint { margin-left:auto; color:#94a3b8; }

  .prose { white-space:pre-wrap; word-break:break-word; line-height:1.8; color:#334155; }
  details { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:14px; box-shadow:var(--shadow); overflow:hidden; }
  details[open] { box-shadow:var(--shadow-lg); }
  summary { padding:16px 26px; cursor:pointer; font-weight:600; font-size:14px; user-select:none; list-style:none; display:flex; align-items:center; gap:9px; }
  summary::-webkit-details-marker { display:none; }
  summary::before { content:"▸"; color:var(--accent); font-size:12px; display:inline-block; }
  details[open] summary::before { transform:rotate(90deg); }
  summary:hover { background:#f8fafc; }
  .detail-body { padding:0 26px 20px; }
  pre.json { background:var(--code-bg); border:1px solid var(--code-border); border-radius:8px; padding:16px; margin:0; overflow-x:auto; font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace; font-size:12.5px; line-height:1.6; max-height:540px; overflow-y:auto; }
  .json-key { color:#0369a1; } .json-str { color:#15803d; } .json-num { color:#b45309; } .json-bool { color:#7c3aed; } .json-null { color:var(--muted); }
  .round { border-left:2px solid var(--border); padding:10px 0 10px 18px; margin-bottom:6px; position:relative; }
  .round::before { content:""; position:absolute; left:-6px; top:16px; width:10px; height:10px; border-radius:50%; background:var(--accent); border:2px solid var(--card); }
  .round .rhead { font-weight:600; font-size:13px; display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .round .rhead .stage { color:var(--accent); }
  .round .rhead .status { font-size:11px; padding:2px 8px; border-radius:10px; background:#dcfce7; color:#166534; font-weight:600; }
  .round .rhead .status.fail { background:#fee2e2; color:#991b1b; }
  .round .rmeta { color:var(--muted); font-size:12px; margin:3px 0; }
  .round .rout { background:var(--code-bg); border:1px solid var(--code-border); border-radius:6px; padding:9px 12px; font-size:12px; margin-top:7px; white-space:pre-wrap; word-break:break-word; }
  .round .tools { margin-top:7px; display:flex; flex-direction:column; gap:4px; }
  .round .tool { font-size:11px; color:var(--muted); background:var(--code-bg); border:1px solid var(--code-border); border-radius:6px; padding:5px 9px; }
    /* 崩溃特征 & 知识库匹配 */
  .match-section { margin-bottom:22px; }
  .match-section:last-child { margin-bottom:0; }
  .match-section .sec-label { font-size:11px; color:var(--muted); margin:16px 0 10px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; }
  .match-section .sec-label:first-child { margin-top:0; }
  .match-section .host-grid { margin-bottom:4px; }
  .match-section .modules-chips { margin-bottom:4px; }
  .match-cases { display:flex; gap:12px; flex-wrap:wrap; }
  .match-cases.collapsed .match-case:not(:first-child) { display:none; }
  .match-case {
    flex:1; min-width:280px; background:var(--code-bg); border:1px solid var(--code-border);
    border-radius:10px; padding:14px 16px; position:relative; overflow:hidden;
  }
  .match-case .mc-score {
    display:inline-block; font-size:11px; font-weight:700; padding:2px 10px; border-radius:10px;
    margin-bottom:8px; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
  }
  .match-case .mc-score.high { background:#dcfce7; color:#166534; }
  .match-case .mc-score.mid { background:#fef3c7; color:#92400e; }
  .match-case .mc-score.low { background:#f1f5f9; color:#64748b; }
  .match-case .mc-id { font-size:11px; color:var(--muted); margin-bottom:4px; font-family:monospace; }
  .match-case .mc-label { font-size:11px; color:var(--muted); font-weight:600; margin:8px 0 4px; }
  .match-case .mc-text { font-size:13px; color:var(--text); line-height:1.6; }
  .match-case .mc-chips { display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }
  .match-case .mc-chip { font-size:10px; background:var(--accent-soft); color:var(--accent); border-radius:5px; padding:2px 7px; font-family:monospace; font-weight:500; }
  .match-expand { text-align:center; margin-top:10px; }
  .match-expand button {
    padding:6px 16px; border-radius:8px; border:1px dashed #94a3b8; background:transparent;
    color:#64748b; font-size:12px; cursor:pointer; font-family:inherit;
  }
  .match-expand button:hover { background:#f1f5f9; color:#475569; }
  .match-empty { color:var(--muted); font-style:italic; font-size:13px; }
  /* 根因分析三框 */
  .rc-grid { display:flex; flex-direction:column; gap:12px; }
  .rc-box { padding:12px 16px; border-radius:8px; border:1px solid var(--code-border); background:var(--code-bg); }
  .rc-box.phenomenon { border-left:4px solid var(--accent); }
  .rc-box.root-cause { border-left:4px solid var(--danger); }
  .rc-box.analysis { border-left:4px solid var(--muted); }
  .rc-label { font-size:11px; color:var(--muted); font-weight:600; display:block; margin-bottom:6px; }
  .rc-text { font-size:14px; line-height:1.8; color:#334155; white-space:pre-wrap; word-break:break-word; }
  .rc-text.empty { color:var(--muted); font-style:italic; }

  /* 异常特征样式 */
  .anomaly-grid { display:flex; flex-direction:column; gap:14px; }
  .anomaly-item { padding:10px 14px; background:var(--code-bg); border:1px solid var(--code-border); border-radius:8px; }
  .anomaly-label { font-size:11px; color:var(--muted); font-weight:600; display:block; margin-bottom:8px; }
  .anomaly-list { display:flex; flex-direction:column; gap:5px; }
  .anomaly-row { font-size:12px; font-family:monospace; padding:6px 10px; background:#fff; border:1px solid var(--code-border); border-radius:6px; color:var(--text); }
  .anomaly-code { max-height:180px; font-size:11.5px; white-space:pre-wrap; word-break:break-all; margin:0; padding:10px 12px; }
  .chip-warn { background:#fef3c7; color:#92400e; border-color:#fcd34d; }

.empty-line { color:var(--muted); font-style:italic; }
  .error { color:var(--danger); padding:28px; text-align:center; }
  .sec-label { font-size:11px; color:var(--muted); margin:12px 0 6px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; }
  .modules-chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-size:11px; background:var(--code-bg); border:1px solid var(--code-border); border-radius:6px; padding:3px 8px; font-family:monospace; }
  code { background:var(--code-bg); border:1px solid var(--code-border); border-radius:4px; padding:1px 5px; font-family:monospace; font-size:12px; }
</style>
</head>
<body>
<div class="container" id="app">
  <div class="header">
    <h1 id="header-title"><span>📋</span> 加载中…</h1>
    <div class="meta" id="header-meta">加载中…</div>
  </div>
  <div id="core-section">
    <div class="card" id="host-card"><h2><span class="ico">🖥️</span> 宿主机信息</h2><div id="host-body"></div></div>
    <div class="card"><h2><span class="ico">🔍</span> 根因分析</h2><div id="rootcause-body"></div></div>
    <div class="card"><h2><span class="ico">🛠️</span> 解决方案</h2><div id="solution-body"></div></div>
    <div class="card"><h2><span class="ico">🔗</span> 调用链路</h2><div id="trace-body"></div></div>
    <details id="crash-match-details"><summary>🔬 崩溃特征 & 知识库匹配</summary><div class="detail-body" id="crash-match-body"></div></details>
  </div>
  <div id="details-section">
<details><summary>工作流追踪（Round History）</summary><div class="detail-body" id="workflow-body"></div></details>
  </div>
</div>
<script>
const FULL_URL='report.json';
const EMBED_FULL = /*__FULL_DATA__*/null;
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function fetchJSON(url){return fetch(url).then(r=>{if(!r.ok)throw new Error(url+' HTTP '+r.status);return r.json();});}

// 从 report.json 提取渲染所需的精简视图字段（core 视图）
function buildCore(report){
  const cf=report.crash_feature_info||{};
  const ra=report.root_cause_analysis||{};
  const hb=report.host_base_info||{};
  return {
    report_id: report.report_id,
    crash_time: cf.crash_time,
    bug_summary: cf.bug_summary,
    host: {
      host_name: hb.host_name, machine_model: hb.machine_model, cpu_model: hb.cpu_model,
      cpu_num: hb.cpu_num, kernel_version: hb.kernel_version, memory_size: hb.memory_size,
    },
    call_trace: cf.call_trace_signature||[],
    phenomenon: ra.phenomenon,
    root_cause: ra.root_cause,
    analysis: ra.analysis,
    solution: ra.solution,
  };
}

function renderHeader(core){
  const h=(core.host||{});
  const d=String(core.crash_time||'').slice(0,10);
  document.getElementById('header-title').innerHTML=`<span>📋</span> ${d?esc(d)+' · ':''}${esc(core.bug_summary||'内核崩溃报告')}`;
  document.getElementById('header-meta').innerHTML=
    `<span>报告ID: <b>${esc(core.report_id)}</b></span>`+
    `<span>崩溃时间: <b>${esc(core.crash_time)}</b></span>`+
    `<span>主机: <b>${esc(h.host_name)}</b></span>`+
    `<span>内核: <b>${esc(h.kernel_version)}</b></span>`;
}
function renderHost(core){
  const h=core.host||{};
  const fs=[['主机名',h.host_name],['机型',h.machine_model],['CPU',h.cpu_model],['CPU 数',h.cpu_num],['内核版本',h.kernel_version],['内存',h.memory_size]];
  document.getElementById('host-body').innerHTML=`<div class="host-grid">${fs.map(([k,v])=>`<div class="kv"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join('')}</div>`;
}

/* ============ 调用链路：Flex 流式蛇形 ============ */
const THUNK_PATTERNS=[/^srso_alias_/,/^srso_/,/^ret_from_fork/,/^entry_SYSCALL_/,/^asm_sysvec_/,/^asm_exc_/,/__x86_return_thunk/,/__retain_return_poison/,/__cfi_/];
const isThunk=fn=>THUNK_PATTERNS.some(re=>re.test(fn));
const ROW_LEN=5, FOLD_THRESHOLD=12, HEAD_SHOW=2, TAIL_SHOW=3;
const UNIT=182; // 节点宽 160 + 间隙 22 = 182

function nodeHTML(fn,i,n){
  let cls='mid', badge=`#${n-i}`;
  if(isThunk(fn)) cls+=' thunk';
  if(i===0){cls=cls.replace('mid','entry'); badge='入口';}
  else if(i===n-1){cls=cls.replace('mid','crash'); badge='崩溃点';}
  return `<div class="node ${cls}" title="${esc(fn)}" data-fn="${esc(fn)}"><span class="tip">${esc(fn)}</span><div class="node-body"><span class="fname">${esc(fn)}</span><span class="badge">${badge}</span></div></div>`;
}

// 渲染从 from 到 to（含）的连续段
function snakeSegment(order, from, to, n){
  const html=[];
  const startRow=Math.floor(from/ROW_LEN);
  const endRow=Math.floor(to/ROW_LEN);
  for(let r=startRow;r<=endRow;r++){
    const isReverse=(r%2===1);
    const idxs=[];
    for(let i=r*ROW_LEN;i<=Math.min((r+1)*ROW_LEN-1,n-1);i++) if(i>=from&&i<=to) idxs.push(i);
    if(!idxs.length) continue;
    const hasNext=(r<endRow);
    const firstCol=idxs[0]%ROW_LEN;
    const lastCol=idxs[idxs.length-1]%ROW_LEN;

    // v-turn (vertical connector between rows)
    if(r>startRow){
      const side=isReverse?'right':'left';
      const crashTurn=(idxs[0]-1===n-2);
      html.push(`<div class="v-turn ${side}${crashTurn?' crash':''}"><div class="v-line"></div></div>`);
    }
    // Build row content
    let parts=[];
    // Helper: push nodes and h-links in DOM order (always ascending idx)
    for(let k=0;k<idxs.length;k++){
      parts.push(nodeHTML(order[idxs[k]],idxs[k],n));
      if(k<idxs.length-1){
        const cl=(idxs[k]===n-2)?' h-link crash':' h-link';
        parts.push(`<div class="${cl}"></div>`);
      }
    }
    // Spacers to align start/end to grid columns (only when row has a turn)
    if(hasNext){
      if(!isReverse){
        // Forward row: leading spacer pushes first node to col=firstCol, trailing fills to end
        if(firstCol>0) parts.unshift(`<div style="flex:0 0 ${firstCol*UNIT}px"></div>`);
        const trail=ROW_LEN-1-lastCol;
        if(trail>0) parts.push(`<div style="flex:0 0 ${trail*UNIT}px"></div>`);
      } else {
        // Reverse row (flex-direction:row-reverse): DOM-asc gets displayed right-to-left.
        // DOM first item (smallest idx = highest col in reverse) appears at visual right.
        // To align it to the rightmost column (col=4 in full row), add trailing spacer in DOM.
        const trail=ROW_LEN-1-firstCol;
        if(trail>0) parts.push(`<div style="flex:0 0 ${trail*UNIT}px"></div>`);
        // DOM last item (largest idx in this row chunk = col=lastCol asc) appears at visual left.
        // Add leading spacer in DOM to push it to col=0 alignment.
        if(lastCol>0) parts.unshift(`<div style="flex:0 0 ${lastCol*UNIT}px"></div>`);
      }
    }
    html.push(`<div class="chain-row${isReverse?' reverse':''}">${parts.join('')}</div>`);
  }
  return html.join('');
}

function renderTrace(core){
  const t=core.call_trace||[];
  const el=document.getElementById('trace-body');
  if(!t.length){el.innerHTML=`<div class="empty-line">无调用栈数据</div>`;return;}
  const order=t.slice().reverse();
  const n=order.length;
  const folded=n>FOLD_THRESHOLD;

  const legend=`<div class="chain-legend">
    <span><span class="dot entry"></span>调用入口</span>
    <span><span class="dot mid"></span>中间路径</span>
    <span><span class="dot crash"></span>崩溃触发点</span>
  </div>`;

  const renderAll=()=>{
    const body=snakeSegment(order,0,n-1,n);
    el.innerHTML=`<div class="chain-wrap"><div class="chain">${body}</div>${legend}</div>`;
  };
  const renderFolded=()=>{
    const tailStart=n-TAIL_SHOW;
    const skipped=tailStart-HEAD_SHOW;
    const head=snakeSegment(order,0,HEAD_SHOW-1,n);
    const tail=snakeSegment(order,tailStart,n-1,n);
    const body=head+
      `<div class="fold-row"><button class="fold-btn" id="fold-expand">⋯ 省略中间 <b>${skipped}</b> 层<span class="pill">点击展开</span></button></div>`+
      tail;
    el.innerHTML=`<div class="chain-wrap"><div class="chain">${body}</div>${legend}</div>`;
    document.getElementById('fold-expand').addEventListener('click',renderAll);
  };
  folded?renderFolded():renderAll();
}

function renderProse(id,val){document.getElementById(id).innerHTML=val?`<div class="prose">${esc(val)}</div>`:`<div class="empty-line">无</div>`;}
function renderRootCause(core){
  const blocks=[];
  blocks.push(`<div class="rc-box phenomenon"><span class="rc-label">🔎 现象</span><div class="rc-text">${core.phenomenon?esc(core.phenomenon):'<span class="empty">无</span>'}</div></div>`);
  blocks.push(`<div class="rc-box root-cause"><span class="rc-label">🎯 根因</span><div class="rc-text">${core.root_cause?esc(core.root_cause):'<span class="empty">无</span>'}</div></div>`);
  if(core.analysis) blocks.push(`<div class="rc-box analysis"><span class="rc-label">🧠 深度分析</span><div class="rc-text">${esc(core.analysis)}</div></div>`);
  document.getElementById('rootcause-body').innerHTML=`<div class="rc-grid">${blocks.join('')}</div>`;
}
function hlJSON(obj){
  let s=JSON.stringify(obj,null,2);
  s=s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return s.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g,m=>{
    let cls='json-num';
    if(/^"/.test(m))cls=/:$/.test(m)?'json-key':'json-str';
    else if(/true|false/.test(m))cls='json-bool';
    else if(/null/.test(m))cls='json-null';
    return `<span class="${cls}">${m}</span>`;
  });
}
const preJSON=o=>`<pre class="json">${hlJSON(o)}</pre>`;
function renderAnomaly(an){
  let a='<div class="anomaly-grid">';
  // error_keywords
  if(an.error_keywords&&an.error_keywords.length) a+=`<div class="anomaly-item"><span class="anomaly-label">🔑 错误关键词</span><div class="modules-chips">${an.error_keywords.map(k=>`<span class="chip chip-warn">${esc(k)}</span>`).join('')}</div></div>`;
  // repeated_errors
  if(an.repeated_errors&&an.repeated_errors.length) a+=`<div class="anomaly-item"><span class="anomaly-label">🔄 重复错误</span><div class="anomaly-list">${an.repeated_errors.map(e=>`<div class="anomaly-row">${esc(e)}</div>`).join('')}</div></div>`;
  // register_values
  if(an.register_values&&Object.keys(an.register_values).length) a+=`<div class="anomaly-item"><span class="anomaly-label">📋 寄存器值</span><div class="host-grid">${Object.entries(an.register_values).map(([k,v])=>`<div class="kv"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join('')}</div></div>`;
  // pre_crash_events
  if(an.pre_crash_events&&an.pre_crash_events.length) a+=`<div class="anomaly-item"><span class="anomaly-label">⏪ 崩溃前事件</span><div class="anomaly-list">${an.pre_crash_events.map(e=>`<div class="anomaly-row">${esc(e)}</div>`).join('')}</div></div>`;
  // dump_stack_context
  if(an.dump_stack_context) a+=`<div class="anomaly-item"><span class="anomaly-label">📜 Dump Stack 上下文</span><pre class="json anomaly-code">${esc(an.dump_stack_context)}</pre></div>`;
  // cpu_context
  if(an.cpu_context) a+=`<div class="anomaly-item"><span class="anomaly-label">🖥️ CPU 上下文</span><pre class="json anomaly-code">${esc(an.cpu_context)}</pre></div>`;
  a+='</div>';
  return a;
}
function renderCrashMatch(report){
  const cf=report.crash_feature_info||{};
  const diag=report.diagnosis_repair_result||{};
  const inr=diag.internal_kernel_result||[], com=diag.community_kernel_result||[];
  const allCases=[...inr.map(c=>({...c,source:'内部知识库'})),...com.map(c=>({...c,source:'社区案例'}))];
  const scoreOrder={高:0,中:1,低:2};
  allCases.sort((a,b)=>(scoreOrder[a.match_score]??9)-(scoreOrder[b.match_score]??9));

  const rm=cf.related_modules||[], an=cf.anomaly_features||{};
  const sig=cf.call_trace_signature||[];
  const rows=[['signature',cf.signature],['bug_type',cf.bug_type],['bug_key',cf.bug_key],['rip',cf.rip],['rip_function',cf.rip_function],['rip_offset',cf.rip_offset]];

  let h='<div class="match-section">';
  h+=`<div class="sec-label">📊 崩溃特征</div>`;
  h+=`<div class="host-grid">${rows.map(([k,v])=>`<div class="kv"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join('')}</div>`;
  if(rm.length) h+=`<div class="sec-label">关联模块</div><div class="modules-chips">${rm.map(m=>`<span class="chip">${esc(m)}</span>`).join('')}</div>`;
  if(Object.keys(an).length) h+=`<div class="sec-label">异常特征</div>${renderAnomaly(an)}`;
  if(sig.length) h+=`<div class="sec-label">调用栈签名</div><div class="modules-chips">${sig.map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</div>`;
  h+='</div>';

  h+='<div class="match-section">';
  h+=`<div class="sec-label">📚 知识库案例匹配 (${allCases.length} 条)</div>`;
  if(!allCases.length){
    h+='<div class="match-empty">无匹配案例</div>';
  } else {
    const scoreCls={高:'high',中:'mid',低:'low'};
    h+=`<div class="match-cases${allCases.length>1?' collapsed':''}" id="match-cases">`;
    allCases.forEach((c,i)=>{
      const fp=c.fingerprints||[];
      h+=`<div class="match-case">`;
      h+=`<span class="mc-score ${scoreCls[c.match_score]||'low'}">${esc(c.match_score||'—')}匹配</span>`;
      h+=`<div class="mc-id">${esc(c.source)} · ${esc(c.knowledge_id||'')}</div>`;
      if(c.bug_summary) h+=`<div class="mc-label">案例摘要</div><div class="mc-text">${esc(c.bug_summary)}</div>`;
      if(c.phenomenon) h+=`<div class="mc-label">匹配论证</div><div class="mc-text">${esc(c.phenomenon)}</div>`;
      if(fp.length) h+=`<div class="mc-label">匹配指纹</div><div class="mc-chips">${fp.map(f=>`<span class="mc-chip">${esc(f)}</span>`).join('')}</div>`;
      if(c.root_cause) h+=`<div class="mc-label">案例根因</div><div class="mc-text">${esc(c.root_cause)}</div>`;
      if(c.solution) h+=`<div class="mc-label">案例解决方案</div><div class="mc-text">${esc(c.solution)}</div>`;
      h+='</div>';
    });
    h+='</div>';
    if(allCases.length>1){
      h+=`<div class="match-expand"><button id="match-expand-btn" onclick="toggleMatchCases()">展开全部 ${allCases.length} 条匹配</button></div>`;
    }
  }
  h+='</div>';

  document.getElementById('crash-match-body').innerHTML=h;
}
function toggleMatchCases(){
  const el=document.getElementById('match-cases');
  const btn=document.getElementById('match-expand-btn');
  const collapsed=el.classList.toggle('collapsed');
  const total=el.querySelectorAll('.match-case').length;
  btn.textContent=collapsed?`展开全部 ${total} 条匹配`:`收起 (仅显示首条)`;
}
function renderWorkflow(report){
  const wt=report.workflow_trace||{}, rh=wt.round_history||[];
  let h=`<div class="sec-label">round_count: ${esc(wt.round_count??'—')}</div>`;
  if(!rh.length){h+=`<div class="empty-line">无工作流记录</div>`;}
  rh.forEach(r=>{
    const st=esc(r.status||''), fc=/fail|error/i.test(st)?'fail':'';
    let ts='';
    (r.tool_calls||[]).forEach(tc=>{ts+=`<div class="tool"><b>${esc(tc.tool_name)}</b> · ${esc(tc.start_time||'')} → ${esc(tc.end_time||'')}</div>`;});
    h+=`<div class="round">
      <div class="rhead"><span>R${esc(r.round)}</span><span class="stage">${esc(r.agent_name||'')} / ${esc(r.stage||'')}</span><span class="status ${fc}">${st}</span></div>
      <div class="rmeta">${esc(r.start_time||'')} → ${esc(r.end_time||'')}${r.reason?' · '+esc(r.reason):''}</div>
      ${r.output?`<div class="rout">${esc(r.output)}</div>`:''}
      ${ts?`<div class="tools">${ts}</div>`:''}
    </div>`;
  });
  document.getElementById('workflow-body').innerHTML=h;
}
const loadFull = EMBED_FULL ? Promise.resolve(EMBED_FULL) : fetchJSON(FULL_URL);
loadFull.then(report=>{
  const core=buildCore(report);
  renderHeader(core);renderHost(core);renderTrace(core);
  renderRootCause(core);renderProse('solution-body',core.solution);
  renderCrashMatch(report);renderWorkflow(report);
}).catch(err=>{
  document.getElementById('app').innerHTML=`<div class="error">加载失败: ${esc(err.message)}<br><br>需通过本地 HTTP 服务访问（如 <code>python3 -m http.server</code>），不能直接 file:// 打开。</div>`;
});
</script>
