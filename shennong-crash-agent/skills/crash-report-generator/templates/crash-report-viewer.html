/* 案例判定徽标 */
function verdictBadge(v){
  if(!has(v)) return '';
  const vv = String(v).toLowerCase();
  let color = '#8a8f8c';
  if(/确认|confirmed|已修复|可直接采用/.test(vv)) color = '#2e7d5b';
  else if(/same_area|同域|同子系统|需适配/.test(vv)) color = '#926321';
  else if(/not_relevant|无关|不适用|未验证|unverified/.test(vv)) color = '#8a8f8c';
  return `<span style="display:inline-block;margin-left:6px;padding:0 7px;border-radius:10px;background:${color};color:#fff;font-size:11px;vertical-align:middle;white-space:nowrap;flex-shrink:0">${esc(v)}</span>`;
}

function relevanceBadge(v){
  if(!has(v)) return '';
  const vv = String(v).toLowerCase();
  let color = '#8a8f8c';
  if(/强相关/.test(vv)) color = '#b04a4a';  /* 强相关=与崩溃最直接相关，红色醒目警示 */
  else if(/confirmed|可直接采用/.test(vv)) color = '#2e7d5b';
  else if(/部分相关|一般相关|same_area|同域/.test(vv)) color = '#926321';
  else if(/弱相关|not_relevant|无关|不适用|未验证|unverified/.test(vv)) color = '#8a8f8c';
  return `<span style="display:inline-block;margin-left:6px;padding:0 7px;border-radius:10px;background:${color}22;color:${color};border:1px solid ${color}55;font-size:11px;vertical-align:middle;white-space:nowrap;flex-shrink:0">${esc(v)}</span>`;
}

function renderCorroboration(rows){
  if(!Array.isArray(rows) || !rows.length) return '';
  const dimNames = {
    feature_data:'崩溃特征', kernel_version:'内核版本', execution_context:'执行上下文',
    timeline:'时间线', mechanism:'触发机制', fix_scope:'修复口径'
  };
  let h = `<table class="corrob-table"><thead><tr><th>维度</th><th>判定</th><th>本次现场</th><th>参考案例</th></tr></thead><tbody>`;
  rows.forEach(r=>{
    const v = String(r.verdict||'').toLowerCase();
    const state = v==='support' ? '支持' : v==='partial' ? '部分支持' : v==='mismatch' ? '不匹配' : (r.verdict || '');
    const cls = v==='support' ? 'corrob-support' : (v==='mismatch' ? 'corrob-mismatch' : 'corrob-partial');
    h += `<tr class="${cls}"><td>${esc(dimNames[r.dimension] || r.dimension || '')}</td><td><b>${esc(state)}</b></td><td>${esc(r.current||'')}</td><td>${esc(r.reference||'')}</td></tr>`;
  });
  h += `</tbody></table>`;
  return h;
}

/* 递归渲染键值（含数组/对象） */
function renderValue(key, value){
  let out = '';
  if(value==null || value==='') return '';
  if(Array.isArray(value)){
    if(!value.length) return '';
    out += `<div class="raw-row"><b>${esc(key)}</b></div>`;
    value.forEach((item,idx)=>{
      if(typeof item==='object' && item!=null){
        out += `<div class="raw-row"><b>条目 ${idx+1}</b></div>`;
        Object.keys(item).forEach(k=>{ out += renderValue(k, item[k]); });
      } else if(item!=null && String(item).trim()!==''){
        out += `<div class="raw-row"><p>${idx+1}. ${linkify(String(item))}</p></div>`;
      }
    });
  } else if(typeof value==='object'){
    out += `<div class="raw-row"><b>${esc(key)}</b></div>`;
    Object.keys(value).forEach(k=>{ out += renderValue(k, value[k]); });
  } else {
    out += `<div class="raw-row"><b>${esc(key)}</b><p>${linkify(String(value))}</p></div>`;
  }
  return out;
}

function renderCaseCard(c, i, source, caseId){
  const used = new Set();  /* 动态记录实际渲染过的字段，「查看完整字段」只兜底真正未展示的字段，杜绝静默丢失 */
  const isCommit = c.kind === 'commit' || source === '在线案例';
  const vLower = String(c.verdict||'').toLowerCase();
  const basisCited = vLower !== 'confirmed' && isBasisCited(c, basisRefs());
  const citedBadge = basisCited ? `<span class="tag tag-green">方案引用</span>` : '';

  /* 标题：只标记实际采用的字段，其余同义字段落入完整字段 */
  const titleKey = has(c.title)?'title':has(c.subject)?'subject':has(c.bug_summary)?'bug_summary':has(c.knowledge_id)?'knowledge_id':'';
  const title = titleKey ? c[titleKey] : ('案例 '+(i+1));
  if(titleKey) used.add(titleKey);

  /* meta pills（commit 附短 sha） */
  const shaShort = (isCommit && has(c.sha)) ? String(c.sha).slice(0,12) : '';
  if(shaShort) used.add('sha');
  const meta = [source, c.kind, c.verdict, c.match_level, c.kernel_version, c.date, shaShort].filter(has);
  ['kind','verdict','match_level','kernel_version','date'].forEach(k=>{ if(has(c[k])) used.add(k); });

  let h = `<article class="case-card"${caseId ? ` id="${caseId}"` : ''}><div class="case-head"><h4>${esc(title)}</h4>${verdictBadge(c.verdict||'')}${relevanceBadge(c.relevance||'')}${citedBadge}</div>`;
  if(meta.length) h += `<div class="case-meta">${meta.map(v=>`<span class="case-pill">${esc(v)}</span>`).join('')}</div>`;
  if(has(c.relevance)) used.add('relevance');

  /* 一句话摘要 */
  if(has(c.lead)){ h += `<p class="case-lead">${esc(c.lead)}</p>`; used.add('lead'); }

  const v = vLower;

  /* confirmed commit：匹配与修复论证合并为一个区域 */
  if(isCommit && v === 'confirmed'){
    h += `<div class="case-section case-fix-section"><b>为什么这个 commit 能修复当前问题</b>`;
    if(has(c.how)){ h += `<p>${linkify(c.how)}</p>`; used.add('how'); }
    if(has(c.fix_scope)){ h += `<p><b>修复范围：</b>${linkify(c.fix_scope)}</p>`; used.add('fix_scope'); }
    if(has(c.files) && toArr(c.files).length){ h += `<p><b>涉及文件：</b>${esc(toArr(c.files).join(' · '))}</p>`; used.add('files'); }
    if(has(c.diff)){ h += `<details class="case-extra"><summary>补丁 diff 摘录<span class="chevron" aria-hidden="true"></span></summary><div class="detail-body"><pre><code>${esc(c.diff)}</code></pre></div></details>`; used.add('diff'); }
    h += `</div>`;
  } else {
    /* 匹配论证：为什么这条资料与本次宕机有关 */
    h += `<div class="case-section"><b>匹配论证</b>`;
    if(source === '内部案例' && Array.isArray(c.corroboration) && c.corroboration.length){
      h += renderCorroboration(c.corroboration); used.add('corroboration');
      if(has(c.applicability)){ h += `<p class="case-applicability"><b>采用前提：</b>${linkify(c.applicability)}</p>`; used.add('applicability'); }
    } else {
      if(has(c.how)){ h += `<p>${linkify(c.how)}</p>`; used.add('how'); }
    }
    h += `</div>`;
  }

  /* 现象 / 根因 */
  const phenomenon = c.phenomenon || c.bug_summary || (source === '社区案例' || source === '社区邮件' || source === '社区会议' ? c.excerpt : '');
  if(has(phenomenon)){
    h += `<div class="case-section"><b>${has(c.phenomenon)||has(c.bug_summary)?'现象':'关键摘录'}</b><p>${linkify(phenomenon)}</p></div>`;
    if(has(c.phenomenon)) used.add('phenomenon');
    else if(has(c.bug_summary)) used.add('bug_summary');
    else if(has(c.excerpt)) used.add('excerpt');
  }
  if(has(c.root_cause)){ h += `<div class="case-section"><b>根因</b><p>${linkify(c.root_cause)}</p></div>`; used.add('root_cause'); }

  /* 非 confirmed commit 的适用性说明（补齐涉及文件与 diff）；非 commit 的修复方案 */
  if(isCommit && v !== 'confirmed'){
    h += `<div class="case-section"><b>${basisCited ? '与推荐方案的关系' : '适用性 / 参考性说明'}</b>`;
    if(has(c.how)){ h += `<p><b>与本次的关联：</b>${linkify(c.how)}</p>`; used.add('how'); }
    if(has(c.fix_scope)){ h += `<p><b>${basisCited ? '采用方式 / 限制' : '为什么不能直接采用'}：</b>${linkify(c.fix_scope)}</p>`; used.add('fix_scope'); }
    if(has(c.files) && toArr(c.files).length){ h += `<p><b>涉及文件：</b>${esc(toArr(c.files).join(' · '))}</p>`; used.add('files'); }
    if(!has(c.how) && !has(c.fix_scope) && has(c.applicability)){ h += `<p>${linkify(c.applicability)}</p>`; used.add('applicability'); }
    if(has(c.diff)){ h += `<details class="case-extra"><summary>补丁 diff 摘录<span class="chevron" aria-hidden="true"></span></summary><div class="detail-body"><pre><code>${esc(c.diff)}</code></pre></div></details>`; used.add('diff'); }
    h += `</div>`;
  } else if(!isCommit && has(c.solution)) {
    h += `<div class="case-section"><b>修复方案</b><p>${linkify(c.solution)}</p></div>`; used.add('solution');
  }

  /* 原文摘录（excerpt 未作为现象展示时，折叠展示，不再静默丢失） */
  if(has(c.excerpt) && !used.has('excerpt')){
    h += `<details class="case-extra"><summary>原文摘录<span class="chevron" aria-hidden="true"></span></summary><div class="detail-body"><p>${linkify(c.excerpt)}</p></div></details>`;
    used.add('excerpt');
  }

  /* 适用性（避免与前面分支重复渲染） */
  if(has(c.applicability) && source !== '内部案例' && !used.has('applicability')){ h += `<div class="case-section"><b>适用性 / 采用前提</b><p>${linkify(c.applicability)}</p></div>`; used.add('applicability'); }

  /* 匹配指纹（内部案例） */
  if(source === '内部案例' && Array.isArray(c.fingerprints) && c.fingerprints.length){
    h += `<div class="case-section"><b>匹配指纹</b><p class="case-fingerprints">${c.fingerprints.map(f=>`<span class="case-pill">${esc(f)}</span>`).join('')}</p></div>`;
    used.add('fingerprints');
  }

  /* 原始资料链接 */
  const url = c.url || c.patch_url;
  if(has(url)){ h += `<a class="case-link" href="${esc(url)}" target="_blank" rel="noopener noreferrer">查看原始资料 ↗</a>`; used.add(has(c.url)?'url':'patch_url'); }

  /* 其余字段（兜底：上方未实际渲染的字段都在此展示，已渲染的不重复出现） */
  const extras = Object.keys(c).filter(k=>!used.has(k));
  if(extras.length){
    h += `<details class="case-extra"><summary>查看其余字段（未在上方展示）<span class="chevron" aria-hidden="true"></span></summary><div class="detail-body">`;
    extras.forEach(k=>{ h += renderValue(k,c[k]); });
    h += `</div></details>`;
  }
  return h + `</article>`;
}

/* 修复依据引用集合：来自 standard_solution.basis 与 patch_list（url + sha） */
function basisRefs(){
  const refs = {urls:new Set(), shas:new Set()};
  toArr(ss && ss.basis).forEach(b=>{
    if(has(b.url)) refs.urls.add(String(b.url).trim());
    const t = [b.title, b.url, b.text].filter(has).join(' ');
    (t.match(/\b[0-9a-f]{7,40}\b/g)||[]).forEach(s=>refs.shas.add(s.toLowerCase()));
  });
  toArr(ss && ss.patch_list).forEach(p=>{
    if(has(p.sha)) refs.shas.add(String(p.sha).toLowerCase());
    if(has(p.url)) refs.urls.add(String(p.url).trim());
  });
  return refs;
}

/* 判断案例是否被修复方案引用（url 相等或 sha 前缀互含） */
function isBasisCited(c, refs){
  if(!c || !refs) return false;
  const urls = [c.url, c.patch_url].filter(has).map(u=>String(u).trim());
  if(urls.some(u=>refs.urls.has(u))) return true;
  const text = [c.sha, c.url, c.patch_url, c.patch_ref, c.title].filter(has).join(' ').toLowerCase();
  for(const sha of refs.shas){
    if(sha.length >= 7 && text.includes(sha)) return true;
  }
  return false;
}

/* ===== ⑤ 技术附件 ===== */
function renderAppendix(){
  let h = `<section class="section" id="appendix" aria-labelledby="appendix-title">`;
  h += `<div class="section-heading"><span class="section-no">05</span><h2 id="appendix-title">技术附件</h2></div>`;
  h += `<p class="section-intro">需要复核或继续排查时，再查看这些材料。</p>`;
  const attachmentLogCount = toArr((cf.log_features||{}).related_errors).length + toArr((cf.log_features||{}).repeated).length + toArr((cf.log_features||{}).other).length;
  const attachmentCaseCount = ['internal_kernel_result','community_kernel_result','community_meetings','online_result'].reduce((n,k)=>n+toArr(diag[k]).length,0);
  const attachmentStepCount = toArr(wt.steps).length;
  h += `<div class="appendix-stats"><div class="appendix-stat"><div class="appendix-stat-label">日志特征</div><div class="appendix-stat-value">${attachmentLogCount}</div></div><div class="appendix-stat"><div class="appendix-stat-label">案例资料</div><div class="appendix-stat-value">${attachmentCaseCount}</div></div><div class="appendix-stat"><div class="appendix-stat-label">诊断步骤</div><div class="appendix-stat-value">${attachmentStepCount}</div></div></div>`;

  /* 主机与运行环境（附件第一卡） */
  {
    const envDefs = [];
    const pushEnv = (k,v)=>{ if(has(v)) envDefs.push([k,String(v)]); };
    pushEnv('主机', host.host_name);
    pushEnv('内核版本', host.kernel_version);
    pushEnv('CPU', host.cpu_model);
    if(host.cpu_num!=null) pushEnv('CPU 数量', host.cpu_num);
    pushEnv('内存', host.memory_size);
    pushEnv('机型', host.machine_model);
    pushEnv('异常类型', cf.bug_type ? String(cf.bug_type).replace(/_/g,' ') : '');
    pushEnv('故障地址', faultAddr());
    pushEnv('现场进程', sceneContext());
    pushEnv('崩溃位置', cf.rip_function ? (cf.rip_function+(cf.rip_offset?('+'+cf.rip_offset):'')) : '');
    pushEnv('报告 ID', R.report_id);
    if(envDefs.length){
      h += `<div class="appendix-card"><details><summary><span class="appendix-summary-label">主机与运行环境</span><span class="chevron" aria-hidden="true"></span></summary><div class="detail-body"><dl class="env-grid">`;
      envDefs.forEach(([k,v])=>{ h += `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`; });
      if(toArr(host.modules).length) h += `<dt>加载模块</dt><dd>${toArr(host.modules).length} 个</dd>`;
      h += `</dl></div></details></div>`;
    }
  }

  /* 宕机栈（自「宕机现场」章移入，默认收起） */
  {
    const log = String(cf.call_trace_text || '');
    const trace = log.split(/Call trace:/i)[1] || '';
    const loggedFrames = trace.split('\n').map(line=>line.replace(/^\[[^\]]+\]\s*/, '').trim()).filter(line=>/^[a-zA-Z_][\w.]*\+0x[0-9a-f]+\/0x[0-9a-f]+$/i.test(line));
    const frames = loggedFrames.length ? loggedFrames : toArr(cf.call_trace_signature);
    if(frames.length){
      h += `<div class="appendix-card"><details><summary><span class="appendix-summary-label">宕机栈 <span class="appendix-count">${frames.length}</span></span><span class="chevron" aria-hidden="true"></span></summary><div class="detail-body"><p class="muted">栈顶在上，按日志顺序列出调用帧。</p><pre class="crash-stack"><code>${esc(frames.join('\n'))}</code></pre></div></details></div>`;
    }
  }

  /* 内核源码摘录（本地源码对照；与「规避手段·修复细节」「故障机制」的源码引用互链） */
  {
    const ls = ra.local_source || {};
    const srcRefs = toArr(ls.refs).filter(r=>r && has(r.file));
    if(srcRefs.length){
      h += `<div class="appendix-card"><details><summary><span class="appendix-summary-label">内核源码摘录 <span class="appendix-count">${srcRefs.length}</span></span><span class="chevron" aria-hidden="true"></span></summary><div class="detail-body"><p class="muted">${esc(ls.base || '本地内核源码对照摘录')}；正文与补丁卡中的源码引用可跳转到对应片段。</p><div class="log-evidence-list">`;
      srcRefs.forEach(r=>{
        const loc = `${r.file||''}${has(r.lines)?(' : '+r.lines):''}`;
        /* head 只放 标题 + 固定右侧组（徽标/链接）；长路径独立成行，避免挤压标题 */
        let headRight = '';
/* origin 不再用 pill 徽标，改为 loc 行内彩色后缀（见下方 originTag） */
        if(has(r.url)) headRight += `<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer" class="case-link">上游对照 ↗</a>`;
        const pathLine = (String(r.origin||'') === '本地源码' && has(r.path)) ? `<span class="source-label">📁 本地路径：${esc(r.path)}</span>` : '';
        const hlLines = toArr(r.hl).map(n=>parseInt(n,10)).filter(n=>Number.isInteger(n)&&n>0);
        const excerptHtml = has(r.excerpt) ? `<code class="src-excerpt">${String(r.excerpt).split('\n').map((ln,i)=>{
          const on = hlLines.includes(i+1);
          return `<span class="src-line">${esc(ln)||'&nbsp;'}</span>`;
        }).join('')}</code>` : '';
        /* 上游基线版本从 ref.url（elixir /linux/<ver>/）或 local_source.base 推导，禁止硬编码 */
        const upstreamVer = (String(r.url||'').match(/\/linux\/(v[\d.]+)/) || String(ls.base||'').match(/\bv(\d+(?:\.\d+){1,2})\b/) || [])[1] || '';
        const originTag = String(r.origin||'') === '本地源码' ? `<span class="origin-tag tag-local">本地源码</span>`
          : String(r.origin||'') === '上游基线' ? `<span class="origin-tag tag-upstream">上游基线${upstreamVer?(' · Linux '+upstreamVer):''}</span>` : '';
        h += `<article class="log-evidence" id="${esc(r.id||'')}"><div class="log-evidence-head"><b>${esc(r.func||loc)}</b>${headRight?`<span class="src-head-right">${headRight}</span>`:''}</div><span class="source-label">📍 ${esc(loc)} ${originTag}</span>${pathLine}${excerptHtml}${has(r.note)?`<p>${esc(r.note)}</p>`:''}</article>`;
      });
      h += `</div></div></details></div>`;
    }
  }

  /* 日志特征明细 */
  const lf = cf.log_features || {};
  const lfBlocks = [];
  const relErrs = toArr(lf.related_errors);
  if(relErrs.length){
    lfBlocks.push(`<h4>相关报错</h4><div class="log-evidence-list">` + relErrs.map(e=>{
      const src = esc(e.file||'') + (has(e.lines)?(' · L'+esc(e.lines)):'');
      return `<article class="log-evidence"><div class="log-evidence-head"><span class="source-label">${src}</span>${has(e.relevance)?relevanceBadge(e.relevance):''}</div><code>${esc(e.line||'')}</code>${has(e.desc)?`<p>${esc(e.desc)}</p>`:''}</article>`;
    }).join('') + `</div>`);
  }
  const reps = toArr(lf.repeated);
  if(reps.length){
    lfBlocks.push(`<h4>重复可疑日志</h4><div class="log-evidence-list">` + reps.map(r=>{
      const ref = r.ref || {};
      const src = esc(ref.file||'') + (has(ref.lines)?(' · L'+esc(ref.lines)):'');
      return `<article class="log-evidence"><div class="log-evidence-head"><b>${esc(r.title||'')}</b>${has(r.relevance)?relevanceBadge(r.relevance):''}</div><p>${esc(r.count||'')} 次 · ${esc(r.window||'')}</p>${(Array.isArray(r.examples)&&r.examples.length)?`<code>${esc(r.examples.filter(has).join('\n'))}</code>`:''}${has(r.desc)?`<p>${esc(r.desc)}</p>`:''}${has(r.note)?`<p class="muted">${esc(r.note)}</p>`:''}${src?`<span class="source-label">${src}</span>`:''}</article>`;
    }).join('') + `</div>`);
  }
  const others = toArr(lf.other);
  if(others.length){
    lfBlocks.push(`<h4>其它异常</h4><div class="log-evidence-list">` + others.map(o=>{
      const ref = o.ref || {};
      const src = esc(ref.file||'') + (has(ref.lines)?(' · L'+esc(ref.lines)):'');
      return `<article class="log-evidence"><div class="log-evidence-head"><b>${esc(o.name||'')}</b>${has(o.relevance)?relevanceBadge(o.relevance):''}</div><p>${esc(o.count||'')} 条 · ${esc(o.span||'')}</p>${(Array.isArray(o.lines)&&o.lines.length)?`<code>${esc(o.lines.filter(has).join('\n'))}</code>`:''}${has(o.desc)?`<p>${esc(o.desc)}</p>`:''}${has(o.note)?`<p class="muted">${esc(o.note)}</p>`:''}${src?`<span class="source-label">${src}</span>`:''}</article>`;
    }).join('') + `</div>`);
  }
  if(lfBlocks.length){
    h += `<div class="appendix-card"><details><summary><span class="appendix-summary-label">日志特征明细 <span class="appendix-count">${attachmentLogCount}</span></span><span class="chevron" aria-hidden="true"></span></summary><div class="detail-body"><p class="muted">汇总 vmcore-dmesg 中与本次崩溃相关的日志特征，并按相关性分级。</p>${lfBlocks.join('')}</div></details></div>`;
  }

  /* 知识库案例：按「是否支撑推荐修复方案」分层。
     修复依据组 = verdict=confirmed 的案例 + standard_solution.basis/patch_list 明确引用的案例
     （即使 verdict=same_area，只要被方案引用就升格展示，保证第 1 章修复依据与技术附件一致）。 */
  const allCases = collectCases();
  if(allCases.length){
    const brefs = basisRefs();
    const isBasis = item => String(item.case.verdict||'').toLowerCase() === 'confirmed' || isBasisCited(item.case, brefs);
    const confirmedCases = allCases.filter(isBasis);
    const referenceCases = allCases.filter(item => !isBasis(item));

    /* 修复依据：默认折叠，与其他附件卡保持一致 */
    if(confirmedCases.length){
      h += `<div class="appendix-card"><details><summary><span class="appendix-summary-label">修复依据 <span class="appendix-count">${confirmedCases.length}</span></span><span class="chevron" aria-hidden="true"></span></summary><div class="detail-body"><p class="muted">以下案例是本次推荐修复方案的直接依据：verdict=confirmed 的一手修复证据，或「规避手段 · 修复依据」明确引用的上游 commit（标注「方案引用」）。</p><div class="case-list">`;
      confirmedCases.forEach(item=>{ h += renderCaseCard(item.case, 0, item.source, item.id); });
      h += `</div></div></details></div>`;
    }

    /* 其他案例：默认折叠，避免干扰主阅读流 */
    if(referenceCases.length){
      h += `<div class="appendix-card"><details><summary><span class="appendix-summary-label">其他案例 <span class="appendix-count">${referenceCases.length}</span></span><span class="chevron" aria-hidden="true"></span></summary><div class="detail-body"><p class="muted">以下案例与本次宕机存在相似特征，但触发路径、内核版本或修复口径不完全匹配，仅作为诊断旁证，不作为推荐修复方案。</p><div class="case-list">`;
      referenceCases.forEach(item=>{ h += renderCaseCard(item.case, 0, item.source, item.id); });
      h += `</div></div></details></div>`;
    }
  }

  /* 工作流 */
  if(wt && toArr(wt.steps).length){
    h += `<div class="appendix-card"><details><summary><span class="appendix-summary-label">Agent 诊断工作流 <span class="appendix-count">${wt.step_count||toArr(wt.steps).length}</span></span><span class="chevron" aria-hidden="true"></span></summary><div class="detail-body">`;
    h += `<div class="workflow-list">`;
    toArr(wt.steps).forEach(s=>{
      h += `<article class="workflow-step"><div class="workflow-head"><h4>${esc(s.decision||('步骤 '+(s.step||'')))}</h4>${has(s.status)?`<span class="workflow-status ${statusClass(s.status)}">${esc(s.status)}</span>`:''}</div>`;
      if(has(s.observations)) h += `<p><b>观察：</b>${linkify(s.observations)}</p>`;
      if(has(s.judgment)) h += `<p><b>判断：</b>${linkify(s.judgment)}</p>`;
      const tools = toArr(s.tools);
      if(tools.length){
        /* 按「短名 + status」聚合，避免满屏重复的 bash · success */
        const agg = [];
        tools.forEach(t=>{
          if(typeof t !== 'object' || !t) return;
          const name = shortToolName(t.tool_name || t.title || '') || '工具';
          const st = String(t.status || '');
          const key = name + '\u0000' + st;
          const hit = agg.find(a => a.key === key);
          if(hit) hit.count++;
          else agg.push({key, name, st, count:1});
        });
        h += `<div class="tool-pills">`;
        agg.forEach(a=>{
          const bad = a.st && !/success|ok|completed|done/.test(String(a.st).toLowerCase());
          const label = a.count > 1 ? (a.name + ' ×' + a.count) : a.name;
          h += `<span class="tool-pill ${statusClass(a.st)}">${esc(label)}${bad && a.st ? ' ' + esc(a.st) : ''}</span>`;
        });
        h += `</div>`;
        h += `<details class="tool-detail"><summary>查看 ${tools.length} 次工具调用<span class="chevron" aria-hidden="true"></span></summary><div class="detail-body">`;
        tools.forEach(t=>{
          if(typeof t !== 'object' || !t) return;
          const name = t.tool_name || '';
          const title = t.title || '';
          const st = String(t.status || '');
          const dur = (t.duration_ms!=null && Number(t.duration_ms)>0) ? (t.duration_ms + 'ms') : '';
          h += `<div class="tool-call"><div class="tool-call-line"><span class="tool-call-name ${statusClass(st)}">${esc(name)}</span>${st?`<span class="tool-call-status ${statusClass(st)}">${esc(st)}</span>`:''}${dur?`<span class="tool-call-dur">${esc(dur)}</span>`:''}</div>${title?`<code>${esc(title)}</code>`:''}</div>`;
        });
        h += `</div></details>`;
      }
      h += `</article>`;
    });
    h += `</div>`;
    h += `</div></details></div>`;
  }

  /* 完整原始报告数据 */
  h += `<div class="appendix-card raw-report-card"><details><summary>完整原始报告数据（report.json）<span class="chevron" aria-hidden="true"></span></summary><div class="detail-body"><pre><code>${esc(JSON.stringify(R, null, 2))}</code></pre></div></details></div>`;

  h += `</section>`;
  return h;
}

/* 生成复制摘要文本 */
function buildSummary(){
  const t = readTime(cf.crash_time);
  const concl = ra.conclusion || deep.lead || '';
  const fixed = ss ? (ss.fixed_in || ss.claim_tag || '') : '';
  const waiver = wa && toArr(wa.case_refs).filter(has).length && has(wa.summary) ? firstSentence(wa.summary) : '';
  const lines = [
    `${host.host_name||R.report_id||''} 宕机分析`,
    t ? `时间：${t}` : '',
    concl ? `根因：${firstSentence(concl)}` : '',
    fixed ? `修复：${fixed}` : '',
    waiver ? `临时缓解：${waiver}` : '',
  ].filter(has);
  return lines.join('\n');
}

/* ===== 渲染入口 ===== */
function render(){
  buildAttachmentIndex();
  document.getElementById('top-meta').textContent = '现场记录 · ' + (readTime(cf.crash_time)||'').slice(0,10);
  document.title = '宕机分析报告 · ' + (host.host_name||R.report_id||'');
  document.getElementById('main').innerHTML =
    renderOverview() + renderFeatures() + renderMechanism() + renderEvidence() + renderAppendix();
  initNav();
  initButtons();
  initLogLegend();
}

/* 单按钮控制所有折叠面板，并用文案明确反馈当前状态。 */
function toggleAllDetails(){
  const panels = [...document.querySelectorAll('details')];
  const shouldOpen = panels.some(d => !d.open);
  panels.forEach(d => { d.open = shouldOpen; });
  const button = document.getElementById('toggle-details');
  if(button){
    button.textContent = shouldOpen ? '收起全部' : '展开全部';
    button.setAttribute('aria-pressed', shouldOpen ? 'true' : 'false');
    button.classList.toggle('is-open', shouldOpen);
  }
}
window.toggleAllDetails = toggleAllDetails;

/* 顶部/底部操作按钮 */
function initButtons(){
  const copyBtn = document.getElementById('copy-summary');
  const copyStatus = document.getElementById('copy-status');
  if(copyBtn){
    copyBtn.addEventListener('click', async ()=>{
      const text = buildSummary();
      if(copyStatus) copyStatus.textContent = '已复制';
      try {
        if(navigator.clipboard && window.isSecureContext){
          await navigator.clipboard.writeText(text);
        } else throw new Error('unavailable');
      } catch(e){
        const area = document.createElement('textarea');
        area.value = text; area.style.cssText='position:fixed;left:-9999px';
        document.body.appendChild(area); area.select();
        try { if(copyStatus) copyStatus.textContent = document.execCommand('copy') ? '已复制' : '请手动选择摘要'; }
        catch(_){ if(copyStatus) copyStatus.textContent = '请手动选择摘要'; }
        area.remove();
      }
      if(copyStatus) setTimeout(()=>{ copyStatus.textContent=''; }, 2000);
    });
  }
  const dlBtn = document.getElementById('download-data');
  if(dlBtn){
    dlBtn.addEventListener('click', ()=>{
      const raw = JSON.stringify(R, null, 2);
      const url = URL.createObjectURL(new Blob([raw],{type:'application/json;charset=utf-8'}));
      const a = document.createElement('a');
      a.href = url; a.download = (host.host_name||R.report_id||'report') + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 1000);
    });
  }
  const printBtn = document.getElementById('print-report');
  if(printBtn) printBtn.addEventListener('click', ()=>window.print());
}

/* 顶部导航滚动高亮 */
function initNav(){
  const navLinks=[...document.querySelectorAll('nav.topnav a')];
  const sections=navLinks.map(a=>document.getElementById(a.hash.slice(1))).filter(Boolean);
  let ticking=false;
  function update(){
    let cur=sections[0];
    for(const s of sections) if(s.getBoundingClientRect().top<=72) cur=s;
    /* 滚动到底部时，强制高亮最后一个 section（技术附件） */
    const docEl = document.documentElement || document.body;
    if(docEl && window.scrollY + window.innerHeight >= docEl.scrollHeight - 16) cur=sections[sections.length-1];
    navLinks.forEach(a=>{ const on=a.hash==='#'+cur.id; a.classList.toggle('active',on); });
    ticking=false;
  }
  /* 点击导航显式滚动，兼容 sticky 导航下的锚点跳转 */
  navLinks.forEach(a=>{
    a.addEventListener('click', e=>{
      const target = document.getElementById(a.hash.slice(1));
      if(target){ e.preventDefault(); target.scrollIntoView({behavior:'smooth', block:'start'}); history.replaceState(null,'',a.hash); }
    });
  });
  window.addEventListener('scroll',()=>{ if(!ticking){ requestAnimationFrame(update); ticking=true; } },{passive:true});
  update();
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', render); else render();
