function commitHref(sha){ const k=String(sha).toLowerCase(); const known={'cd3f8467afd470ccab0de2fbc7c76664af4a0bac':'https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/commit/?id=cd3f8467afd470ccab0de2fbc7c76664af4a0bac','d8a1f7420d2d58fcbde479bd72d0900fb512cb2d':'https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git/commit/?id=d8a1f7420d2d58fcbde479bd72d0900fb512cb2d','b55945c500c5723992504aa03b362fab416863a6':'https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/commit/?id=b55945c500c5723992504aa03b362fab416863a6'}; if(known[k]) return known[k]; if(k.startsWith('b5e909934e11')) return 'https://gitcode.com/openeuler/kernel/commits/detail/'+k; return 'https://github.com/torvalds/linux/commit/'+k; }

  const communityEmails = community.filter(c=>/mail|email|邮件|邮件列表|lore/i.test(String(c.kind||c.source||c.title||c.subject||'')));
  const caseData = {...diag, community_kernel_result: community.filter(c=>!communityEmails.includes(c)), community_emails: communityEmails};
  return caseGroups.flatMap(g=>toArr(caseData[g.key]).map((c,i)=>({case:c, source:g.source, id:`case-${g.key}-${i}`})));
}

function registerAttachment(id, c){
  caseIdMap[id] = c;
  ['url','patch_url','sha','patch_ref','commit'].forEach(k=>{
    const v = c[k];
    if(!v) return;
    attachmentIndex[normalizeUrl(v)] = id;
    if(/^[0-9a-f]{12,40}$/i.test(String(v))){
      attachmentIndex[String(v).toLowerCase()] = id;
      attachmentIndex[String(v).toLowerCase().slice(0,12)] = id;
    }
  });
  // 从文本字段里再提取一次 commit sha，扩大命中面
  [c.title, c.subject, c.bug_summary, c.excerpt, c.how, c.lead, c.phenomenon, c.root_cause].forEach(txt=>{
    if(!txt) return;
    const shas = String(txt).match(/\b[0-9a-f]{12,40}\b/gi) || [];
    shas.forEach(sha=>{ attachmentIndex[String(sha).toLowerCase()] = id; });
  });
}

function buildAttachmentIndex(){
  attachmentIndex = {};
  caseIdMap = {};
  collectCases().forEach(({case:c, id})=> registerAttachment(id, c));
}

function findAttachmentId(token){
  if(!token) return '';
  const k = normalizeUrl(token);
  if(attachmentIndex[k]) return attachmentIndex[k];
  const kl = String(token).toLowerCase();
  if(attachmentIndex[kl]) return attachmentIndex[kl];
  // 尝试短 sha 前缀匹配
  if(/^[0-9a-f]{12,40}$/i.test(kl)){
    for(const key in attachmentIndex){
      if(key.startsWith(kl) || kl.startsWith(key)) return attachmentIndex[key];
    }
  }
  return '';
}

function openAttachmentCase(id){
  const el = document.getElementById(id);
  if(!el) return true;
  // 展开所有父级 details
  let p = el.parentElement;
  while(p){
    if(p.tagName === 'DETAILS') p.open = true;
    p = p.parentElement;
  }
  // 展开案例分组与附件总折叠
  const group = el.closest('.case-group');
  if(group && group.tagName === 'DETAILS') group.open = true;
  const appendixCard = el.closest('.appendix-card');
  if(appendixCard){
    const topDetails = appendixCard.querySelector(':scope > details');
    if(topDetails) topDetails.open = true;
  }
  // 同时展开卡片内部的“查看完整字段”等 details，让用户直接看到对应材料
  const innerDetails = el.querySelectorAll('details');
  innerDetails.forEach(d => d.open = true);
  if(el.scrollIntoView) el.scrollIntoView({behavior:'smooth', block:'center'});
  el.classList.add('case-highlight');
  setTimeout(()=>el.classList.remove('case-highlight'), 2200);
  return false;
}
window.openAttachmentCase = openAttachmentCase;

/* 正文区域使用的链接化：命中附件索引则跳转到技术附件并自动展开，否则保持外链。 */
function linkifyBody(s){
  if(s==null) return '';
  let text=esc(s), urls=[];
  text=text.replace(/https?:\/\/[^\s<]+/g,m=>{
    const url=m.replace(/[.,，。；;!?\)\]'">]+$/,'');
    const tail=m.slice(url.length);
    const i=urls.push({url,tail})-1;
    return `@@URL${i}@@`;
  });
  text=text.replace(/\b[0-9a-f]{12,40}\b/gi,m=>{
    const id = findAttachmentId(m);
    if(id) return `<a href="#${id}" onclick="openAttachmentCase('${id}'); return false;" class="attachment-link" title="跳转到技术附件">${m}</a>`;
    return m; /* 未命中索引的 commit 保持纯文本，不跳外部 */
  });
  return text.replace(/@@URL(\d+)@@/g,(_,i)=>{
    const u = urls[i].url;
    const id = findAttachmentId(u);
    if(id) return `<a href="#${id}" onclick="openAttachmentCase('${id}'); return false;" class="attachment-link" title="跳转到技术附件">${u}</a>${urls[i].tail}`;
    return u + urls[i].tail; /* 未命中索引的 URL 保持纯文本，不跳外部 */
  });
}

function linkifyJudgment(s){
  if(s==null) return '';
  return esc(s).replace(/https?:\/\/[^\s<]+/g, m=>{
    const url=m.replace(/[.,，。；;!?\)\]'">]+$/,'');
    const tail=m.slice(url.length);
    const id = findAttachmentId(url);
    if(id) return `<a href="#${id}" onclick="openAttachmentCase('${id}'); return false;" class="attachment-link" title="跳转到技术附件">查看关联技术附件 ↗</a>${tail}`;
    return url + tail; /* 未命中索引的 URL 保持纯文本 */
  });
}

/* 从日志/签名里提取崩溃地址（形如 0x...） */
function faultAddr(){
  const hay = [cf.signature, cf.bug_key, cf.bug_summary, cf.rip].filter(has).join(' | ');
  const m = hay.match(/address[:：]\s*(0x[0-9a-fA-F]+)/i);
  if(m) return m[1];
  const m2 = hay.match(/0000000+[0-9a-fA-F]+/);
  return m2 ? '0x'+m2[0].replace(/^0+/,'') : '';
}

    h += `</article>`;
  }

  h += `</div></div></section>`;
  return h;
}

/* 现场进程上下文（event_scene 参与者或 deep.lead） */
function sceneContext(){
  const es = ra.event_scene;
  if(es && toArr(es.participants).length){
    const ps = toArr(es.participants);
    const p = ps.find(x=>x && /dw_|PID|进程|proc|监控|采集/i.test((x.name||'')+(x.init||''))) || ps[0];
    if(p) return [p.name, p.init].filter(has).join(' · ');
  }
  return '';
}

/* 崩溃日志块级分类：连续同类行合并为语义块，整块配色 + 悬停解读（通用解释，适用于任意内核崩溃日志） */
function classifyLogLine(line){
  const s = String(line||'');
  if(/(^|\])\s*Code:/.test(s)) return {cat:'cat-code'};
  if(/\bpc\s*:|\bRIP\s*:/.test(s)) return {cat:'cat-loc'};
  if(/\blr\s*:/.test(s)) return {cat:'cat-loc'};
  if(/\b(sp|rsp)\s*:/.test(s)) return {cat:'cat-loc'};
  if(/pstate\s*:/.test(s)) return {cat:'cat-loc'};
  if(/\]\s*x\d+\s*:\s*[0-9a-f]{8,}/.test(s)) return {cat:'cat-regs'};
  if(/\]\s*R[A-Z]{2,3}\s*:\s*[0-9a-f]{8,}/.test(s)) return {cat:'cat-regs'};
  if(/Call [Tt]race\s*:/.test(s)) return {cat:'cat-trace'};
  if(/\]\s+\S+\+0x[0-9a-f]+\/0x[0-9a-f]+/.test(s)) return {cat:'cat-trace'};
  if(/SMP:\s*(stopping|failed)/.test(s)) return {cat:'cat-kdump'};
  if(/WARNING|cut here|stale|Starting crashdump|crashdump kernel/i.test(s)) return {cat:'cat-kdump'};
  if(/Unable to handle|Internal error|Kernel panic|BUG:|general protection|invalid opcode|Oops|watchdog/i.test(s)) return {cat:'cat-crash'};
  if(/ESR\s*=|Exception class|[MD]em abort|Data abort|ISV\s*=|ISS\s*=|SET\s*=|EA\s*=|CM\s*=|WnR/i.test(s)) return {cat:'cat-esr'};
  if(/pgd=|pud=|pgtable/i.test(s)) return {cat:'cat-esr'};
  if(/Modules linked in/.test(s)) return {cat:'cat-info'};
  if(/Process\s+\S+\s*\(pid/.test(s)) return {cat:'cat-info'};
  if(/CPU:\s*\d+\s+PID:/.test(s)) return {cat:'cat-info'};
  if(/Source Version|Hardware name|BIOS/.test(s)) return {cat:'cat-info'};
  return null;
}

/* 块级悬停解读文案 */
const BLOCK_TIPS = {
  'cat-crash': '崩溃类型行：说明内核以什么方式挂掉与故障地址。NULL pointer dereference=空指针解引用（故障地址即被访问的字段偏移）；Oops=内核错误的正式记录（错误码/第几次/SMP 系统）；panic=整机停止。',
  'cat-esr': '异常综合征与故障地址解析：ESR 编码异常类别（DABT=数据中止/访存异常）与故障状态码，WnR 区分读写方向（0=读 1=写）；页表遍历（pgd/pud）全 0 说明故障地址完全未映射——空指针/未初始化指针访问的典型证据。',
  'cat-info': '崩溃现场环境信息：加载模块列表（判断是否涉及第三方模块）、崩溃进程名/PID、CPU 号与内核污染标志（Not tainted=无外部模块污染）、内核版本与硬件型号/BIOS——用于定位源码树与排除硬件因素。',
  'cat-loc': '崩溃指令定位：pstate（处理器状态标志）、pc（程序计数器=崩溃指令，格式 函数名+偏移/总长）、lr（返回地址=调用崩溃函数的上层函数）、sp（栈指针）——直接定位「崩在哪个函数的哪条指令」与调用关系。',
  'cat-regs': '通用寄存器现场值（x0~x29）：还原崩溃瞬间的参数与指针。ARM64 中 x0~x7 为函数参数寄存器；某寄存器为 0 往往就是空指针；结合崩溃指令（如 ldr w0,[x20,#0x40]）可推断各寄存器对应的参数或结构体成员。',
  'cat-trace': '调用栈：自崩溃函数向上直到系统调用入口，栈帧格式 函数名+偏移/总长。自上而下阅读 = 崩溃点 ← 调用者 ← … ← 入口，还原触发崩溃的完整执行路径。',
  'cat-code': '崩溃指令机器码：括号内的那一条就是触发异常的实际指令机器码，结合 pc 反汇编即可看到具体访问操作（如读/写某结构体成员的偏移）。',
  'cat-kdump': 'kdump 现场捕获阶段：崩溃后停其它 CPU 核（SMP stopping/failed）、启动捕获内核写出 vmcore。此处告警（如 CPU 核未停住、部分转储）只影响转储完整性，不影响崩溃原因本身。'
};

/* 把原始日志按「连续同类行」合并为语义块，整块带类别色条与 data-tip */
function annotateCrashLog(raw){
  const lines = String(raw).split('\n');
  const groups = [];
  lines.forEach(line=>{
    const m = classifyLogLine(line);
    const cat = m ? m.cat : '';
    const last = groups[groups.length-1];
    if(last && last.cat === cat) last.lines.push(line);
    else groups.push({cat, lines:[line]});
  });
  return groups.map(g=>{
    const tip = (g.cat && BLOCK_TIPS[g.cat]) ? ` data-tip="${esc(BLOCK_TIPS[g.cat])}"` : '';
    const cls = 'log-block' + (g.cat ? (' '+g.cat) : '');
    return `<span class="${cls}"${tip}>${g.lines.map(l=>esc(l)||'\u00a0').join('\n')}</span>`;
  }).join('');
}

/* ===== ② 宕机特征 ===== */
function renderFeatures(){
  let h = `<section class="section" id="features" aria-labelledby="features-title">`;
  h += `<div class="section-heading"><span class="section-no">02</span><h2 id="features-title">宕机现场有哪些特征</h2></div>`;
  h += `<p class="section-intro">先看现场发生了什么：异常、RIP 与主调用栈直接展示。</p>`;

  const rows = [];
  const bt = cf.bug_type || '';
  rows.push(['异常类型', bt ? bt.replace(/_/g,' ') : '内核崩溃']);
  const addr = faultAddr();
  if(addr) rows.push(['故障地址', `<code>${esc(addr)}</code>`]);
  if(has(cf.rip_function)) rows.push(['RIP / 崩溃函数', `<code>${esc(cf.rip_function+(cf.rip_offset?('+'+esc(cf.rip_offset)):''))}</code>`]);
  if(has(cf.rip)) rows.push(['RIP', `<code>${esc(cf.rip)}</code>`]);
  const ctx = sceneContext();
  if(has(ctx)) rows.push(['现场上下文', esc(ctx)]);

  /* 异常特征表只保留崩溃直接事实；重复可疑日志/其它异常等背景信号统一收在技术附件「日志特征明细」 */
  h += `<dl class="crash-facts">`;
  rows.forEach(r=>{ h += `<div><dt>${esc(r[0])}</dt><dd>${r[1]}</dd></div>`; });
  h += `</dl>`;

  /* 原始崩溃日志：call_trace_text 只是栈函数列表，不能冒充原始日志；
     优先用 log_features.related_errors[].line（dmesg 原文）按行号排序拼装，call_trace_text 单独作为「崩溃调用栈」展示。 */
  const lfr0 = cf.log_features || {};
  const rawLines = toArr(lfr0.related_errors).filter(e=>e && has(e.line))
    .slice()
    .sort((a,b)=>(parseInt(String(a.lines||''),10)||0)-(parseInt(String(b.lines||''),10)||0))
    .map(e=>String(e.line));
  const rawSrc = (lfr0.related_ref && has(lfr0.related_ref.file)) ? (lfr0.related_ref.file + (has(lfr0.related_ref.lines)?(' L'+lfr0.related_ref.lines):'')) : '';
  /* 优先渲染 raw_crash_log（完整连续原文）；无则退化为 related_errors 拼装摘录。
     每行按类型着色并带悬停解读（annotateCrashLog），不再需要独立的「如何阅读」指南区。 */
  const rawFull = has(cf.raw_crash_log) ? String(cf.raw_crash_log) : '';
  const hoverHint = `<div class="log-legend"><span class="log-legend-label">图例 · 悬停/点击任意色块查看整块解读</span>${[['#b04a4a','崩溃类型'],['#926321','异常综合征/故障地址'],['#c25e00','崩溃指令定位'],['#5b7fa6','寄存器'],['#2e7d5b','调用栈'],['#8a5fb0','崩溃机器码'],['#6f7d8a','kdump 捕获'],['#b7c4bc','现场环境']].map(([c,n])=>`<span class="log-legend-item"><i style="background:${c}"></i>${n}</span>`).join('')}</div>`;
  if(rawFull){
    h += `<details class="reading-group"><summary>原始崩溃日志<span class="chevron" aria-hidden="true"></span></summary><div class="detail-body">${rawSrc?`<p class="muted">逐字摘自 ${esc(rawSrc)}（完整连续崩溃段）。</p>`:''}${hoverHint}<div class="crash-log"><pre><code>${annotateCrashLog(rawFull)}</code></pre></div></div></details>`;
  } else if(rawLines.length){
    h += `<details class="reading-group"><summary>原始崩溃日志<span class="chevron" aria-hidden="true"></span></summary><div class="detail-body">${rawSrc?`<p class="muted">按行号排序摘自 ${esc(rawSrc)}（关键行摘录，非连续全文）。</p>`:''}${hoverHint}<div class="crash-log"><pre><code>${annotateCrashLog(rawLines.join('\n'))}</code></pre></div></div></details>`;
  } else if(has(cf.call_trace_text)){
    /* 兜底：无原始日志行时才单独展示调用栈（如实标注，不冒充原始日志） */
    h += `<details class="reading-group"><summary>崩溃调用栈<span class="chevron" aria-hidden="true"></span></summary><div class="detail-body">${hoverHint}<div class="crash-log"><pre><code>${annotateCrashLog(cf.call_trace_text)}</code></pre></div></div></details>`;
  }
  h += `</section>`;
  return h;
}

/* ===== ③ 判断依据 ===== */
function renderEvidence(){
  let h = `<section class="section" id="evidence" aria-labelledby="evidence-title">`;
  h += `<div class="section-heading"><span class="section-no">04</span><h2 id="evidence-title">为什么得出这个结论</h2></div>`;
  const evs = toArr(deep.evidence).filter(has);
  if(evs.length){
    h += `<p class="section-intro">${evs.length} 个<b>并列的分析角度</b>（无先后顺序）：从故障现场、源码缺口到社区证据，不同侧面交叉验证同一结论。</p>`;
    evs.forEach((e,i)=>{
      const isObj = typeof e === 'object' && e !== null;
      const title = isObj ? (e.title || ('依据 '+(i+1))) : evidenceTitle(e, i);
      const summary = isObj ? (e.summary || '') : String(e);
      const reasoning = isObj ? toArr(e.reasoning) : [];
      h += `<article class="evidence"><div class="evidence-number">角度 ${i+1}</div><div>`;
      h += `<h3>${esc(title)}</h3>`;
      if(has(summary)) h += `<p>${linkifyBody(summary)}</p>`;
      if(reasoning.length){
        h += `<details><summary>查看推理细节与证据<span class="chevron" aria-hidden="true"></span></summary><div class="detail-body"><ol class="reasoning">`;
        reasoning.forEach(st=>{
          h += `<li><h4>${esc(st.step||'')}</h4>`;
          if(has(st.detail)) h += `<p>${linkifyBody(st.detail)}</p>`;
          if(has(st.evidence)) h += `<pre><code>${esc(st.evidence)}</code></pre>`;
          if(has(st.conclusion)) h += `<p class="reason-result">${linkifyBody(st.conclusion)}</p>`;
          h += `</li>`;
        });
        h += `</ol></div></details>`;
      }
      h += `</div></article>`;
    });
  } else {
    h += `<p class="section-intro">原报告未提供结构化证据要点，详见技术附件中的原始诊断数据。</p>`;
  }

  h += `</section>`;
  return h;
}

/* 依据标题：摘取证据开头关键词 */
function evidenceTitle(e, i){
  const s = String(e||'');
  const m = s.match(/^([^：:，,。（(]{2,24})/);
  if(m) return m[1].trim();
  return '核心依据 ' + (i+1);
}

/* 事件之间流向箭头：同泳道用 ↓，任意跨泳道均使用 S 形曲线。 */
function laneConnector(a, b, row){
  if(a===b) return `<div class="lane-arrow" style="grid-column:${a+1};grid-row:${row}" aria-hidden="true">↓</div>`;
  const lo=Math.min(a,b), hi=Math.max(a,b);
  const w=(hi-lo+1)*200;
  const x1=(a+0.5-lo)*200, x2=(b+0.5-lo)*200;
  const h=40;
  const d=`M ${x1} 0 C ${x1} 15, ${x2} 25, ${x2} ${h}`;
  return `<div class="cross-order flow-arrow" style="grid-column:${lo+1}/${hi+2};grid-row:${row}" aria-hidden="true"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><marker id="flow-arr-${row}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a77836"/></marker></defs><path d="${d}" fill="none" stroke="#a77836" stroke-width="2.5" marker-end="url(#flow-arr-${row})"/></svg></div>`;
}

/* ===== ④ 故障机制 ===== */
function renderMechanism(){
  let h = `<section class="section" id="mechanism" aria-labelledby="mechanism-title">`;
  h += `<div class="section-heading"><span class="section-no">03</span><h2 id="mechanism-title">故障是怎样发生的</h2></div>`;
  const mechTxt = has(deep.mechanism_summary) ? deep.mechanism_summary : (has(ra.conclusion)?ra.conclusion:(has(deep.mechanism)?firstSentence(deep.mechanism):''));
  if(has(mechTxt)) h += `<div class="mechanism-summary"><div class="mechanism-summary-label">机制概述</div><p>${linkifyBody(mechTxt)}</p></div>`;

  /* 事件时序泳道图（event_scene）：事件独占一行，箭头指引流向 */
  const es = ra.event_scene;
  if(es && toArr(es.participants).length && toArr(es.events).length){
    const parts = toArr(es.participants).filter(Boolean);
    const laneIdx = {};
    parts.forEach((p,i)=>{ if(p.id!=null) laneIdx[p.id]=i; });
    const nc = Math.max(parts.length, 1);
    const events = [...toArr(es.events)].sort((a,b)=>(a.dt_ms||0)-(b.dt_ms||0));
    h += `<div class="mechanism">`;
    h += `<div class="sequence-intro"><b>事件时序</b><span>沿箭头向下阅读 · 相对顺序，不表示精确耗时</span></div>`;
    h += `<div class="swimlane" style="--nc:${nc}">`;
    parts.forEach(p=>{
      h += `<div class="lane-head" style="grid-row:1"><span>${esc(p.type||'')}</span><b>${esc(p.name||p.id||'')}</b><span>${esc(p.init||'')}</span></div>`;
    });
    let prevLane = null, row = 2;
    events.forEach((e,i)=>{
      const idx = (e.to!=null && laneIdx[e.to]!=null) ? laneIdx[e.to]
        : ((e.from!=null && laneIdx[e.from]!=null) ? laneIdx[e.from] : 0);
      if(prevLane!==null){ h += laneConnector(prevLane, idx, row); row++; }
      const kind = String(e.kind||'');
      if(kind==='race'){
        const fromPart = parts.find(p=>p.id===e.from);
        const toPart = parts.find(p=>p.id===e.to);
        const left = fromPart ? (fromPart.name||fromPart.id) : '并发路径 A';
        const right = (toPart && e.to!==e.from) ? (toPart.name||toPart.id) : '共享状态窗口';
        const raceDetail = e.full || e.title || '两个执行路径在同一状态窗口内交错推进';
        h += `<div class="race-window" style="grid-row:${row}"><div class="race-start"><b>${esc(left)}</b><small>竞态参与方</small></div><div class="race-start"><b>${esc(right)}</b><small>共享状态 / 交错访问</small></div><p>${esc(raceDetail)}${has(e.val)?` · ${esc(e.val)}`:''}</p></div>`;
        row++;
      }
      const txt = (e.title||'') + ' ' + (e.val||'');
      const isCrash = kind==='crash' || /panic|崩溃|空指针|NULL|无效地址|非法访问|fault/i.test(txt);
      const isWarm = !isCrash && (['race','mutex','irq','hw','global'].indexOf(kind)>=0 || (Array.isArray(e.g) && e.g.length));
      const cls = isCrash ? 'seq-event crash' : (isWarm ? 'seq-event warm' : 'seq-event');
      const tLabel = e.t || e.m || '';
      const CIRC = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫','⑬','⑭','⑮'];
      const kindLabel = {call:'调用',irq:'中断',softirq:'软中断',hw:'硬件',mutex:'加锁',alloc:'分配',race:'竞态',free:'释放',global:'全局',crash:'崩溃'}[kind] || '';
      const stepLabel = (CIRC[i]||(''+(i+1))) + (kindLabel ? (' ' + kindLabel) : '') + (tLabel ? (' · ' + tLabel) : '');
      h += `<div class="seq-cell" style="grid-column:${idx+1};grid-row:${row}"><div class="${cls}"><span class="step-label">${esc(stepLabel)}</span><b>${esc(e.title||'')}</b>${has(e.val)?`<code>${esc(e.val)}</code>`:''}${has(e.full)?`<small>${esc(e.full)}</small>`:''}${has(e.src)?`<small>${esc(e.src)}</small>`:''}</div></div>`;
      row++;
      prevLane = idx;
    });
    h += `</div>`;
    const judgment = deep.judgment || ra.conclusion || '';
    if(has(judgment)) h += `<div class="mechanism-judgment"><b>当前判断</b><p>${linkifyJudgment(judgment)}</p>${has(deep.confidence)?`<p class="confidence">判断置信度：${linkify(deep.confidence)}</p>`:''}</div>`;
    h += `<p class="diagram-caption">依据报告 event_scene 重建；只表达机制中的关键先后，不补造未记录的顺序或时间戳。</p>`;
    h += `</div>`;
  }

  /* 完整技术传播链（propagation_chain）：栈顶在上，逐跳参数与源码定位 */
  const chain = ra.propagation_chain;
  if(Array.isArray(chain) && chain.length){
    const rev = chain.slice().reverse();
    h += `<div class="reading-group"><details><summary>查看完整技术传播链 · 逐跳参数与源码定位<span class="chevron" aria-hidden="true"></span></summary><div class="detail-body"><div class="stack-view"><div class="stack-legend"><span>栈顶 / RIP 在上 · 调用由下向上 ↑</span><span>右侧为逐跳说明、关键参数与证据</span></div><ol class="stack-frames">`;
    rev.forEach((c,i)=>{
      const cls = c.crash ? 'stack-row crash' : (i===1 ? 'stack-row focus' : 'stack-row');
      const code = c.stack || ((c.from||'')+(c.to?(' → '+c.to):''));
      const loc = [c.src_dir, c.file].filter(has).join('/')+(has(c.line)?(':'+c.line):'');
      let ex = `<b>${esc((c.from||'')+(c.to?(' → '+c.to):''))}</b>`;
      if(has(c.detail)) ex += `<p>${linkifyBody(c.detail)}</p>`;
      const params = toArr(c.params);
      if(params.length){
        ex += `<div class="source-route"><b>关键参数（寄存器 ↔ 形参）</b><p>` +
          params.map(p=>`<code>${esc(p.n||'')} (${esc(p.formal||'')}) = ${esc(p.v||'')}${has(p.reg)?(' ['+esc(p.reg)+']'):''}</code>${p.bad?' <span class="tag tag-yellow">异常参数</span>':''}`).join('<br>') +
          `</p></div>`;
      }
      if(has(c.evidence)) ex += `<span class="source-label">${esc(c.evidence)}</span>`;
      if(has(c.source_url)){
        const srcId = findAttachmentId(c.source_url);
        if(srcId) ex += `<p><a href="#${srcId}" onclick="openAttachmentCase('${srcId}'); return false;" class="attachment-link" title="跳转到技术附件">关联技术附件 ↗</a></p>`;
        else ex += `<p>在线源码对照：${esc(c.source_url)}</p>`;
      }
      h += `<li class="${cls}"><div class="stack-frame"><span>${esc(loc||c.fn_ctx||'')}</span><code>${esc(code)}</code></div><span class="stack-pointer" aria-hidden="true">→</span><div class="stack-explain">${ex}</div></li>`;
    });
    h += `</ol></div></div></details></div>`;
  }
  h += `</section>`;
  return h;
}

/* 工作流/工具状态配色：success 绿 · partial 琥珀 · failed 红 · skipped 灰 */
function statusClass(st){
  const s = String(st||'').toLowerCase();
  if(/success|ok|completed|done/.test(s)) return 'st-success';
  if(/partial|part|warn|degraded/.test(s)) return 'st-partial';
  if(/fail|error|timeout/.test(s)) return 'st-failed';
  if(/skip|cancel/.test(s)) return 'st-skipped';
  return '';
}

/* 案例判定徽标 */
function verdictBadge(v){
  if(!has(v)) return '';
  const vv = String(v).toLowerCase();
  let color = '#8a8f8c';
  if(/确认|confirmed|已修复|可直接采用/.test(vv)) color = '#2e7d5b';
  else if(/same_area|同域|同子系统|需适配/.test(vv)) color = '#926321';
  else if(/not_relevant|无关|不适用|未验证|unverified/.test(vv)) color = '#8a8f8c';
  return `<span style="display:inline-block;margin-left:6px;padding:0 7px;border-radius:10px;background:${color};color:#fff;font-size:11px;vertical-align:middle">${esc(v)}</span>`;
}

function relevanceBadge(v){
  if(!has(v)) return '';
  const vv = String(v).toLowerCase();
  let color = '#8a8f8c';
  if(/强相关/.test(vv)) color = '#b04a4a';  /* 强相关=与崩溃最直接相关，红色醒目警示 */
  else if(/confirmed|可直接采用/.test(vv)) color = '#2e7d5b';
  else if(/部分相关|一般相关|same_area|同域/.test(vv)) color = '#926321';
  else if(/弱相关|not_relevant|无关|不适用|未验证|unverified/.test(vv)) color = '#8a8f8c';
  return `<span style="display:inline-block;margin-left:6px;padding:0 7px;border-radius:10px;background:${color}22;color:${color};border:1px solid ${color}55;font-size:11px;vertical-align:middle">${esc(v)}</span>`;
}

function renderCorroboration(rows){
  if(!Array.isArray(rows) || !rows.length) return '';
  const dimNames = {
    feature_data:'崩溃特征', kernel_version:'内核版本', execution_context:'执行上下文',
    timeline:'时间线', mechanism:'触发机制', fix_scope:'修复口径'
  };
  let h = `<table class="corrob-table"><thead><tr><th>维度</th><th>判定</th><th>本次现场</th><th>参考案例</th></tr></thead><tbody>`;
  rows.forEach(r=>{
    const v = String(r.verdict||'').toLowerCase();
    const state = v==='support' ? '支持' : v==='partial' ? '部分支持' : v==='mismatch' ? '不匹配' : (r.verdict || '');
    const cls = v==='support' ? 'corrob-support' : (v==='mismatch' ? 'corrob-mismatch' : 'corrob-partial');
    h += `<tr class="${cls}"><td>${esc(dimNames[r.dimension] || r.dimension || '')}</td><td><b>${esc(state)}</b></td><td>${esc(r.current||'')}</td><td>${esc(r.reference||'')}</td></tr>`;
  });
  h += `</tbody></table>`;
  return h;
}

/* 递归渲染键值（含数组/对象） */
function renderValue(key, value){
  let out = '';
  if(value==null || value==='') return '';
  if(Array.isArray(value)){
    if(!value.length) return '';
    out += `<div class="raw-row"><b>${esc(key)}</b></div>`;
    value.forEach((item,idx)=>{
      if(typeof item==='object' && item!=null){
        out += `<div class="raw-row"><b>条目 ${idx+1}</b></div>`;
        Object.keys(item).forEach(k=>{ out += renderValue(k, item[k]); });
      } else if(item!=null && String(item).trim()!==''){
        out += `<div class="raw-row"><p>${idx+1}. ${linkify(String(item))}</p></div>`;
      }
    });
  } else if(typeof value==='object'){
    out += `<div class="raw-row"><b>${esc(key)}</b></div>`;
    Object.keys(value).forEach(k=>{ out += renderValue(k, value[k]); });
  } else {
    out += `<div class="raw-row"><b>${esc(key)}</b><p>${linkify(String(value))}</p></div>`;
  }
  return out;
}

function renderCaseCard(c, i, source, caseId){
  const used = new Set();  /* 动态记录实际渲染过的字段，「查看完整字段」只兜底真正未展示的字段，杜绝静默丢失 */
  const isCommit = c.kind === 'commit' || source === '在线案例';
  const vLower = String(c.verdict||'').toLowerCase();
  const basisCited = vLower !== 'confirmed' && isBasisCited(c, basisRefs());
  const citedBadge = basisCited ? `<span class="tag tag-green">方案引用</span>` : '';

  /* 标题：只标记实际采用的字段，其余同义字段落入完整字段 */
  const titleKey = has(c.title)?'title':has(c.subject)?'subject':has(c.bug_summary)?'bug_summary':has(c.knowledge_id)?'knowledge_id':'';
  const title = titleKey ? c[titleKey] : ('案例 '+(i+1));
  if(titleKey) used.add(titleKey);

  /* meta pills（commit 附短 sha） */
  const shaShort = (isCommit && has(c.sha)) ? String(c.sha).slice(0,12) : '';
  if(shaShort) used.add('sha');
  const meta = [source, c.kind, c.verdict, c.match_level, c.kernel_version, c.date, shaShort].filter(has);
  ['kind','verdict','match_level','kernel_version','date'].forEach(k=>{ if(has(c[k])) used.add(k); });

  let h = `<article class="case-card"${caseId ? ` id="${caseId}"` : ''}><div class="case-head"><h4>${esc(title)}</h4>${verdictBadge(c.verdict||'')}${relevanceBadge(c.relevance||'')}${citedBadge}</div>`;
  if(meta.length) h += `<div class="case-meta">${meta.map(v=>`<span class="case-pill">${esc(v)}</span>`).join('')}</div>`;
  if(has(c.relevance)) used.add('relevance');

  /* 一句话摘要 */
  if(has(c.lead)){ h += `<p class="case-lead">${esc(c.lead)}</p>`; used.add('lead'); }

  const v = vLower;

  /* confirmed commit：匹配与修复论证合并为一个区域 */
  if(isCommit && v === 'confirmed'){
    h += `<div class="case-section case-fix-section"><b>为什么这个 commit 能修复当前问题</b>`;
    if(has(c.how)){ h += `<p>${linkify(c.how)}</p>`; used.add('how'); }
    if(has(c.fix_scope)){ h += `<p><b>修复范围：</b>${linkify(c.fix_scope)}</p>`; used.add('fix_scope'); }
    if(has(c.files) && toArr(c.files).length){ h += `<p><b>涉及文件：</b>${esc(toArr(c.files).join(' · '))}</p>`; used.add('files'); }
    if(has(c.diff)){ h += `<details class="case-extra"><summary>补丁 diff 摘录<span class="chevron" aria-hidden="true"></span></summary><div class="detail-body"><pre><code>${esc(c.diff)}</code></pre></div></details>`; used.add('diff'); }
    h += `</div>`;
  } else {
    /* 匹配论证：为什么这条资料与本次宕机有关 */
    h += `<div class="case-section"><b>匹配论证</b>`;
    if(source === '内部案例' && Array.isArray(c.corroboration) && c.corroboration.length){
      h += renderCorroboration(c.corroboration); used.add('corroboration');
      if(has(c.applicability)){ h += `<p class="case-applicability"><b>采用前提：</b>${linkify(c.applicability)}</p>`; used.add('applicability'); }
    } else {
      if(has(c.how)){ h += `<p>${linkify(c.how)}</p>`; used.add('how'); }
    }
    h += `</div>`;
  }

  /* 现象 / 根因 */
  const phenomenon = c.phenomenon || c.bug_summary || (source === '社区案例' || source === '社区邮件' || source === '社区会议' ? c.excerpt : '');
  if(has(phenomenon)){
    h += `<div class="case-section"><b>${has(c.phenomenon)||has(c.bug_summary)?'现象':'关键摘录'}</b><p>${linkify(phenomenon)}</p></div>`;
    if(has(c.phenomenon)) used.add('phenomenon');
    else if(has(c.bug_summary)) used.add('bug_summary');
    else if(has(c.excerpt)) used.add('excerpt');
  }
  if(has(c.root_cause)){ h += `<div class="case-section"><b>根因</b><p>${linkify(c.root_cause)}</p></div>`; used.add('root_cause'); }

  /* 非 confirmed commit 的适用性说明（补齐涉及文件与 diff）；非 commit 的修复方案 */
  if(isCommit && v !== 'confirmed'){
    h += `<div class="case-section"><b>${basisCited ? '与推荐方案的关系' : '适用性 / 参考性说明'}</b>`;
    if(has(c.how)){ h += `<p><b>与本次的关联：</b>${linkify(c.how)}</p>`; used.add('how'); }
    if(has(c.fix_scope)){ h += `<p><b>${basisCited ? '采用方式 / 限制' : '为什么不能直接采用'}：</b>${linkify(c.fix_scope)}</p>`; used.add('fix_scope'); }
    if(has(c.files) && toArr(c.files).length){ h += `<p><b>涉及文件：</b>${esc(toArr(c.files).join(' · '))}</p>`; used.add('files'); }
    if(!has(c.how) && !has(c.fix_scope) && has(c.applicability)){ h += `<p>${linkify(c.applicability)}</p>`; used.add('applicability'); }
    if(has(c.diff)){ h += `<details class="case-extra"><summary>补丁 diff 摘录<span class="chevron" aria-hidden="true"></span></summary><div class="detail-body"><pre><code>${esc(c.diff)}</code></pre></div></details>`; used.add('diff'); }
    h += `</div>`;
  } else if(!isCommit && has(c.solution)) {
    h += `<div class="case-section"><b>修复方案</b><p>${linkify(c.solution)}</p></div>`; used.add('solution');
  }

  /* 原文摘录（excerpt 未作为现象展示时，折叠展示，不再静默丢失） */
  if(has(c.excerpt) && !used.has('excerpt')){
    h += `<details class="case-extra"><summary>原文摘录<span class="chevron" aria-hidden="true"></span></summary><div class="detail-body"><p>${linkify(c.excerpt)}</p></div></details>`;
    used.add('excerpt');
  }

  /* 适用性（避免与前面分支重复渲染） */
  if(has(c.applicability) && source !== '内部案例' && !used.has('applicability')){ h += `<div class="case-section"><b>适用性 / 采用前提</b><p>${linkify(c.applicability)}</p></div>`; used.add('applicability'); }

  /* 匹配指纹（内部案例） */
  if(source === '内部案例' && Array.isArray(c.fingerprints) && c.fingerprints.length){
    h += `<div class="case-section"><b>匹配指纹</b><p class="case-fingerprints">${c.fingerprints.map(f=>`<span class="case-pill">${esc(f)}</span>`).join('')}</p></div>`;
    used.add('fingerprints');
  }

  /* 原始资料链接 */
  const url = c.url || c.patch_url;
  if(has(url)){ h += `<a class="case-link" href="${esc(url)}" target="_blank" rel="noopener noreferrer">查看原始资料 ↗</a>`; used.add(has(c.url)?'url':'patch_url'); }

  /* 其余字段（兜底：上方未实际渲染的字段都在此展示，已渲染的不重复出现） */
  const extras = Object.keys(c).filter(k=>!used.has(k));
  if(extras.length){
    h += `<details class="case-extra"><summary>查看其余字段（未在上方展示）<span class="chevron" aria-hidden="true"></span></summary><div class="detail-body">`;
    extras.forEach(k=>{ h += renderValue(k,c[k]); });
    h += `</div></details>`;
  }
  return h + `</article>`;
}

/* 修复依据引用集合：来自 standard_solution.basis 与 patch_list（url + sha） */
function basisRefs(){
  const refs = {urls:new Set(), shas:new Set()};
  toArr(ss && ss.basis).forEach(b=>{
    if(has(b.url)) refs.urls.add(String(b.url).trim());
    const t = [b.title, b.url, b.text].filter(has).join(' ');
    (t.match(/\b[0-9a-f]{7,40}\b/g)||[]).forEach(s=>refs.shas.add(s.toLowerCase()));
  });
  toArr(ss && ss.patch_list).forEach(p=>{
    if(has(p.sha)) refs.shas.add(String(p.sha).toLowerCase());
    if(has(p.url)) refs.urls.add(String(p.url).trim());
  });
  return refs;
}

/* 判断案例是否被修复方案引用（url 相等或 sha 前缀互含） */
function isBasisCited(c, refs){
  if(!c || !refs) return false;
  const urls = [c.url, c.patch_url].filter(has).map(u=>String(u).trim());
  if(urls.some(u=>refs.urls.has(u))) return true;
  const text = [c.sha, c.url, c.patch_url, c.patch_ref, c.title].filter(has).join(' ').toLowerCase();
  for(const sha of refs.shas){
    if(sha.length >= 7 && text.includes(sha)) return true;
  }
  return false;
}

/* ===== ⑤ 技术附件 ===== */
function renderAppendix(){
  let h = `<section class="section" id="appendix" aria-labelledby="appendix-title">`;
  h += `<div class="section-heading"><span class="section-no">05</span><h2 id="appendix-title">技术附件</h2></div>`;
  h += `<p class="section-intro">需要复核或继续排查时，再查看这些材料。</p>`;
  const attachmentLogCount = toArr((cf.log_features||{}).related_errors).length + toArr((cf.log_features||{}).repeated).length + toArr((cf.log_features||{}).other).length;
  const attachmentCaseCount = ['internal_kernel_result','community_kernel_result','community_meetings','online_result'].reduce((n,k)=>n+toArr(diag[k]).length,0);
  const attachmentStepCount = toArr(wt.steps).length;
  h += `<div class="appendix-stats"><div class="appendix-stat"><div class="appendix-stat-label">日志特征</div><div class="appendix-stat-value">${attachmentLogCount}</div></div><div class="appendix-stat"><div class="appendix-stat-label">案例资料</div><div class="appendix-stat-value">${attachmentCaseCount}</div></div><div class="appendix-stat"><div class="appendix-stat-label">诊断步骤</div><div class="appendix-stat-value">${attachmentStepCount}</div></div></div>`;

  /* 主机与运行环境（附件第一卡） */
  {
    const envDefs = [];
    const pushEnv = (k,v)=>{ if(has(v)) envDefs.push([k,String(v)]); };
    pushEnv('主机', host.host_name);
    pushEnv('内核版本', host.kernel_version);
    pushEnv('CPU', host.cpu_model);
    if(host.cpu_num!=null) pushEnv('CPU 数量', host.cpu_num);
    pushEnv('内存', host.memory_size);
    pushEnv('机型', host.machine_model);
    pushEnv('现场进程', sceneContext());
    pushEnv('崩溃位置', cf.rip_function ? (cf.rip_function+(cf.rip_offset?('+'+cf.rip_offset):'')) : '');
    pushEnv('报告 ID', R.report_id);
    if(envDefs.length){
      h += `<div class="appendix-card"><details><summary><span class="appendix-summary-label">主机与运行环境</span><span class="chevron" aria-hidden="true"></span></summary><div class="detail-body"><dl class="env-grid">`;
      envDefs.forEach(([k,v])=>{ h += `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`; });
      if(toArr(host.modules).length) h += `<dt>加载模块</dt><dd>${toArr(host.modules).length} 个</dd>`;
      h += `</dl></div></details></div>`;
    }
  }

  /* 日志特征明细 */
  const lf = cf.log_features || {};
  const lfBlocks = [];
  const relErrs = toArr(lf.related_errors);
  if(relErrs.length){
    lfBlocks.push(`<h4>相关报错</h4><div class="log-evidence-list">` + relErrs.map(e=>{
      const src = esc(e.file||'') + (has(e.lines)?(' · L'+esc(e.lines)):'');
      return `<article class="log-evidence"><div class="log-evidence-head"><span class="source-label">${src}</span>${has(e.relevance)?relevanceBadge(e.relevance):''}</div><code>${esc(e.line||'')}</code>${has(e.desc)?`<p>${esc(e.desc)}</p>`:''}</article>`;
    }).join('') + `</div>`);
  }
  const reps = toArr(lf.repeated);
  if(reps.length){
    lfBlocks.push(`<h4>重复可疑日志</h4><div class="log-evidence-list">` + reps.map(r=>{
      const ref = r.ref || {};
      const src = esc(ref.file||'') + (has(ref.lines)?(' · L'+esc(ref.lines)):'');
      return `<article class="log-evidence"><div class="log-evidence-head"><b>${esc(r.title||'')}</b>${has(r.relevance)?relevanceBadge(r.relevance):''}</div><p>${esc(r.count||'')} 次 · ${esc(r.window||'')}</p>${(Array.isArray(r.examples)&&r.examples.length)?`<code>${esc(r.examples.filter(has).join('\n'))}</code>`:''}${has(r.desc)?`<p>${esc(r.desc)}</p>`:''}${has(r.note)?`<p class="muted">${esc(r.note)}</p>`:''}${src?`<span class="source-label">${src}</span>`:''}</article>`;
    }).join('') + `</div>`);
  }
  const others = toArr(lf.other);
  if(others.length){
    lfBlocks.push(`<h4>其它异常</h4><div class="log-evidence-list">` + others.map(o=>{
      const ref = o.ref || {};
      const src = esc(ref.file||'') + (has(ref.lines)?(' · L'+esc(ref.lines)):'');
      return `<article class="log-evidence"><div class="log-evidence-head"><b>${esc(o.name||'')}</b>${has(o.relevance)?relevanceBadge(o.relevance):''}</div><p>${esc(o.count||'')} 条 · ${esc(o.span||'')}</p>${(Array.isArray(o.lines)&&o.lines.length)?`<code>${esc(o.lines.filter(has).join('\n'))}</code>`:''}${has(o.desc)?`<p>${esc(o.desc)}</p>`:''}${has(o.note)?`<p class="muted">${esc(o.note)}</p>`:''}${src?`<span class="source-label">${src}</span>`:''}</article>`;
    }).join('') + `</div>`);
  }
  if(lfBlocks.length){
    h += `<div class="appendix-card"><details><summary><span class="appendix-summary-label">日志特征明细 <span class="appendix-count">${attachmentLogCount}</span></span><span class="chevron" aria-hidden="true"></span></summary><div class="detail-body"><p class="muted">汇总 vmcore-dmesg 中与本次崩溃相关的日志特征，并按相关性分级。</p>${lfBlocks.join('')}</div></details></div>`;
  }

  /* 知识库案例：按「是否支撑推荐修复方案」分层。
     修复依据组 = verdict=confirmed 的案例 + standard_solution.basis/patch_list 明确引用的案例
     （即使 verdict=same_area，只要被方案引用就升格展示，保证第 1 章修复依据与技术附件一致）。 */
  const allCases = collectCases();
  if(allCases.length){
    const brefs = basisRefs();
    const isBasis = item => String(item.case.verdict||'').toLowerCase() === 'confirmed' || isBasisCited(item.case, brefs);
    const confirmedCases = allCases.filter(isBasis);
    const referenceCases = allCases.filter(item => !isBasis(item));

    /* 修复依据：默认展开 */
    if(confirmedCases.length){
      h += `<div class="appendix-card"><details open><summary><span class="appendix-summary-label">修复依据 <span class="appendix-count">${confirmedCases.length}</span></span><span class="chevron" aria-hidden="true"></span></summary><div class="detail-body"><p class="muted">以下案例是本次推荐修复方案的直接依据：verdict=confirmed 的一手修复证据，或「规避手段 · 修复依据」明确引用的上游 commit（标注「方案引用」）。</p><div class="case-list">`;
      confirmedCases.forEach(item=>{ h += renderCaseCard(item.case, 0, item.source, item.id); });
      h += `</div></div></details></div>`;
    }

    /* 参考案例（未采用）：默认折叠，避免干扰主阅读流 */
    if(referenceCases.length){
      h += `<div class="appendix-card"><details><summary><span class="appendix-summary-label">参考案例（未采用） <span class="appendix-count">${referenceCases.length}</span></span><span class="chevron" aria-hidden="true"></span></summary><div class="detail-body"><p class="muted">以下案例与本次宕机存在相似特征，但触发路径、内核版本或修复口径不完全匹配，仅作为诊断旁证，不作为推荐修复方案。</p><div class="case-list">`;
      referenceCases.forEach(item=>{ h += renderCaseCard(item.case, 0, item.source, item.id); });
      h += `</div></div></details></div>`;
    }
  }

  /* 工作流 */
  if(wt && toArr(wt.steps).length){
    h += `<div class="appendix-card"><details><summary><span class="appendix-summary-label">Agent 诊断工作流 <span class="appendix-count">${wt.step_count||toArr(wt.steps).length}</span></span><span class="chevron" aria-hidden="true"></span></summary><div class="detail-body">`;
    h += `<div class="workflow-list">`;
    toArr(wt.steps).forEach(s=>{
      h += `<article class="workflow-step"><div class="workflow-head"><h4>${esc(s.decision||('步骤 '+(s.step||'')))}</h4>${has(s.status)?`<span class="workflow-status ${statusClass(s.status)}">${esc(s.status)}</span>`:''}</div>`;
      if(has(s.observations)) h += `<p><b>观察：</b>${linkify(s.observations)}</p>`;
      if(has(s.judgment)) h += `<p><b>判断：</b>${linkify(s.judgment)}</p>`;
      const tools = toArr(s.tools);
      if(tools.length){
        h += `<div class="tool-pills">`;
        tools.forEach(t=>{
          const name = (typeof t==='object' && t) ? (t.tool_name || t.title || '') : String(t||'');
          const st = (typeof t==='object' && t) ? (t.status || '') : '';
          if(has(name)||has(st)) h += `<span class="tool-pill ${statusClass(st)}">${esc(name)}${has(st)?` · ${esc(st)}`:''}</span>`;
        });
        h += `</div>`;
      }
      h += `</article>`;
    });
    h += `</div>`;
    h += `</div></details></div>`;
  }

  /* 完整原始报告数据 */
  h += `<div class="appendix-card raw-report-card"><details><summary>完整原始报告数据（report.json）<span class="chevron" aria-hidden="true"></span></summary><div class="detail-body"><pre><code>${esc(JSON.stringify(R, null, 2))}</code></pre></div></details></div>`;

  h += `</section>`;
  return h;
}

/* 生成复制摘要文本 */
function buildSummary(){
  const t = readTime(cf.crash_time);
  const concl = ra.conclusion || deep.lead || '';
  const fixed = ss ? (ss.fixed_in || ss.claim_tag || '') : '';
  const waiver = wa && toArr(wa.case_refs).filter(has).length && has(wa.summary) ? firstSentence(wa.summary) : '';
  const lines = [
    `${host.host_name||R.report_id||''} 宕机分析`,
    t ? `时间：${t}` : '',
    concl ? `根因：${firstSentence(concl)}` : '',
    fixed ? `修复：${fixed}` : '',
    waiver ? `临时缓解：${waiver}` : '',
  ].filter(has);
  return lines.join('\n');
}

/* ===== 渲染入口 ===== */
function render(){
  buildAttachmentIndex();
  document.getElementById('top-meta').textContent = '现场记录 · ' + (readTime(cf.crash_time)||'').slice(0,10);
  document.title = '宕机分析报告 · ' + (host.host_name||R.report_id||'');
  document.getElementById('main').innerHTML =
    renderOverview() + renderFeatures() + renderMechanism() + renderEvidence() + renderAppendix();
  initNav();
  initButtons();
}

/* 单按钮控制所有折叠面板，并用文案明确反馈当前状态。 */
function toggleAllDetails(){
  const panels = [...document.querySelectorAll('details')];
  const shouldOpen = panels.some(d => !d.open);
  panels.forEach(d => { d.open = shouldOpen; });
  const button = document.getElementById('toggle-details');
  if(button){
    button.textContent = shouldOpen ? '收起全部' : '展开全部';
    button.setAttribute('aria-pressed', shouldOpen ? 'true' : 'false');
    button.classList.toggle('is-open', shouldOpen);
  }
}
window.toggleAllDetails = toggleAllDetails;

/* 顶部/底部操作按钮 */
function initButtons(){
  const copyBtn = document.getElementById('copy-summary');
  const copyStatus = document.getElementById('copy-status');
  if(copyBtn){
    copyBtn.addEventListener('click', async ()=>{
      const text = buildSummary();
      if(copyStatus) copyStatus.textContent = '已复制';
      try {
        if(navigator.clipboard && window.isSecureContext){
          await navigator.clipboard.writeText(text);
        } else throw new Error('unavailable');
      } catch(e){
        const area = document.createElement('textarea');
        area.value = text; area.style.cssText='position:fixed;left:-9999px';
        document.body.appendChild(area); area.select();
        try { if(copyStatus) copyStatus.textContent = document.execCommand('copy') ? '已复制' : '请手动选择摘要'; }
        catch(_){ if(copyStatus) copyStatus.textContent = '请手动选择摘要'; }
        area.remove();
      }
      if(copyStatus) setTimeout(()=>{ copyStatus.textContent=''; }, 2000);
    });
  }
  const dlBtn = document.getElementById('download-data');
  if(dlBtn){
    dlBtn.addEventListener('click', ()=>{
      const raw = JSON.stringify(R, null, 2);
      const url = URL.createObjectURL(new Blob([raw],{type:'application/json;charset=utf-8'}));
      const a = document.createElement('a');
      a.href = url; a.download = (host.host_name||R.report_id||'report') + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 1000);
    });
  }
  const printBtn = document.getElementById('print-report');
  if(printBtn) printBtn.addEventListener('click', ()=>window.print());
}

/* 侧边栏滚动高亮 */
function initNav(){
  const navLinks=[...document.querySelectorAll('nav a')];
  const sections=navLinks.map(a=>document.getElementById(a.hash.slice(1))).filter(Boolean);
  let ticking=false;
  function update(){ let cur=sections[0]; for(const s of sections) if(s.getBoundingClientRect().top<=150) cur=s; navLinks.forEach(a=>{ const on=a.hash==='#'+cur.id; a.classList.toggle('active',on); }); ticking=false; }
  window.addEventListener('scroll',()=>{ if(!ticking){ requestAnimationFrame(update); ticking=true; } },{passive:true});
  update();
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', render); else render();

/* 崩溃日志逐行悬停解读：hover 显示、点击钉住（兼容触屏），点空白处取消 */
(function(){
  let tipEl=null, pinnedLine=null;
  function ensureTip(){
    if(!tipEl){ tipEl=document.createElement('div'); tipEl.id='log-tip'; document.body.appendChild(tipEl); }
    return tipEl;
  }
  function showTip(line){
    const tip=line.getAttribute('data-tip'); if(!tip) return;
    const el=ensureTip();
    el.textContent=tip; el.style.display='block';
    el.classList.toggle('pinned', !!pinnedLine);
    const r=line.getBoundingClientRect(), tr=el.getBoundingClientRect();
    let top=r.bottom+8;
    if(top+tr.height>window.innerHeight-8) top=Math.max(8, r.top-tr.height-8);
    let left=Math.min(Math.max(8,r.left), window.innerWidth-tr.width-8);
    el.style.top=top+'px'; el.style.left=left+'px';
  }
  function hideTip(){ if(tipEl){ tipEl.style.display='none'; tipEl.classList.remove('pinned'); } }
  document.addEventListener('mouseover', e=>{
    if(pinnedLine) return;
    const line=e.target.closest && e.target.closest('.log-block');
    if(line && line.hasAttribute('data-tip')) showTip(line);
  });
  document.addEventListener('mouseout', e=>{
    if(pinnedLine) return;
    const line=e.target.closest && e.target.closest('.log-block');
    if(line) hideTip();
  });
  document.addEventListener('click', e=>{
    const line=e.target.closest && e.target.closest('.log-block');
    if(line && line.hasAttribute('data-tip')){
      if(pinnedLine===line){ pinnedLine=null; hideTip(); }
      else { pinnedLine=line; showTip(line); }
    } else if(pinnedLine && !(tipEl && tipEl.contains(e.target))){
      pinnedLine=null; hideTip();
    }
  });
  window.addEventListener('scroll', ()=>{ if(pinnedLine) showTip(pinnedLine); else if(tipEl && tipEl.style.display==='block'){ hideTip(); } }, true);
})();
</script>
