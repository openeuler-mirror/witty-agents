<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内核崩溃综合分析报告</title>
<style>
  :root {
    --primary: #1a56db;
    --primary-dark: #1e429f;
    --danger: #e02424;
    --warning: #ff8a00;
    --success: #057a55;
    --bg: #f5f7fa;
    --card: #ffffff;
    --border: #e5e7eb;
    --text: #1f2937;
    --text-muted: #6b7280;
    --mono-bg: #f3f4f6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 1100px; margin: 0 auto; padding: 32px 24px 64px; }

  /* ===== Header ===== */
  .report-header {
    background: linear-gradient(135deg, #1e3a8a 0%, #1a56db 100%);
    color: #fff;
    border-radius: 12px;
    padding: 40px 40px 32px;
    margin-bottom: 28px;
    box-shadow: 0 4px 20px rgba(30, 58, 138, .25);
  }
  .report-header .tag {
    display: inline-block; background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.35);
    padding: 3px 12px; border-radius: 999px;
    font-size: 12.5px; letter-spacing: .5px; margin-bottom: 14px;
  }
  .report-header h1 { font-size: 27px; font-weight: 700; margin-bottom: 10px; }
  .report-header .subtitle { font-size: 14.5px; opacity: .9; margin-bottom: 22px; }
  .meta-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px; font-size: 13px;
  }
  .meta-item {
    background: rgba(255,255,255,.12); border-radius: 8px; padding: 10px 14px;
  }
  .meta-item .k { opacity: .75; font-size: 12px; margin-bottom: 2px; }
  .meta-item .v { font-weight: 600; }

  /* ===== Sections ===== */
  section {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 28px 32px; margin-bottom: 24px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  h2 {
    font-size: 20px; color: var(--primary-dark);
    padding-bottom: 12px; margin-bottom: 18px;
    border-bottom: 2px solid #e8eefb;
    display: flex; align-items: center; gap: 10px;
  }
  h2 .num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border-radius: 8px;
    background: var(--primary); color: #fff; font-size: 14px; flex-shrink: 0;
  }
  h3 { font-size: 16.5px; color: var(--text); margin: 20px 0 10px; }
  h4 { font-size: 15px; color: var(--text); margin: 14px 0 8px; }
  p { margin-bottom: 10px; }
  ul, ol { margin: 8px 0 12px 22px; }
  li { margin-bottom: 5px; }
  strong { color: var(--text); }
  code {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    background: var(--mono-bg); padding: 1.5px 6px; border-radius: 4px;
    font-size: 13px; color: #c7254e;
  }
  pre {
    background: #1e293b; color: #e2e8f0;
    border-radius: 8px; padding: 16px 18px;
    overflow-x: auto; font-size: 12.8px; line-height: 1.55;
    margin: 12px 0;
  }
  pre code { background: transparent; color: inherit; padding: 0; font-size: inherit; }
  .mono { font-family: Consolas, monospace; font-size: 13px; }

  /* ===== Badges & callouts ===== */
  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600;
  }
  .badge-danger { background: #fde8e8; color: var(--danger); }
  .badge-warning { background: #fef3e8; color: #c25700; }
  .badge-success { background: #e8f7f0; color: var(--success); }
  .badge-info    { background: #e8eefb; color: var(--primary-dark); }
  .badge-gray    { background: #f3f4f6; color: var(--text-muted); }
  .badge-blue    { background: #e8eefb; color: var(--primary); }
  .badge-green   { background: #e8f7f0; color: var(--success); }
  .callout {
    border-radius: 8px; padding: 14px 18px; margin: 14px 0;
    font-size: 14px; border-left: 4px solid;
  }
  .callout-danger  { background: #fdf2f2; border-color: var(--danger); }
  .callout-warning { background: #fffaf0; border-color: var(--warning); }
  .callout-success { background: #f0fdf6; border-color: var(--success); }
  .callout-info    { background: #eff6ff; border-color: var(--primary); }
  .callout .title { font-weight: 700; margin-bottom: 4px; }

  /* ===== Tables ===== */
  table {
    width: 100%; border-collapse: collapse; margin: 14px 0;
    font-size: 13.8px;
  }
  th, td { padding: 10px 12px; text-align: left; border: 1px solid var(--border); }
  th {
    background: #f8fafc; font-weight: 700; color: var(--text);
    white-space: nowrap;
  }
  tr:nth-child(even) td { background: #fafbfc; }
  td.mono, th.mono { font-family: Consolas, monospace; font-size: 12.8px; }
  .center { text-align: center; }
  .nowrap { white-space: nowrap; }

  /* ===== Sequence diagram (事件时序，UML SVG) ===== */
  .seq-wrap { overflow-x: auto; margin: 14px 0 4px; }
  .seq-svg { display: block; min-width: 720px; }
  .seq-legend { display: flex; gap: 18px; flex-wrap: wrap; margin: 10px 0 2px; font-size: 12px; color: var(--text-muted); }
  .seq-legend .lg { display: inline-flex; align-items: center; gap: 6px; }
  .seq-legend .sw { width: 24px; height: 0; border-top: 2px solid #94a3b8; display: inline-block; }
  .seq-legend .sw.dashed { border-top: 2px dashed #cbd5e1; }
  .seq-legend .dbox { width: 12px; height: 12px; border-radius: 3px; background: #64748b; display: inline-block; }
  .seq-legend .dbox.red { background: var(--danger); }

  /* ===== Propagation chain (崩溃扩散链，纵向链条) ===== */
  .pchain { margin: 16px 0 4px; }
  .pc-node { display: flex; gap: 14px; }
  .pc-rail { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; width: 34px; }
  .pc-dot {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    background: var(--primary); color: #fff; font-weight: 700; font-size: 13px;
    display: flex; align-items: center; justify-content: center; margin-top: 5px;
    box-shadow: 0 0 0 4px #e8eefb; z-index: 1;
  }
  .pc-line { width: 2px; flex: 1; background: #cbd5e1; min-height: 30px; position: relative; margin: 2px 0; }
  .pc-line::after {
    content: ""; position: absolute; bottom: -1px; left: 50%; transform: translateX(-50%);
    border: 5px solid transparent; border-top-color: #cbd5e1;
  }
  .pc-node:last-child .pc-line { display: none; }
  .pc-node.is-crash .pc-dot { background: var(--danger); box-shadow: 0 0 0 4px #fde8e8; }
  .pc-card {
    flex: 1; min-width: 0; background: #fff; border: 1px solid var(--border);
    border-radius: 10px; padding: 13px 18px 15px; margin-bottom: 14px;
  }
  .pc-node.is-crash .pc-card { border-color: #f3b4b4; background: #fdf5f5; }
  .pc-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .pc-funcs { font-size: 14px; }
  .pc-funcs .fn { font-family: Consolas, "Liberation Mono", monospace; font-weight: 700; color: var(--text); }
  .pc-funcs .arr { color: var(--text-muted); margin: 0 8px; font-weight: 700; }
  .pc-type { font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 10px; }
  .pc-type.call { background: #e8eefb; color: var(--primary); }
  .pc-type.uaf_free { background: #fde8e8; color: var(--danger); }
  .pc-type.data_pollution { background: #fef3e8; color: #c25700; }
  .pc-type.null_deref { background: #fde8e8; color: var(--danger); }
  .pc-crash-tag { font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 10px; background: var(--danger); color: #fff; }
  .pc-src { margin-top: 6px; font-family: Consolas, "Liberation Mono", monospace; font-size: 12px; color: #94a3b8; }
  .pc-src .path { color: #475569; }
  a.path { color: var(--primary); text-decoration: none; border-bottom: 1px dotted var(--primary); }
  a.path:hover { color: var(--primary-dark); border-bottom-style: solid; }
  .pc-src-link {
    color: var(--primary); font-weight: 600; text-decoration: none; margin-left: 8px;
    border-bottom: 1px dotted var(--primary);
  }
  .pc-src-link:hover { color: var(--primary-dark); border-bottom-style: solid; }
  /* 源码片段展开窗口（未展开时为扁平小标签条；重置全局 details 卡片样式） */
  .pc-snippet {
    margin-top: 6px; margin-bottom: 0; background: transparent;
    border: none; border-radius: 0; box-shadow: none; overflow: visible;
  }
  .pc-snippet > summary {
    cursor: pointer; font-size: 12px; font-weight: 600; color: var(--primary-dark);
    list-style: none; user-select: none; display: inline-block;
    padding: 0 9px; height: 22px; line-height: 22px;
    background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 11px;
  }
  .pc-snippet > summary::before { content: "▸ "; }
  .pc-snippet[open] > summary {
    background: transparent; border-color: transparent; padding: 0; height: auto;
    border-radius: 0; margin-bottom: 2px;
  }
  .pc-snippet[open] > summary::before { content: "▾ "; }
  .pc-snippet > summary:hover { background: #e8eefb; border-color: #cdddf5; }
  .pc-snippet pre {
    margin: 8px 0 0; background: #0f172a; color: #e2e8f0; border-radius: 8px;
    padding: 12px 14px; overflow-x: auto;
  }
  .pc-snippet pre code {
    font-family: Consolas, "Liberation Mono", monospace; font-size: 12.5px;
    line-height: 1.7; white-space: pre; background: none; color: inherit;
  }
  .pc-detail { margin-top: 8px; font-size: 13.5px; line-height: 1.75; color: var(--text); }
  .pc-evidence {
    margin-top: 9px; font-size: 12.5px; color: var(--text-muted);
    background: var(--mono-bg); border-left: 3px solid #cbd5e1;
    padding: 7px 11px; border-radius: 0 6px 6px 0;
    font-family: Consolas, "Liberation Mono", monospace; white-space: pre-wrap; word-break: break-word;
  }

  /* 崩溃路径分析：导语 / 关键观察 / 原始栈折叠 */
  .path-intro {
    margin: 4px 0 16px; padding: 12px 16px; font-size: 13.5px; line-height: 1.8;
    color: #475569; font-style: italic; background: #f8fafc;
    border-left: 3px solid #cbd5e1; border-radius: 0 8px 8px 0;
  }
  .path-obs-card {
    margin: 18px 0 4px; border: 1px solid var(--border); border-radius: 10px;
    background: #f8fafc; padding: 15px 18px 13px;
  }
  .path-obs-title { font-size: 14px; font-weight: 700; color: var(--primary-dark); margin-bottom: 10px; }
  .path-obs { margin: 0; padding: 0; list-style: none; }
  .path-obs li {
    position: relative; font-size: 13.5px; line-height: 1.8; color: var(--text);
    margin-bottom: 8px; padding-left: 18px;
  }
  .path-obs li:last-child { margin-bottom: 0; }
  .path-obs li::before {
    content: ""; position: absolute; left: 3px; top: 10px;
    width: 7px; height: 7px; border-radius: 50%; background: var(--primary);
  }
  .raw-stack { margin-top: 14px; border: 1px solid var(--border); border-radius: 8px; background: #fcfcfd; }
  .raw-stack summary {
    cursor: pointer; padding: 9px 14px; font-size: 13px; font-weight: 600; color: var(--primary-dark);
    user-select: none;
  }
  .raw-stack pre { margin: 0; border-radius: 0 0 8px 8px; max-height: 420px; overflow: auto; }

  /* ===== Flow ===== */
  .flow {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    background: #f8fafc; border: 1px solid var(--border);
    border-radius: 8px; padding: 14px 16px; margin: 12px 0;
    font-family: Consolas, monospace; font-size: 12.5px;
  }
  .flow .box { background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; padding: 6px 10px; }
  .flow .box.hot { border-color: var(--danger); background: #fdf2f2; }
  .flow .arr { color: var(--text-muted); }

  /* ===== Commit cards ===== */
  .commit-card {
    border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 20px; margin-bottom: 14px; background: #fcfcfd;
  }
  .commit-card .sha {
    font-family: Consolas, monospace; font-size: 12.5px;
    background: #eef2ff; color: #3730a3; padding: 2px 8px;
    border-radius: 4px; word-break: break-all;
  }
  .commit-card .subject { font-weight: 700; font-size: 15px; margin: 8px 0 6px; }
  .commit-card .meta { font-size: 13px; color: var(--text-muted); }

  /* ===== Root cause analysis steps ===== */
  .rc-grid { display:flex; flex-direction:column; gap:12px; }
  .rc-conclusion { font-size:15px; line-height:1.85; color:#1e293b; word-break:break-word; font-weight:500; }

  .rc-chain-wrap { border:none; box-shadow:none; margin:0; background:transparent; }
  .rc-chain-wrap summary { padding:10px 4px 6px; font-size:13px; color:var(--accent); font-weight:600; cursor:pointer; user-select:none; list-style:none; display:flex; align-items:center; gap:8px; border-radius:6px; }
  .rc-chain-wrap summary::-webkit-details-marker { display:none; }
  .rc-chain-wrap summary::before { content:"▸"; color:var(--primary); font-size:11px; display:inline-block; transition:transform .15s; }
  .rc-chain-wrap[open] summary::before { transform:rotate(90deg); }
  .rc-chain-wrap summary:hover { background:#f1f5f9; }
  .rc-chain-wrap .rc-chain-body { padding:8px 0 4px; }
  .rc-chain-count { background:#e0f2fe; color:#0369a1; font-size:11px; font-weight:600; padding:1px 8px; border-radius:10px; }
  .rc-chain { position:relative; }
  .rc-step { display:flex; gap:14px; padding:0 0 14px; position:relative; }
  .rc-step:last-child { padding-bottom:0; }
  .rc-step-dot { flex-shrink:0; width:24px; display:flex; justify-content:center; padding-top:2px; position:relative; }
  .rc-step-dot-inner { width:22px; height:22px; border-radius:50%; background:var(--primary); color:#fff; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; z-index:1; box-shadow:0 0 0 3px #fff; flex-shrink:0; }
  .rc-step-dot::after { content:''; position:absolute; top:24px; bottom:-14px; left:50%; width:2px; background:#e2e8f0; transform:translateX(-50%); z-index:0; }
  .rc-step:last-child .rc-step-dot::after { display:none; }
  .rc-step-card { flex:1; min-width:0; background:#fff; border:1px solid var(--border); border-radius:8px; padding:12px 16px; }
  .rc-step-card.is-final { background:#f0fdf6; border:1px solid #6ee7b7; border-left-width:3px; }
  .rc-final-badge { display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.5px; color:#047857; background:#d1fae5; border:1px solid #6ee7b7; border-radius:10px; padding:1px 8px; margin-bottom:6px; }
  .rc-step.is-final .rc-step-fact { color:#065f46; }
  .kb-ref { color:#2563eb; text-decoration:underline; cursor:pointer; }
  .kb-ref:hover { color:#1d4ed8; text-decoration:none; }
  .rc-step-dot-inner { transition:background .15s; }
  .rc-step-fact { font-size:13.5px; font-weight:600; color:#1e293b; margin-bottom:6px; line-height:1.6; }
  .rc-step-evidence { background:#f1f5f9; border-left:3px solid #94a3b8; font-family:"SFMono-Regular",Consolas,monospace; font-size:12px; line-height:1.7; padding:9px 12px; border-radius:0 6px 6px 0; margin:2px 0 8px; white-space:pre; overflow-x:auto; color:#334155; }
  .rc-step-detail { font-size:13px; line-height:1.8; color:#475569; white-space:pre-wrap; word-break:break-word; }
  .rc-stage-label { padding:4px 0 10px 38px; }
  .rc-stage-tag { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; padding:2px 10px; border-radius:11px; border:1px solid; }

  /* ===== Anomaly features ===== */
  .anomaly-grid { display:flex; flex-direction:column; gap:14px; }
  .anomaly-item { padding:10px 14px; background:var(--mono-bg); border:1px solid var(--border); border-radius:8px; }
  .anomaly-label { font-size:11px; color:var(--text-muted); font-weight:600; display:block; margin-bottom:8px; }
  .anomaly-list { display:flex; flex-direction:column; gap:5px; }
  .anomaly-row { font-size:12px; font-family:monospace; padding:6px 10px; background:#fff; border:1px solid var(--border); border-radius:6px; color:var(--text); }
  .anomaly-code { max-height:180px; font-size:11.5px; white-space:pre-wrap; word-break:break-all; margin:0; padding:10px 12px; }
  .chip-warn { background:#fef3c7; color:#92400e; border-color:#fcd34d; }

  /* ===== Modules chips ===== */
  .modules-chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-size:11px; background:var(--mono-bg); border:1px solid var(--border); border-radius:6px; padding:3px 8px; font-family:monospace; }
  .kv-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; }
  .kv { display:flex; flex-direction:column; gap:3px; padding:8px 12px; background:var(--mono-bg); border-radius:8px; border:1px solid var(--border); }
  .kv .k { color:var(--text-muted); font-size:11px; }
  .kv .v { color:var(--text); font-weight:600; word-break:break-all; }

  /* ===== Match cases ===== */
  .match-section { margin-bottom:22px; }
  .match-section:last-child { margin-bottom:0; }
  .match-cases { display:flex; flex-direction:column; gap:12px; }
  .match-cases.collapsed .match-case:not(:first-child) { display:none; }

  /* 三类案例分组 */
  .match-group { margin-bottom:18px; }
  .match-group:last-child { margin-bottom:0; }
  .mg-head {
    display:flex; align-items:center; gap:9px; font-size:14.5px; font-weight:700;
    color:var(--text); margin-bottom:3px;
  }
  .mg-dot { width:10px; height:10px; border-radius:3px; flex-shrink:0; }
  .mg-dot.internal { background:#2563eb; }
  .mg-dot.community { background:#059669; }
  .mg-dot.online { background:#d97706; }
  .mg-count {
    font-size:11px; font-weight:700; padding:1px 9px; border-radius:10px;
    background:#eef2f7; color:#64748b;
  }
  .mg-tag {
    font-size:10.5px; font-weight:600; padding:1px 8px; border-radius:4px;
    background:#fef3e8; color:#b45309; border:1px solid #f5d9b0;
  }
  .mg-desc { font-size:12.5px; color:var(--text-muted); line-height:1.6; margin:0 0 10px 19px; }
  .match-group + .match-group { border-top:1px dashed var(--border); padding-top:16px; }
  .match-case {
    width:100%; flex:0 0 auto; min-width:0;
    background:var(--mono-bg); border:1px solid var(--border);
    border-radius:10px; padding:14px 16px; position:relative; overflow:hidden;
  }
  .match-case .mc-score {
    display:inline-block; font-size:11px; font-weight:700; padding:2px 10px; border-radius:10px;
    margin-bottom:8px;
  }
  .match-case .mc-score.high { background:#dcfce7; color:#166534; }
  .match-case .mc-score.mid { background:#fef3c7; color:#92400e; }
  .match-case .mc-score.low { background:#f1f5f9; color:#64748b; }
  .match-case .mc-level {
    display:inline-block; font-size:10px; font-weight:800; padding:2px 8px; border-radius:10px;
    margin-bottom:8px; margin-left:6px; letter-spacing:.5px;
  }
  .match-case .mc-level.L1 { background:#dcfce7; color:#15803d; border:1px solid #86efac; }
  .match-case .mc-level.L2 { background:#dbeafe; color:#1d4ed8; border:1px solid #93c5fd; }
  .match-case .mc-level.L3 { background:#fef3c7; color:#b45309; border:1px solid #fcd34d; }
  /* L3 弱匹配兜底：未获一手证据确认时，强制警示样式，不携带"高匹配" */
  .match-case.l3-weak { border-color:#fcd34d; background:#fffdf5; }
  .match-case .mc-score.weak { background:#fef3c7; color:#b45309; border:1px dashed #f59e0b; }
  .match-case .mc-level.L3.weak { background:#fff7ed; color:#c2410c; border:1px solid #fb923c; }
  .mc-l3-note {
    background:#fffbeb; border:1px solid #fde68a; border-left:3px solid #f59e0b;
    border-radius:0 6px 6px 0; padding:7px 11px; font-size:12px; line-height:1.7;
    color:#92400e; margin-bottom:10px;
  }
  .match-case .mc-verdict {
    display:inline-block; font-size:11px; font-weight:700; padding:2px 9px; border-radius:10px;
    margin-bottom:8px; margin-left:6px;
  }
  .match-case .mc-verdict.confirmed { background:#dcfce7; color:#15803d; border:1px solid #86efac; }
  .match-case .mc-verdict.same_area { background:#fef3c7; color:#b45309; border:1px solid #fcd34d; }
  .match-case .mc-verdict.not_relevant { background:#f1f5f9; color:#94a3b8; border:1px solid #e2e8f0; }
  .match-case .mc-verdict.unverified { background:#fff; color:#94a3b8; border:1px dashed #cbd5e1; }
  .match-case.excluded { opacity:.6; }

<div class="container" id="app">

  <!-- Header -->
  <div class="report-header" id="report-header">
    <span class="tag">KERNEL CRASH · 综合分析报告</span>
    <h1 id="header-title">加载中...</h1>
    <div class="subtitle" id="header-subtitle"></div>
    <div class="meta-grid" id="header-meta-grid"></div>
  </div>

  <section id="exec-summary-section">
    <h2><span class="num">1</span>执行摘要</h2>
    <div id="exec-summary-body"></div>

  <section id="crash-detail-section">
    <h2><span class="num" id="crash-detail-num">2</span>崩溃详情</h2>
    <div id="crash-detail-body"></div>
  </section>

    <div id="crash-path-body"></div>
  </section>

<script>
const FULL_URL='report.json';
const EMBED_FULL = /*__FULL_DATA__*/null;
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function fetchJSON(url){return fetch(url).then(r=>{if(!r.ok)throw new Error(url+' HTTP '+r.status);return r.json();});}

const linkify=s=>esc(s).replace(/https?:\/\/[^\s<]+/g,m=>{
  const url=m.replace(/[)\].,，。；;！!？?'"'"'”）】]+$/,'');
  const tail=m.slice(url.length);
  return `<a href="${url}" target="_blank" rel="noopener" style="color:#2563eb;text-decoration:underline;word-break:break-all">${url}</a>${tail}`;
});

// ===== 知识库引用跳转（案例 / commit 提及 → 滚动到对应匹配卡片） =====
let KB_REF_MAP = {};
let KB_REF_REGEX = null;
const GENERIC_KB_TOKENS = ['匹配案例','知识库案例','知识库匹配','社区案例','案例','commit','补丁'];
function escapeRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function extractSha(v){
  if(v==null) return '';
  const m = String(v).match(/[0-9a-f]{7,40}/i);
  return m ? m[0] : '';
}
function orderedKBGroups(report){
  const diag = (report && report.diagnosis_repair_result) || {};
  const inr = diag.internal_kernel_result || [];
  const com = diag.community_kernel_result || [];
  const onl = diag.online_result || [];
  const scoreOrder = {高:0,中:1,低:2};
  const byScore = (a,b) => (scoreOrder[a.match_score]??9) - (scoreOrder[b.match_score]??9);
  let idx = 0;
  const pack = arr => arr.map(c => ({c, idx: idx++}));
  return {
    internal: pack([...inr].sort(byScore)),
    community: pack([...com].sort(byScore)),
    online: pack([...onl])
  };
}
function buildKBRefMap(report){
  const map = {};
  const add = (anchor, vals) => {
    vals.forEach(v => {
      const s = String(v==null?'':v).trim();
      if(s.length >= 4){
        const k = s.toLowerCase();
        if(!(k in map)) map[k] = anchor;
      }
    });
  };
  const g = orderedKBGroups(report);
  [...g.internal, ...g.community].forEach(({c, idx}) => {
    add('kb-case-' + idx, [c.knowledge_id, c.id, c.kb_id, c.json_id, c.title]);
  });
  g.online.forEach(({c, idx}) => {
    add('kb-case-' + idx, [c.title, extractSha(c.url), extractSha(c.evidence && c.evidence.html_url), extractSha((c.evidence && c.evidence.sha) || c.source_file)]);
  });
  KB_REF_MAP = map;
  const tokens = [...Object.keys(map), ...GENERIC_KB_TOKENS].sort((a,b) => b.length - a.length);
  const uniq = [...new Set(tokens)];
  KB_REF_REGEX = uniq.length ? new RegExp('(' + uniq.map(escapeRe).join('|') + ')', 'gi') : null;
  return map;
}
function gotoKB(anchor){
  const details = document.getElementById('crash-match-details');
  if(details && !details.open) details.open = true;
  const el = document.getElementById(anchor) || document.getElementById('crash-match-body');
  if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
}
function rich(text){
  const html = linkify(text);
  if(!KB_REF_REGEX) return html;
  return html.split(/(<a\b[^>]*>.*?<\/a>)/gs).map(seg => {
    if(/^<a\b/.test(seg)) return seg;
    return seg.replace(KB_REF_REGEX, function(m){
      const anchor = KB_REF_MAP[m.toLowerCase()] || 'crash-match-body';
      return `<a class="kb-ref" href="#${anchor}" onclick="gotoKB('${anchor}');return false;">${m}</a>`;
    });
  }).join('');
}
function renderProse(id,val,fallback){
  document.getElementById(id).innerHTML=val?`<div class="prose">${linkify(val)}</div>`:(fallback||'<div class="empty-line">无</div>');
}

// ===== Event Timeline (事件时序，UML 时序图 SVG) =====
const SEQ_PALETTE = [
  {m:'#1e429f', fill:'#e8eefb'}, {m:'#057a55', fill:'#e6f7f0'},
  {m:'#c25700', fill:'#fef3e8'}, {m:'#6d28d9', fill:'#f0ecfc'},
  {m:'#b91c1c', fill:'#fde8e8'}, {m:'#0e7490', fill:'#e5f6f8'},
];

function fmtSeqTime(t){
  if(!t || t==='unknown') return '时间未知';
  try{
    const d=new Date(t);
    if(!isNaN(d.getTime())){
      return d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
    }
  }catch(e){}
  return t;
}

function _wrapSeqLines(text, maxChars){
  const t=String(text||'');
  const lines=[]; let cur='';
  for(const ch of t){
    cur+=ch;
    const w=[...cur].reduce((sum,c)=>sum+(c.charCodeAt(0)<128?0.55:1),0);
    if(w>=maxChars){ lines.push(cur); cur=''; }
  }
  if(cur) lines.push(cur);
  return lines.slice(0,4);
}

function seqCard(cx, cy, w, time, event, isCrash){
  const padX=11, padY=8, lineH=16;
  const maxChars=Math.max(8, Math.floor((w-padX*2)/12));
  const lines=_wrapSeqLines(event, maxChars);
  const h=padY*2+14+lines.length*lineH;
  const x=cx-w/2, y=cy-h/2;
  let out=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w}" height="${h}" rx="7" fill="${isCrash?'#fdf5f5':'#ffffff'}" stroke="${isCrash?'#f3b4b4':'#d5dbe6'}" stroke-width="${isCrash?1.6:1.1}"/>`;
  out+=`<text x="${(x+padX).toFixed(1)}" y="${(y+padY+9).toFixed(1)}" font-size="10.5" fill="#94a3b8" font-family="Consolas, monospace">${esc(time)}</text>`;
  lines.forEach((ln,li)=>{
    out+=`<text x="${(x+padX).toFixed(1)}" y="${(y+padY+24+li*lineH).toFixed(1)}" font-size="12" fill="${isCrash?'#b91c1c':'#334155'}" font-family="PingFang SC, Microsoft YaHei, sans-serif">${esc(ln)}</text>`;
  });
  return out;
}

function renderEventTimeline(report){
  const ra=report.root_cause_analysis||{};
  const events=ra.event_chain||[];
  const el=document.getElementById('event-timeline-section');
  const body=document.getElementById('event-timeline-body');
  if(!events.length){ el.style.display='none'; return; }
  el.style.display='';

  // 参与者(泳道)：按事件首次出现顺序
  const actors=[];
  events.forEach(ev=>{
    if(ev.actor && !actors.includes(ev.actor)) actors.push(ev.actor);
    if(ev.to_actor && !actors.includes(ev.to_actor)) actors.push(ev.to_actor);
  });
  if(!actors.length) actors.push('系统日志观测');
  const n=actors.length;
  const margin=90, spacing=210;
  const width=Math.max(760, margin*2+Math.max(1,n-1)*spacing);
  const headH=46, rowH=92, bottomPad=22;
  const height=headH+events.length*rowH+bottomPad;
  const px=i => n===1 ? width/2 : margin+i*((width-margin*2)/(n-1));
  const lane=i => SEQ_PALETTE[i%SEQ_PALETTE.length];

  let s='';
  s+=`<div class="seq-wrap"><svg class="seq-svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">`;
  s+=`<defs>
    <marker id="seq-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="seq-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>`;

  // 生命线
  actors.forEach((a,i)=>{
    s+=`<line x1="${px(i)}" y1="${headH-2}" x2="${px(i)}" y2="${height-bottomPad}" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,5"/>`;
  });
  // 参与者头部
  actors.forEach((a,i)=>{
    const c=lane(i), w=Math.min(150, spacing-24);
    s+=`<rect x="${(px(i)-w/2).toFixed(1)}" y="8" width="${w}" height="32" rx="6" fill="${c.fill}" stroke="${c.m}" stroke-width="1.5"/>`;
    s+=`<text x="${px(i)}" y="29" text-anchor="middle" font-size="13" font-weight="700" fill="${c.m}" font-family="PingFang SC, Microsoft YaHei, sans-serif">${esc(a)}</text>`;
  });

  // 事件
  events.forEach((ev,i)=>{
    const isCrash=i===events.length-1;
    const y=headH+i*rowH+40;
    const ai=Math.max(0, actors.indexOf(ev.actor));
    const ax=px(ai);
    const c=lane(ai);
    const tLabel=fmtSeqTime(ev.time);
    // 激活条
    s+=`<rect x="${(ax-5).toFixed(1)}" y="${y-17}" width="10" height="34" rx="3" fill="${isCrash?'#dc2626':c.m}"/>`;
    if(ev.to_actor && actors.includes(ev.to_actor)){
      const bx=px(actors.indexOf(ev.to_actor));
      const dir=bx>ax?1:-1;
      s+=`<line x1="${(ax+dir*7).toFixed(1)}" y1="${y}" x2="${(bx-dir*7).toFixed(1)}" y2="${y}" stroke="${isCrash?'#dc2626':'#64748b'}" stroke-width="1.6" marker-end="${isCrash?'url(#seq-arrow-red)':'url(#seq-arrow)'}"/>`;
      s+=seqCard((ax+bx)/2, y-10, Math.abs(bx-ax)-26, tLabel, ev.event, isCrash);
    } else {
      const cardW=Math.min(196, spacing-28);
      const putLeft=(n>1 && ai===n-1);
      const cx=putLeft ? ax-cardW/2-16 : ax+cardW/2+16;
      const x1=putLeft?ax-7:ax+7, x2=putLeft?cx+cardW/2:cx-cardW/2;
      s+=`<line x1="${x1.toFixed(1)}" y1="${y}" x2="${x2.toFixed(1)}" y2="${y}" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3,3"/>`;
      s+=seqCard(cx, y, cardW, tLabel, ev.event, isCrash);
    }
  });
  s+='</svg></div>';
  s+=`<div class="seq-legend">
    <span class="lg"><span class="sw"></span>跨组件消息/调用</span>
    <span class="lg"><span class="sw dashed"></span>生命线（时间向下）</span>
    <span class="lg"><span class="dbox"></span>组件事件</span>
    <span class="lg"><span class="dbox red"></span>崩溃爆发</span>
  </div>`;
  body.innerHTML=s;
}

// ===== Crash Path (调用栈 + 崩溃扩散链 + 源码线索 整合) =====
function stripLeadingEmoji(s){
  return String(s||'').replace(/^\s*[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]+\s*/u,'');
}

function renderCrashPath(report){
  const cf=report.crash_feature_info||{};
  const ra=report.root_cause_analysis||{};
  const traceText=cf.call_trace_text||'';
  const summary=cf.call_trace_summary||null;
  const chain=ra.propagation_chain||[];
  const body=document.getElementById('crash-path-body');
  let h='';

  // 1) 路径导语：一句话讲清完整调用路径
  if(summary && summary.summary){
    h+=`<p class="path-intro">${linkify(summary.summary)}</p>`;
  }

  // 2) 纵向链条 = 调用栈的源码级解读（每跳：函数对 + 关系 + 源码位置 + 解读 + 原始栈帧行）
  const relMeta={
    call:{label:'正常调用',cls:'call'},
    uaf_free:{label:'UAF 释放',cls:'uaf_free'},
    data_pollution:{label:'数据污染',cls:'data_pollution'},
    null_deref:{label:'空指针解引用',cls:'null_deref'},
  };
  if(chain.length){
    h+='<div class="pchain">';
    chain.forEach((step,i)=>{
      const isCrash=i===chain.length-1;
      const meta=relMeta[step.type]||{label:step.type||'调用',cls:'call'};
      const src=step.source_file||'';
      const fnUrl=step.source_url||'';
      // 文件页链接：由函数 ident 链接推导（/ident/<func> → /source/<file>）
      let fileUrl='';
      if(fnUrl && src){
        fileUrl=fnUrl.replace(/\/ident\/[^/]+$/, '/source/'+src);
      }
      let srcLine='';
      if(src || fnUrl){
        srcLine='<div class="pc-src">源码位置：';
        if(src && fileUrl){
          srcLine+=`<a class="path" href="${esc(fileUrl)}" target="_blank" rel="noopener" title="在新窗口查看该源码文件">${esc(src)}</a>`;
        } else {
          srcLine+=`<span class="path">${esc(src)}</span>`;
        }
        if(fnUrl){
          srcLine+=` <a class="pc-src-link" href="${esc(fnUrl)}" target="_blank" rel="noopener" title="在新窗口定位到函数 ${esc(step.to||'')} 的定义">查看源码 ↗</a>`;
        }
        srcLine+='</div>';
      }
      const snippet=(step.source_snippet||'').trim();
      const snippetBlock=snippet
        ? `<details class="pc-snippet"><summary>源码片段（${esc(step.to||'')}）</summary><pre><code>${esc(snippet)}</code></pre></details>`
        : '';
      h+=`<div class="pc-node ${isCrash?'is-crash':''}">`+
        `<div class="pc-rail"><div class="pc-dot">${i+1}</div><div class="pc-line"></div></div>`+
        `<div class="pc-card">`+
          `<div class="pc-head">`+
            `<span class="pc-funcs"><span class="fn">${esc(step.from||'')}</span><span class="arr">→</span><span class="fn">${esc(step.to||'')}</span></span>`+
            `<span class="pc-type ${meta.cls}">${meta.label}</span>`+
            (isCrash?'<span class="pc-crash-tag">崩溃爆发</span>':'')+
          `</div>`+
          srcLine+
          snippetBlock+
          (step.detail?`<div class="pc-detail">${linkify(step.detail)}</div>`:'')+
          (step.evidence?`<div class="pc-evidence">${esc(step.evidence)}</div>`:'')+
        `</div>`+
      `</div>`;
    });
    h+='</div>';
  } else if(traceText){
    // 回退：无扩散链数据时，原始调用栈直接展示
    h+=`<pre><code>${esc(traceText)}</code></pre>`;
  }

  // 3) 关键观察小结（卡片）
  if(summary && summary.key_observations && summary.key_observations.length){
    h+=`<div class="path-obs-card"><div class="path-obs-title">关键观察</div>`+
       `<ul class="path-obs">${summary.key_observations.map(o=>`<li>${esc(stripLeadingEmoji(o))}</li>`).join('')}</ul></div>`;
  }

  // 4) 完整原始调用栈折叠备查（有链条时）
  if(chain.length && traceText){
    h+=`<details class="raw-stack"><summary>查看完整原始调用栈</summary><pre><code>${esc(traceText)}</code></pre></details>`;
  }

  if(!h) h='<div class="empty-line">无调用栈数据</div>';
  body.innerHTML=h;
}

// ===== Root Cause Analysis =====
const STAGE_META = {
  phenomenon:       { name:'现象确认',      color:'#3b82f6' },
  log_location:     { name:'日志定位',      color:'#0891b2' },
  source_analysis:  { name:'源码分析',      color:'#7c3aed' },
  propagation:      { name:'崩溃扩散链',    color:'#ea580c' },
  root_cause:       { name:'根因收敛',      color:'#dc2626', hint:'仅凭本次崩溃自身证据收敛缺陷机制' },
  kb_corroboration: { name:'知识库佐证',    color:'#059669', hint:'用外部案例交叉验证上述根因，非重新推导' },
  fix_verification: { name:'修复方案',      color:'#059669', hint:'把根因转化为可执行修复与版本判定' },
};
const _stageMeta = s => STAGE_META[s] || { name:'分析', color:'#64748b' };

function renderRootCause(report){
  const ra=report.root_cause_analysis||{};
  let h='';
  if(ra.conclusion){
    h+=`<div class="rc-conclusion" style="margin-bottom:16px;">${rich(ra.conclusion)}</div>`;
  }
  const steps = Array.isArray(ra.analysis) ? ra.analysis : (typeof ra.analysis==='string'&&ra.analysis ? [{fact:'深度分析',detail:ra.analysis}] : []);
  if(steps.length > 0){
    let lastStage = null;
    const stepHtml = steps.map((s,i) => {
      const meta = _stageMeta(s.stage);
      const isFinal = s.stage === 'fix_verification';
      const stageHdr = (s.stage !== lastStage) ? (lastStage = s.stage,
        `<div class="rc-stage-label"><span class="rc-stage-tag" style="background:${meta.color}1a;color:${meta.color};border-color:${meta.color}55">${meta.name}</span>${meta.hint?`<span class="rc-stage-hint">${meta.hint}</span>`:''}</div>`) : '';
      return stageHdr +
      `<div class="rc-step${isFinal?' is-final':''}">` +
        `<div class="rc-step-dot"><div class="rc-step-dot-inner" style="background:${meta.color}">${isFinal?'✓':(i+1)}</div></div>` +
        `<div class="rc-step-card${isFinal?' is-final':''}">` +
          `${isFinal?'<div class="rc-final-badge">修复方案</div>':''}` +
          `<div class="rc-step-fact">${rich(s.fact||'')}</div>` +
          (s.evidence ? `<div class="rc-step-evidence">${rich(s.evidence)}</div>` : '') +
          `<div class="rc-step-detail">${rich(s.detail||'')}</div>` +
        `</div>` +
      `</div>`;
    }).join('');
    h+=`<details class="rc-chain-wrap" open><summary>分析推理链<span class="rc-chain-count">${steps.length} 步</span></summary><div class="rc-chain-body"><div class="rc-chain">${stepHtml}</div></div></details>`;
  }
  if(!h) h='<div class="empty-line">无</div>';
  document.getElementById('rootcause-body').innerHTML=h;
}

  const hasCompare = items.some(it=> !!(it.current||it.reference));
  let body='';
  if(hasCompare){
    body=`<table class="corrob-table"><thead><tr><th class="ct-dim">论证维度</th><th class="ct-verdict">结论</th><th class="ct-cur">本次崩溃</th><th class="ct-ref">参考案例</th></tr></thead><tbody>`;
    items.forEach(it=>{
      const dim=_CORROB_DIM[it.dimension]||{name:it.dimension||'论证', color:'#64748b'};
      const st=_CORROB_STATE[it.verdict]||_CORROB_STATE.partial;
      const rl=_CORROB_ROLE[dim.role]||_CORROB_ROLE.support;
      const cur=it.current||'';
      const ref=it.reference||'';
      if(!cur && !ref && it.text){
        body+=`<tr class="corrob-row ${esc(it.verdict||'partial')}">`+
          `<td class="ct-dim">${dim.name}<span class="corrob-role ${rl.cls}">${rl.tag}</span></td><td class="ct-verdict"><span class="corrob-state">${st.sym} ${st.label}</span></td>`+
          `<td class="ct-span" colspan="2">${esc(it.text)}</td></tr>`;
      } else {
        body+=`<tr class="corrob-row ${esc(it.verdict||'partial')}">`+
          `<td class="ct-dim"><span class="corrob-dim" style="background:${dim.color}16;color:${dim.color};border:1px solid ${dim.color}44">${dim.name}</span><span class="corrob-role ${rl.cls}">${rl.tag}</span></td>`+
          `<td class="ct-verdict"><span class="corrob-state">${st.sym} ${st.label}</span></td>`+
          `<td class="ct-cur">${esc(cur)}</td>`+
          `<td class="ct-ref">${esc(ref)}</td></tr>`;
      }
    });
    body+='</tbody></table>';
  } else {
    body=`<div class="corrob">`;
    items.forEach(it=>{
      const dim=_CORROB_DIM[it.dimension]||{name:it.dimension||'论证', color:'#64748b'};
      const st=_CORROB_STATE[it.verdict]||_CORROB_STATE.partial;
      const rl=_CORROB_ROLE[dim.role]||_CORROB_ROLE.support;
      body+=`<div class="corrob-item ${esc(it.verdict||'partial')}">`+
        `<span class="corrob-dim" style="background:${dim.color}16;color:${dim.color};border:1px solid ${dim.color}44">${dim.name}</span>`+
        `<span class="corrob-body"><span class="corrob-state">${st.sym} ${st.label}</span><span class="corrob-text">${esc(it.text||'')}</span></span>`+
        `</div>`;
    });
    body+='</div>';
  }
  return `<div class="mc-label">多维匹配论证</div>`+body;
}

// 适用性判断链（结论 + 采用方式 + 关卡）
const _AP_VERDICT={
  direct_adopt:   {label:'可直接采用',   cls:'v-direct_adopt'},
  adapt:          {label:'需适配后采用', cls:'v-adapt'},
  borrow:         {label:'仅思路借鉴',   cls:'v-borrow'},
  not_applicable: {label:'不适用',       cls:'v-not_applicable'},
};
function renderApplicability(a){
  if(!a) return '';
  if(typeof a === 'string'){
    return `<div class="mc-applicability"><b>适用条件（采用前提）：</b>${linkify(a)}</div>`;
  }
  const v=_AP_VERDICT[a.verdict]||_AP_VERDICT.not_applicable;
  const method=a.method?`<div class="ap-method"><b>采用方式：</b>${linkify(a.method)}</div>`:'';
  const steps=Array.isArray(a.steps)&&a.steps.length
    ? `<ol class="ap-steps">${a.steps.map(s=>`<li>${linkify(s)}</li>`).join('')}</ol>`:'';
  return `<div class="mc-applicability">`+
    `<div class="ap-head"><span class="ap-title">适用性判断</span><span class="ap-verdict ${v.cls}">${v.label}</span></div>`+
    method+steps+
    `</div>`;
}

// 本地案例（内部知识库 / 社区案例库）卡片
function localCaseCard(rawC, sourceLabel, cf, idx){
  const c={...rawC, source:sourceLabel};
  const scoreCls={高:'high',中:'mid',低:'low'};
  const fp=c.fingerprints||[];
  const level=c.match_level||'';
  const verdict=c.verdict||'';
  // L3 是扩大召回的弱匹配池：仅当一手证据 confirmed/same_area 时才采信其分数；
  // 否则无论分数高低，强制标注"待核验"，不作为确诊依据。
  const isWeakL3=(level==='L3' && verdict!=='confirmed' && verdict!=='same_area');
  let h=`<div class="match-case${verdict==='not_relevant'?' excluded':''}${isWeakL3?' l3-weak':''}" id="kb-case-${idx}">`;
  if(isWeakL3){
    h+=`<span class="mc-score weak" title="L3 扩大召回的弱匹配，指纹未达确认标准，需人工核验，不作为确诊依据">待核验</span>`;
  } else {
    h+=`<span class="mc-score ${scoreCls[c.match_score]||'low'}">${esc(c.match_score||'—')}匹配</span>`;
  }
  if(level){
    h+=`<span class="mc-level ${level}${isWeakL3?' weak':''}" title="${esc(_LEVEL_DESC[level]||'')}">${level}${isWeakL3?' · 弱匹配':''}</span>`;
  }
  if(verdict){
    const vM=_VERDICT_META[verdict]||[verdict,''];
    h+=`<span class="mc-verdict ${verdict}" title="${esc(vM[1])}">${vM[0]}</span>`;
  }
  h+=`<div class="mc-id">${esc(c.source)} · ${esc(c.knowledge_id||c.id||'')}</div>`;
  if(isWeakL3){
    h+=`<div class="mc-l3-note">L3 扩大召回弱匹配：该案例来自扩大召回池，崩溃指纹未达 L1/L2 确认标准，仅作排查线索参考，结论需人工核验。</div>`;
  }
  const summary=c.bug_summary||c.title||'';
  if(summary) h+=`<div class="mc-label">案例摘要</div><div class="mc-text">${esc(summary)}</div>`;

  const rawReason=c.match_reason||{};
  let reason={...rawReason};
  if(!Object.keys(reason).length){
    if(level==='L1'){
      reason['_l1_fingerprint']='指纹精确命中：崩溃特征签名在案例指纹库中完全匹配';
    }
    if(cf.bug_type && c.bug_type && cf.bug_type===c.bug_type){
      reason['bug_type_match']=`bug_type 一致: ${cf.bug_type}`;
    }
    if(cf.rip_function && c.rip_function && cf.rip_function===c.rip_function){
      reason['rip_match']=`RIP 函数一致: ${cf.rip_function}`;
    }
    if(cf.bug_key && c.bug_key && cf.bug_key===c.bug_key){
      reason['bug_key_overlap']=`bug_key 语义一致: ${cf.bug_key}`;
    }
    const cfCt=Array.isArray(cf.call_trace_signature)?cf.call_trace_signature:[];
    const cCt=Array.isArray(c.call_trace_signature)?c.call_trace_signature:[];
    if(cfCt.length && cCt.length){
      const cfSet=new Set(cfCt.map(s=>s.toLowerCase()));
      const common=cCt.filter(f=>cfSet.has(f.toLowerCase()));
      if(common.length>=2){
        reason['call_trace_overlap']=`调用栈共同函数: ${common.slice(0,5).join(', ')} (${common.length}个)`;
      }
    }
    const cfMods=Array.isArray(cf.related_modules)?cf.related_modules:[];
    const cMods=Array.isArray(c.related_modules)?c.related_modules:[];
    if(cfMods.length && cMods.length){
      const cfMSet=new Set(cfMods.map(s=>s.toLowerCase()));
      const commonMods=cMods.filter(m=>cfMSet.has(m.toLowerCase()));
      if(commonMods.length) reason['module_match']=`关联模块一致: ${commonMods.join(', ')}`;
    }
    if(cf.kernel_version && Array.isArray(c.kernel_versions) && c.kernel_versions.length){
      const cfKv=cf.kernel_version.toLowerCase();
      const kvMatch=c.kernel_versions.some(kv=>kv && (kv.toLowerCase()===cfKv || kv.toLowerCase().startsWith(cfKv.split('.').slice(0,2).join('.'))));
      if(kvMatch) reason['kernel_version_match']=`内核版本匹配 (当前: ${cf.kernel_version})`;
    }
    const cfEks=(cf.anomaly_features&&cf.anomaly_features.error_keywords)||[];
    const cEks=Array.isArray(c.error_keywords)?c.error_keywords:[];
    if(cfEks.length && cEks.length){
      const cfESet=new Set(cfEks.map(s=>s.toLowerCase()));
      const commonEks=cEks.filter(k=>cfESet.has(k.toLowerCase()));
      if(commonEks.length) reason['error_keyword_match']=`异常关键词一致: ${commonEks.join(', ')}`;
    }
    if(level==='L2' && !Object.keys(reason).length){
      reason['_l2_rag']='RAG语义检索召回：综合评分达到匹配阈值';
    }
    if(level==='L3' && !Object.keys(reason).length){
      reason['_l3_expand']='扩大召回弱匹配：语义相似度较高，建议人工核验';
    }
  }

  const reasonKeys=Object.keys(reason);
  let reasonListHtml='';
  if(reasonKeys.length){
    reasonListHtml=`<ul class="mc-reason-list">`;
    const reasonLabel={
      _l1_fingerprint:'指纹命中', _l2_rag:'检索方式', _l3_expand:'检索方式',
      bug_type_match:'崩溃类型', rip_match:'RIP函数一致', rip_consistency:'RIP函数一致',
      call_trace_overlap:'调用栈重叠', module_match:'模块匹配', kernel_version_match:'内核版本',
      phenomenon_similarity:'现象相似度', content_similarity:'内容/根因匹配',
      exact_token_match:'关键词精确命中', title_score:'标题匹配', content_score:'内容匹配',
      exact_token_score:'技术词命中', kernel_version_score:'版本匹配',
      commit_relevance:'补丁相关性', commit_summary:'补丁摘要',
      bug_key_overlap:'bug_key语义关联', error_keyword_match:'异常关键词一致',
      keyword_overlap:'共同关键词', rip_mismatch:'RIP函数不一致',
    };
    const priorityKeys=['_l1_fingerprint','_l2_rag','_l3_expand'];
    const positiveKeys=['bug_type_match','rip_match','rip_consistency','call_trace_overlap',
      'module_match','kernel_version_match','phenomenon_similarity','content_similarity',
      'exact_token_match','commit_relevance','commit_summary','bug_key_overlap',
      'error_keyword_match','keyword_overlap','title_score','content_score',
      'exact_token_score','kernel_version_score'];
    const negativeKeys=['rip_mismatch'];
    const orderedKeys=[];
    for(const k of priorityKeys){ if(reason[k]) orderedKeys.push(k); }
    for(const k of positiveKeys){ if(reason[k] && !orderedKeys.includes(k)) orderedKeys.push(k); }
    for(const k of reasonKeys){ if(!orderedKeys.includes(k) && !negativeKeys.includes(k)) orderedKeys.push(k); }
    for(const k of negativeKeys){ if(reason[k]) orderedKeys.push(k); }
    for(const k of orderedKeys){
      const v=reason[k];
      if(!v) continue;
      let liCls='';
      if(negativeKeys.includes(k)) liCls=' class="miss"';
      else if(k.startsWith('_l3')) liCls=' class="warn"';
      const label=reasonLabel[k]||k;
      reasonListHtml+=`<li${liCls}><b>${esc(label)}</b>：${esc(v)}</li>`;
    }
    reasonListHtml+=`</ul>`;
  }
  const corr=renderCorroboration(c.corroboration);
  if(corr){
    // 多维论证为主，工具自动评分明细折叠备查
    h+=corr;
    if(reasonListHtml){
      h+=`<details class="mc-evidence" style="margin-top:6px"><summary>自动匹配评分明细 · ${esc(level||'L2')}</summary><div class="mc-ev-body">${reasonListHtml}</div></details>`;
    }
  } else if(reasonListHtml){
    h+=`<div class="mc-label">匹配论证${level?' · '+level:''}</div>${reasonListHtml}`;
  }
  if(c.phenomenon){
    h+=`<div class="mc-label">现象描述</div><div class="mc-text">${esc(c.phenomenon)}</div>`;
  }
  if(fp.length) h+=`<div class="mc-label">匹配指纹</div><div class="mc-chips">${fp.map(f=>`<span class="mc-chip">${esc(f)}</span>`).join('')}</div>`;
  if(c.root_cause) h+=`<div class="mc-label">案例根因</div><div class="mc-text">${esc(c.root_cause)}</div>`;
  h+=renderApplicability(c.applicability);
  if(c.solution) h+=`<div class="mc-label">案例解决方案</div><div class="mc-text">${esc(c.solution)}</div>`;
  if(c.hotpatch) h+=`<div class="mc-label">热补丁</div><div class="mc-text">${esc(c.hotpatch)}</div>`;

  const ev=c.evidence||null;
  if(ev && (ev.fetched || (Array.isArray(ev.reasons)&&ev.reasons.length))){
    const kind=ev.source_kind==='issue'?'issue 原文':'commit 原文';
    const stats=(ev.additions||ev.deletions)?` · +${ev.additions||0}/-${ev.deletions||0}`:'';
    h+=`<details class="mc-evidence"><summary>上游一手证据 · ${esc(kind)}${stats}</summary><div class="mc-ev-body">`;
    if(Array.isArray(ev.reasons) && ev.reasons.length){
      h+=`<ul class="mc-reason-list">${ev.reasons.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>`;
    }
    const files=ev.touched_files||[];
    if(files.length){
      h+=`<div class="mc-label">补丁改动文件</div><div class="mc-files">${files.map(f=>`<span class="mc-file">${esc(f)}</span>`).join('')}</div>`;
    }
    const fns=ev.touched_functions||[];
    if(fns.length){
      h+=`<div class="mc-label">补丁修改函数</div><div class="mc-fns">${fns.map(f=>`<span class="mc-fn">${esc(f)}()</span>`).join('')}</div>`;
    }
    if(ev.commit_message){
      h+=`<div class="mc-label">commit message</div><div class="mc-quote">${esc(ev.commit_message)}</div>`;
    }
    if(ev.issue_title){
      h+=`<div class="mc-label">issue 标题</div><div class="mc-text">${esc(ev.issue_title)}${ev.issue_state?` <span class="mc-chip">${esc(ev.issue_state)}</span>`:''}</div>`;
    }
    if(ev.issue_body_excerpt){
      h+=`<div class="mc-label">issue 原文摘要</div><div class="mc-quote">${esc(ev.issue_body_excerpt)}</div>`;
    }
    if(ev.html_url){
      h+=`<div style="margin-top:6px"><a href="${esc(ev.html_url)}" target="_blank" style="font-size:11px">查看上游原文 ↗</a></div>`;
    }
    const related=ev.related_commits||[];
    if(related.length){
      h+=`<div class="mc-label">同一补丁的其他来源（上游/回合）</div><div class="mc-text" style="font-size:11px">`
        +related.map(r=>`<a href="${esc(r.url)}" target="_blank" style="margin-right:10px; white-space:nowrap">${esc(r.source||'upstream')} ${esc((r.sha||'').slice(0,12))} ↗</a>`).join('')
        +`</div>`;
    }
    h+=`</div></details>`;
  }
  h+='</div>';
  return h;
}

// 在线案例（实时爬取的 commit/issue/mail）卡片
function onlineCaseCard(item, idx){
  const kind=item.kind||'commit';
  const kindLabel={commit:'上游 commit', issue:'上游 issue', mail:'邮件讨论'}[kind]||kind;
  const url=item.url || item.source_file || (item.evidence&&item.evidence.html_url) || '';
  let h=`<div class="match-case online" id="kb-case-${idx}">`;
  h+=`<span class="mc-kind ${esc(kind)}">${esc(kindLabel)}</span>`;
  if(kind!=='mail' && item.verdict){
    const vM=_VERDICT_META[item.verdict]||[item.verdict,''];
    h+=`<span class="mc-verdict ${item.verdict}" title="${esc(vM[1])}">${vM[0]}</span>`;
  }
  // 标题（可点击跳转原文）
  if(url){
    h+=`<div class="mc-online-title"><a href="${esc(url)}" target="_blank" rel="noopener">${esc(item.title||'（无标题）')} ↗</a></div>`;
  } else {
    h+=`<div class="mc-online-title">${esc(item.title||'（无标题）')}</div>`;
  }

  if(kind==='mail'){
    // 邮件：作者 / 列表 / 摘要 / 适用理由
    const metaBits=[];
    if(item.author) metaBits.push(`发件人：${esc(item.author)}`);
    if(item.mail_list) metaBits.push(`<span class="ml-list">${esc(item.mail_list)}</span>`);
    if(metaBits.length) h+=`<div class="mc-mail-meta">${metaBits.join(' · ')}</div>`;

    // 抽象视图：讨论主线 + 分析思路 + 对本次指导（为主）；原始摘录折叠备查
    const turns=Array.isArray(item.discussion_logic)?item.discussion_logic:[];
    const reasoning=Array.isArray(item.analysis_reasoning)?item.analysis_reasoning:[];
    const hasAbstract = turns.length || reasoning.length || item.guidance;
    if(hasAbstract){
      if(turns.length){
        h+=`<div class="mc-label">讨论主线</div><div class="mail-thread">`;
        const roleName={reporter:'报告者',maintainer:'维护者',reviewer:'评审者',stable_maintainer:'稳定版负责人',community:'社区讨论'};
        turns.forEach(t=>{
          const r=t.role||'community';
          h+=`<div class="mail-turn"><span class="mt-role ${esc(r)}">${esc(roleName[r]||r)}</span>`+
             `<span class="mt-text">${esc(t.text||'')}</span></div>`;
        });
        h+=`</div>`;
      }
      if(reasoning.length){
        h+=`<div class="mc-label">社区分析思路</div><ol class="mail-reasoning">`+
           reasoning.map(s=>`<li>${esc(s)}</li>`).join('')+
           `</ol>`;
      }
      if(item.guidance){
        h+=`<div class="mail-guidance"><b>对本次分析的指导：</b>${linkify(item.guidance)}</div>`;
      }
      if(item.snippet){
        h+=`<details class="mc-evidence" style="margin-top:6px"><summary>原始邮件摘录</summary><div class="mc-ev-body"><div class="mc-quote">${esc(item.snippet)}</div></div></details>`;
      }
      const corrMail=renderCorroboration(item.corroboration);
      if(corrMail) h+=corrMail;
    } else {
      // 回退：无抽象数据时展示原始摘录
      if(item.snippet){
        h+=`<div class="mc-label">邮件原文摘录</div><div class="mc-quote">${esc(item.snippet)}</div>`;
      }
      const corrMail=renderCorroboration(item.corroboration);
      if(corrMail){
        h+=corrMail;
      } else if(item.relevance){
        h+=`<div class="mc-relevance"><b>匹配论证：</b>${esc(item.relevance)}</div>`;
      }
    }
  } else {
    // commit/issue：多维论证为主，补丁相关性论据兜底
    const mr=item.match_reason||{};
    const relReason=mr.commit_relevance||'';
    const corrCommit=renderCorroboration(item.corroboration);
    if(corrCommit){
      h+=corrCommit;
    } else if(relReason){
      h+=`<div class="mc-relevance"><b>匹配论证：</b>${esc(relReason)}</div>`;
    }
    if(item.phenomenon){
      h+=`<div class="mc-label">现象描述</div><div class="mc-text">${esc(item.phenomenon)}</div>`;
    }
    if(item.root_cause) h+=`<div class="mc-label">根因说明</div><div class="mc-text">${esc(item.root_cause)}</div>`;
    h+=renderApplicability(item.applicability);
    if(item.solution) h+=`<div class="mc-label">修复方案</div><div class="mc-text">${esc(item.solution)}</div>`;
    const ev=item.evidence||null;
    if(ev && (ev.fetched || (Array.isArray(ev.reasons)&&ev.reasons.length))){
      const stats=(ev.additions||ev.deletions)?` · +${ev.additions||0}/-${ev.deletions||0}`:'';
      h+=`<details class="mc-evidence"><summary>一手 diff 证据${stats}</summary><div class="mc-ev-body">`;
      if(Array.isArray(ev.reasons) && ev.reasons.length){
        h+=`<ul class="mc-reason-list">${ev.reasons.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>`;
      }
      const files=ev.touched_files||[];
      if(files.length){
        h+=`<div class="mc-label">补丁改动文件</div><div class="mc-files">${files.map(f=>`<span class="mc-file">${esc(f)}</span>`).join('')}</div>`;
      }
      const fns=ev.touched_functions||[];
      if(fns.length){
        h+=`<div class="mc-label">补丁修改函数</div><div class="mc-fns">${fns.map(f=>`<span class="mc-fn">${esc(f)}()</span>`).join('')}</div>`;
      }
      if(ev.commit_message){
        h+=`<div class="mc-label">commit message</div><div class="mc-quote">${esc(ev.commit_message)}</div>`;
      }
      h+=`</div></details>`;
    }
  }
  if(url){
    h+=`<a class="mc-orig-link" href="${esc(url)}" target="_blank" rel="noopener">查看原文 ↗</a>`;
  }
  h+='</div>';
  return h;
}

function matchGroupHtml(dotCls, title, count, desc, tag, cardsHtml, collapsedId, startCollapsed){
  let h=`<div class="match-group">`;
  h+=`<div class="mg-head"><span class="mg-dot ${dotCls}"></span>${esc(title)}<span class="mg-count">${count} 条</span>`;
  if(tag) h+=`<span class="mg-tag">${esc(tag)}</span>`;
  h+=`</div>`;
  if(desc) h+=`<p class="mg-desc">${esc(desc)}</p>`;
  if(cardsHtml){
    h+=`<div class="match-cases${startCollapsed?' collapsed':''}" id="${collapsedId}">${cardsHtml}</div>`;
  } else {
    h+=`<div class="match-empty">无匹配</div>`;
  }
  h+=`</div>`;
  return h;
}

function renderCrashMatch(report){
  const cf=report.crash_feature_info||{};
  const g=orderedKBGroups(report);
  const inr=g.internal, com=g.community, onl=g.online;

  // 崩溃特征（RIP/签名/关联模块等）统一在"崩溃详情"章节展示，此处不再重复
  let h='<div class="match-section">';
  const total=inr.length+com.length+onl.length;
  if(!total){
    h+=`<div class="sec-label">知识库案例匹配 (0 条)</div><div class="match-empty">本地知识库、社区案例库与在线检索均无匹配案例</div>`;
    h+='</div>';
    document.getElementById('crash-match-body').innerHTML=h;
    return;
  }
  h+=`<div class="sec-label">知识库案例匹配 (${total} 条) · 本地未达高置信时自动在线爬取</div>`;

  // L1/L2/L3 层级说明（有本地案例时展示）
  if(inr.length || com.length){
    h+=`<div class="match-level-legend">`+
      `<span style="font-weight:600;color:#334155;">匹配层级说明：</span>`+
      `<span class="leg"><span class="leg-dot L1">L1</span>${_LEVEL_DESC.L1}</span>`+
      `<span class="leg"><span class="leg-dot L2">L2</span>${_LEVEL_DESC.L2}</span>`+
      `<span class="leg"><span class="leg-dot L3">L3</span>${_LEVEL_DESC.L3}</span>`+
      `</div>`;
  }

  // 组 1：内部知识库
  if(inr.length){
    const cards=inr.map(({c,idx})=>localCaseCard(c,'内部知识库',cf,idx)).join('');
    h+=matchGroupHtml('internal','内部知识库',inr.length,'本地已知问题库（OSClinic 入库的历史确诊案例），含指纹与 RAG 评分','',cards,'match-cases-internal',inr.length>1);
    if(inr.length>1){
      h+=`<div class="match-expand"><button onclick="toggleGroupCases('match-cases-internal',this)">展开全部 ${inr.length} 条</button></div>`;
    }
  }

  // 组 2：社区案例库
  if(com.length){
    const cards=com.map(({c,idx})=>localCaseCard(c,'社区案例库',cf,idx)).join('');
    h+=matchGroupHtml('community','社区案例库',com.length,'openEuler / Linux 社区案例库（本地入库存储），附上游一手 diff 校验结论','',cards,'match-cases-community',com.length>1);
    if(com.length>1){
      h+=`<div class="match-expand"><button onclick="toggleGroupCases('match-cases-community',this)">展开全部 ${com.length} 条</button></div>`;
    }
  }

  // 组 3：在线案例（实时爬取）
  if(onl.length){
    const cards=onl.map(({c,idx})=>onlineCaseCard(c,idx)).join('');
    h+=matchGroupHtml('online','在线社区案例',onl.length,'本地匹配不足时实时爬取的上游 kernel 仓库 commit/patch 与邮件列表讨论，均为公开社区一手资料','实时爬取',cards,'');
  }

  h+='</div>';
  document.getElementById('crash-match-body').innerHTML=h;
}

function toggleGroupCases(id, btn){
  const el=document.getElementById(id);
  if(!el) return;
  const collapsed=el.classList.toggle('collapsed');
  const total=el.querySelectorAll('.match-case').length;
  btn.textContent=collapsed?`展开全部 ${total} 条`:`收起 (仅显示首条)`;
}
// 兼容旧调用
function toggleMatchCases(){ toggleGroupCases('match-cases', document.getElementById('match-expand-btn')); }

// ===== Workflow Trace =====
function renderWorkflow(report){
  const wt=report.workflow_trace||{}, steps=wt.steps||[];
  const sourceBadge = wt.source==='opencode_export'
    ? `<span class="wf-badge export">Session Export</span>`
    : wt.source==='manual'
      ? `<span class="wf-badge manual">LLM Summarized</span>`
      : '';
  const dur = wt.total_duration_ms!=null ? `${(wt.total_duration_ms/1000).toFixed(1)}s` : '';
  const sid = wt.session_id ? wt.session_id.slice(0,20)+'...' : '';
  let h=`<div class="wf-header">`;
  if(sourceBadge) h+=sourceBadge;
  h+=`<span>${esc(wt.step_count??steps.length)} 个关键决策</span>`;
  if(sid) h+=`<span style="font-family:monospace;font-size:10px;opacity:.7">${esc(sid)}</span>`;
  if(dur) h+=`<span class="wf-duration">总耗时 ${dur}</span>`;
  h+=`</div>`;
  if(!steps.length){h+=`<div class="empty-line">无工作流记录</div>`;}
  steps.forEach(s=>{
    const isFail = s.status==='failed', isPartial = s.status==='partial', isSkip = s.status==='skipped';
    const dotCls = isFail?'fail':(isPartial?'partial':'');
    const stageLabel = (s.stage||'').replace(/_/g,' ');
    let toolsHtml = '';
    (s.tools||[]).forEach(t=>{
      const tOk = t.status==='success' || t.status==='completed';
      const tWarn = t.status==='timeout' || t.status==='partial';
      const tErr = t.status==='failed' || t.status==='error';
      const tIcon = tOk ? '<span class="wf-tool-icon ok">OK</span>'
        : tWarn ? '<span class="wf-tool-icon warn">TIMEOUT</span>'
        : tErr ? '<span class="wf-tool-icon err">ERR</span>'
        : '<span class="wf-tool-icon">•</span>';
      let durTxt = '';
      if(t.duration_ms!=null){
        durTxt = t.duration_ms<1000 ? t.duration_ms+'ms' : (t.duration_ms/1000).toFixed(1)+'s';
      }
      const title = t.title||'';
      toolsHtml += `<div class="wf-tool">${tIcon}<span class="wf-tool-title" title="${esc(t.tool_name+': '+title)}">${esc(t.tool_name)}${title?': '+esc(title):''}</span>${durTxt?`<span class="wf-tool-meta">${durTxt}</span>`:''}</div>`;
    });
    const statusText = s.status==='success'?'成功':s.status==='failed'?'失败':s.status==='partial'?'部分成功':s.status==='skipped'?'跳过':s.status||'';
    h+=`<div class="wf-step">`+
      `<div class="wf-dot-col"><div class="wf-dot ${dotCls}">${s.step}</div></div>`+
      `<div class="wf-card-col"><div class="wf-card">`+
        `<div class="wf-card-head"><span class="wf-stage ${esc(s.stage||'')}">${esc(stageLabel)}</span>`+
          `<span class="wf-step-status ${esc(s.status||'success')}">${esc(statusText)}</span></div>`+
        `<div class="wf-decision">${esc(s.decision||'')}</div>`+
        (s.observations?`<div class="wf-observations">${esc(s.observations)}</div>`:'')+
        (s.judgment?`<div class="wf-judgment">${esc(s.judgment)}</div>`:'')+
        (s.reason?`<div class="wf-reason">${esc(s.reason)}</div>`:'')+
        (toolsHtml?`<div class="wf-tools">${toolsHtml}</div>`:'')+
        `<div class="wf-time">${esc(s.start_time||'')} ${esc(s.end_time||'')}</div>`+
      `</div></div></div>`;
  });
  document.getElementById('workflow-body').innerHTML=h;
}

// ===== Section numbering =====
function renumberSections(hasEventTimeline){
  // 1 执行摘要 → (2 事件时序图 可选) → 崩溃详情 → 崩溃路径分析 → 根因分析
  let num=2;
  if(hasEventTimeline){
    document.getElementById('event-timeline-section').querySelector('.num').textContent='2';
    num=3;
  }
  document.getElementById('crash-detail-num').textContent=String(num); num++;
  document.getElementById('crash-path-num').textContent=String(num); num++;
  document.getElementById('rootcause-num').textContent=String(num);
}

// ===== Main =====
const loadFull = EMBED_FULL ? Promise.resolve(EMBED_FULL) : fetchJSON(FULL_URL);
loadFull.then(report=>{
  const ra=report.root_cause_analysis||{};
  const hasEventTimeline=(ra.event_chain||[]).length>0;

  buildKBRefMap(report);

  renderHeader(report);
  renderExecSummary(report);
  renderEventTimeline(report);
  renderCrashDetail(report);
  renderCrashPath(report);
  renderRootCause(report);
  renderCrashMatch(report);
  renderWorkflow(report);
  renumberSections(hasEventTimeline);

  // Footer
  const cf=report.crash_feature_info||{};
  const hb=report.host_base_info||{};
  document.getElementById('footer-text').innerHTML=
    `本报告基于崩溃数据分析生成 · ${cf.crash_time||''} · 内核 ${hb.kernel_version||''}`;
}).catch(err=>{
  const msg = err.message||'';
  const isFileProtocol = location.protocol==='file:' && msg.includes('fetch');
  let hint = '';
  if(isFileProtocol){
    hint = '<br><br>提示：需要通过 HTTP 服务访问（如 <code>python3 -m http.server</code>），不能直接 file:// 打开。';
  }
  document.getElementById('app').innerHTML=`<div class="error">加载失败: ${esc(msg)}${hint}</div>`;
});
</script>
