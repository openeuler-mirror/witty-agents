<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内核崩溃综合分析报告</title>
<style>

  :root {
    --primary: #1a56db;
    --primary-dark: #1e429f;
    --danger: #e02424;
    --warning: #ff8a00;
    --success: #057a55;
    --bg: #f5f7fa;
    --card: #ffffff;
    --border: #e5e7eb;
    --text: #1f2937;
    --text-muted: #6b7280;
    --mono-bg: #f3f4f6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 1100px; margin: 0 auto; padding: 32px 24px 64px; }

  /* ===== Header ===== */
  .report-header {
    background: linear-gradient(135deg, #1e3a8a 0%, #1a56db 100%);
    color: #fff;
    border-radius: 12px;
    padding: 40px 40px 32px;
    margin-bottom: 28px;
    box-shadow: 0 4px 20px rgba(30, 58, 138, .25);
  }
  .report-header .tag {
    display: inline-block; background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.35);
    padding: 3px 12px; border-radius: 999px;
    font-size: 12.5px; letter-spacing: .5px; margin-bottom: 14px;
  }
  .report-header h1 { font-size: 27px; font-weight: 700; margin-bottom: 10px; }
  .report-header .subtitle { font-size: 14.5px; opacity: .9; margin-bottom: 22px; }
  .meta-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px; font-size: 13px;
  }
  .meta-item {
    background: rgba(255,255,255,.12); border-radius: 8px; padding: 10px 14px;
  }
  .meta-item .k { opacity: .75; font-size: 12px; margin-bottom: 2px; }
  .meta-item .v { font-weight: 600; }

  /* ===== Sections ===== */
  section {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 28px 32px; margin-bottom: 24px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  h2 {
    font-size: 20px; color: var(--primary-dark);
    padding-bottom: 12px; margin-bottom: 18px;
    border-bottom: 2px solid #e8eefb;
    display: flex; align-items: center; gap: 10px;
  }
  h2 .num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border-radius: 8px;
    background: var(--primary); color: #fff; font-size: 14px; flex-shrink: 0;
  }
  h3 { font-size: 16.5px; color: var(--text); margin: 20px 0 10px; }
  h4 { font-size: 15px; color: var(--text); margin: 14px 0 8px; }
  p { margin-bottom: 10px; }
  ul, ol { margin: 8px 0 12px 22px; }
  li { margin-bottom: 5px; }
  strong { color: var(--text); }
  code {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    background: var(--mono-bg); padding: 1.5px 6px; border-radius: 4px;
    font-size: 13px; color: #c7254e;
  }
  pre {
    background: #1e293b; color: #e2e8f0;
    border-radius: 8px; padding: 16px 18px;
    overflow-x: auto; font-size: 12.8px; line-height: 1.55;
    margin: 12px 0;
  }
  pre code { background: transparent; color: inherit; padding: 0; font-size: inherit; }
  .mono { font-family: Consolas, monospace; font-size: 13px; }

  /* ===== Badges & callouts ===== */
  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600;
  }
  .badge-danger { background: #fde8e8; color: var(--danger); }
  .badge-warning { background: #fef3e8; color: #c25700; }
  .badge-success { background: #e8f7f0; color: var(--success); }
  .badge-info    { background: #e8eefb; color: var(--primary-dark); }
  .badge-gray    { background: #f3f4f6; color: var(--text-muted); }
  .badge-blue    { background: #e8eefb; color: var(--primary); }
  .badge-green   { background: #e8f7f0; color: var(--success); }
  .callout {
    border-radius: 8px; padding: 14px 18px; margin: 14px 0;
    font-size: 14px; border-left: 4px solid;
  }
  .callout-danger  { background: #fdf2f2; border-color: var(--danger); }
  .callout-warning { background: #fffaf0; border-color: var(--warning); }
  .callout-success { background: #f0fdf6; border-color: var(--success); }
  .callout-info    { background: #eff6ff; border-color: var(--primary); }
  .callout .title { font-weight: 700; margin-bottom: 4px; }

  /* ===== Tables ===== */
  table {
    width: 100%; border-collapse: collapse; margin: 14px 0;
    font-size: 13.8px;
  }
  th, td { padding: 10px 12px; text-align: left; border: 1px solid var(--border); }
  th {
    background: #f8fafc; font-weight: 700; color: var(--text);
    white-space: nowrap;
  }
  tr:nth-child(even) td { background: #fafbfc; }
  td.mono, th.mono { font-family: Consolas, monospace; font-size: 12.8px; }
  .center { text-align: center; }
  .nowrap { white-space: nowrap; }

  /* ===== Sequence diagram (事件时序，UML SVG) ===== */
  .seq-wrap { overflow-x: auto; margin: 14px 0 4px; }
  .seq-svg { display: block; min-width: 720px; }
  .seq-legend { display: flex; gap: 18px; flex-wrap: wrap; margin: 10px 0 2px; font-size: 12px; color: var(--text-muted); }
  .seq-legend .lg { display: inline-flex; align-items: center; gap: 6px; }
  .seq-legend .sw { width: 24px; height: 0; border-top: 2px solid #94a3b8; display: inline-block; }
  .seq-legend .sw.dashed { border-top: 2px dashed #cbd5e1; }
  .seq-legend .dbox { width: 12px; height: 12px; border-radius: 3px; background: #64748b; display: inline-block; }
  .seq-legend .dbox.red { background: var(--danger); }

  /* ===== Propagation chain (崩溃扩散链，纵向链条) ===== */
  .pchain { margin: 16px 0 4px; }
  .pc-node { display: flex; gap: 14px; }
  .pc-rail { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; width: 34px; }
  .pc-dot {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    background: var(--primary); color: #fff; font-weight: 700; font-size: 13px;
    display: flex; align-items: center; justify-content: center; margin-top: 5px;
    box-shadow: 0 0 0 4px #e8eefb; z-index: 1;
  }
  .pc-line { width: 2px; flex: 1; background: #cbd5e1; min-height: 30px; position: relative; margin: 2px 0; }
  .pc-line::after {
    content: ""; position: absolute; bottom: -1px; left: 50%; transform: translateX(-50%);
    border: 5px solid transparent; border-top-color: #cbd5e1;
  }
  .pc-node:last-child .pc-line { display: none; }
  .pc-node.is-crash .pc-dot { background: var(--danger); box-shadow: 0 0 0 4px #fde8e8; }
  .pc-card {
    flex: 1; min-width: 0; background: #fff; border: 1px solid var(--border);
    border-radius: 10px; padding: 13px 18px 15px; margin-bottom: 14px;
  }
  .pc-node.is-crash .pc-card { border-color: #f3b4b4; background: #fdf5f5; }
  .pc-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .pc-funcs { font-size: 14px; }
  .pc-funcs .fn { font-family: Consolas, "Liberation Mono", monospace; font-weight: 700; color: var(--text); }
  .pc-funcs .arr { color: var(--text-muted); margin: 0 8px; font-weight: 700; }
  .pc-type { font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 10px; }
  .pc-type.call { background: #e8eefb; color: var(--primary); }
  .pc-type.uaf_free { background: #fde8e8; color: var(--danger); }
  .pc-type.data_pollution { background: #fef3e8; color: #c25700; }
  .pc-type.null_deref { background: #fde8e8; color: var(--danger); }
  .pc-crash-tag { font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 10px; background: var(--danger); color: #fff; }
  .pc-src { margin-top: 6px; font-family: Consolas, "Liberation Mono", monospace; font-size: 12px; color: #94a3b8; }
  .pc-src .path { color: #475569; }
  a.path { color: var(--primary); text-decoration: none; border-bottom: 1px dotted var(--primary); }
  a.path:hover { color: var(--primary-dark); border-bottom-style: solid; }
  .pc-src-link {
    color: var(--primary); font-weight: 600; text-decoration: none; margin-left: 8px;
    border-bottom: 1px dotted var(--primary);
  }
  .pc-src-link:hover { color: var(--primary-dark); border-bottom-style: solid; }
  /* 源码片段展开窗口（未展开时为扁平小标签条；重置全局 details 卡片样式） */
  .pc-snippet {
    margin-top: 6px; margin-bottom: 0; background: transparent;
    border: none; border-radius: 0; box-shadow: none; overflow: visible;
  }
  .pc-snippet > summary {
    cursor: pointer; font-size: 12px; font-weight: 600; color: var(--primary-dark);
    list-style: none; user-select: none; display: inline-block;
    padding: 0 9px; height: 22px; line-height: 22px;
    background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 11px;
  }
  .pc-snippet > summary::before { content: "▸ "; }
  .pc-snippet[open] > summary {
    background: transparent; border-color: transparent; padding: 0; height: auto;
    border-radius: 0; margin-bottom: 2px;
  }
  .pc-snippet[open] > summary::before { content: "▾ "; }
  .pc-snippet > summary:hover { background: #e8eefb; border-color: #cdddf5; }
  .pc-snippet pre {
    margin: 8px 0 0; background: #0f172a; color: #e2e8f0; border-radius: 8px;
    padding: 12px 14px; overflow-x: auto;
  }
  .pc-snippet pre code {
    font-family: Consolas, "Liberation Mono", monospace; font-size: 12.5px;
    line-height: 1.7; white-space: pre; background: none; color: inherit;
  }
  .pc-detail { margin-top: 8px; font-size: 13.5px; line-height: 1.75; color: var(--text); }
  .pc-evidence {
    margin-top: 9px; font-size: 12.5px; color: var(--text-muted);
    background: var(--mono-bg); border-left: 3px solid #cbd5e1;
    padding: 7px 11px; border-radius: 0 6px 6px 0;
    font-family: Consolas, "Liberation Mono", monospace; white-space: pre-wrap; word-break: break-word;
  }

  /* 崩溃路径分析：导语 / 关键观察 / 原始栈折叠 */
  .path-intro {
    margin: 4px 0 16px; padding: 12px 16px; font-size: 13.5px; line-height: 1.8;
    color: #475569; font-style: italic; background: #f8fafc;
    border-left: 3px solid #cbd5e1; border-radius: 0 8px 8px 0;
  }
  .path-obs-card {
    margin: 18px 0 4px; border: 1px solid var(--border); border-radius: 10px;
    background: #f8fafc; padding: 15px 18px 13px;
  }
  .path-obs-title { font-size: 14px; font-weight: 700; color: var(--primary-dark); margin-bottom: 10px; }
  .path-obs { margin: 0; padding: 0; list-style: none; }
  .path-obs li {
    position: relative; font-size: 13.5px; line-height: 1.8; color: var(--text);
    margin-bottom: 8px; padding-left: 18px;
  }
  .path-obs li:last-child { margin-bottom: 0; }
  .path-obs li::before {
    content: ""; position: absolute; left: 3px; top: 10px;
    width: 7px; height: 7px; border-radius: 50%; background: var(--primary);
  }
  .raw-stack { margin-top: 14px; border: 1px solid var(--border); border-radius: 8px; background: #fcfcfd; }
  .raw-stack summary {
    cursor: pointer; padding: 9px 14px; font-size: 13px; font-weight: 600; color: var(--primary-dark);
    user-select: none;
  }
  .raw-stack pre { margin: 0; border-radius: 0 0 8px 8px; max-height: 420px; overflow: auto; }

  /* ===== Flow ===== */
  .flow {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    background: #f8fafc; border: 1px solid var(--border);
    border-radius: 8px; padding: 14px 16px; margin: 12px 0;
    font-family: Consolas, monospace; font-size: 12.5px;
  }
  .flow .box { background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; padding: 6px 10px; }
  .flow .box.hot { border-color: var(--danger); background: #fdf2f2; }
  .flow .arr { color: var(--text-muted); }

  /* ===== Commit cards ===== */
  .commit-card {
    border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 20px; margin-bottom: 14px; background: #fcfcfd;
  }
  .commit-card .sha {
    font-family: Consolas, monospace; font-size: 12.5px;
    background: #eef2ff; color: #3730a3; padding: 2px 8px;
    border-radius: 4px; word-break: break-all;
  }
  .commit-card .subject { font-weight: 700; font-size: 15px; margin: 8px 0 6px; }
  .commit-card .meta { font-size: 13px; color: var(--text-muted); }

  /* ===== Root cause analysis steps ===== */
  .rc-grid { display:flex; flex-direction:column; gap:12px; }
  .rc-conclusion { font-size:15px; line-height:1.85; color:#1e293b; word-break:break-word; font-weight:500; }

  .rc-chain-wrap { border:none; box-shadow:none; margin:0; background:transparent; }
  .rc-chain-wrap summary { padding:10px 4px 6px; font-size:13px; color:var(--accent); font-weight:600; cursor:pointer; user-select:none; list-style:none; display:flex; align-items:center; gap:8px; border-radius:6px; }
  .rc-chain-wrap summary::-webkit-details-marker { display:none; }
  .rc-chain-wrap summary::before { content:"▸"; color:var(--primary); font-size:11px; display:inline-block; transition:transform .15s; }
  .rc-chain-wrap[open] summary::before { transform:rotate(90deg); }
  .rc-chain-wrap summary:hover { background:#f1f5f9; }
  .rc-chain-wrap .rc-chain-body { padding:8px 0 4px; }
  .rc-chain-count { background:#e0f2fe; color:#0369a1; font-size:11px; font-weight:600; padding:1px 8px; border-radius:10px; }
  .rc-chain { position:relative; }
  .rc-step { display:flex; gap:14px; padding:0 0 14px; position:relative; }
  .rc-step:last-child { padding-bottom:0; }
  .rc-step-dot { flex-shrink:0; width:24px; display:flex; justify-content:center; padding-top:2px; position:relative; }
  .rc-step-dot-inner { width:22px; height:22px; border-radius:50%; background:var(--primary); color:#fff; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; z-index:1; box-shadow:0 0 0 3px #fff; flex-shrink:0; }
  .rc-step-dot::after { content:''; position:absolute; top:24px; bottom:-14px; left:50%; width:2px; background:#e2e8f0; transform:translateX(-50%); z-index:0; }
  .rc-step:last-child .rc-step-dot::after { display:none; }
  .rc-step-card { flex:1; min-width:0; background:#fff; border:1px solid var(--border); border-radius:8px; padding:12px 16px; }
  .rc-step-card.is-final { background:#f0fdf6; border:1px solid #6ee7b7; border-left-width:3px; }
  .rc-final-badge { display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.5px; color:#047857; background:#d1fae5; border:1px solid #6ee7b7; border-radius:10px; padding:1px 8px; margin-bottom:6px; }
  .rc-step.is-final .rc-step-fact { color:#065f46; }
  .kb-ref { color:#2563eb; text-decoration:underline; cursor:pointer; }
  .kb-ref:hover { color:#1d4ed8; text-decoration:none; }
  .rc-step-dot-inner { transition:background .15s; }
  .rc-step-fact { font-size:13.5px; font-weight:600; color:#1e293b; margin-bottom:6px; line-height:1.6; }
  .rc-step-evidence { background:#f1f5f9; border-left:3px solid #94a3b8; font-family:"SFMono-Regular",Consolas,monospace; font-size:12px; line-height:1.7; padding:9px 12px; border-radius:0 6px 6px 0; margin:2px 0 8px; white-space:pre; overflow-x:auto; color:#334155; }
  .rc-step-detail { font-size:13px; line-height:1.8; color:#475569; white-space:pre-wrap; word-break:break-word; }
  .rc-stage-label { padding:4px 0 10px 38px; }
  .rc-stage-tag { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; padding:2px 10px; border-radius:11px; border:1px solid; }

  /* ===== Anomaly features ===== */
  .anomaly-grid { display:flex; flex-direction:column; gap:14px; }
  .anomaly-item { padding:10px 14px; background:var(--mono-bg); border:1px solid var(--border); border-radius:8px; }
  .anomaly-label { font-size:11px; color:var(--text-muted); font-weight:600; display:block; margin-bottom:8px; }
  .anomaly-list { display:flex; flex-direction:column; gap:5px; }
  .anomaly-row { font-size:12px; font-family:monospace; padding:6px 10px; background:#fff; border:1px solid var(--border); border-radius:6px; color:var(--text); }
  .anomaly-code { max-height:180px; font-size:11.5px; white-space:pre-wrap; word-break:break-all; margin:0; padding:10px 12px; }
  .chip-warn { background:#fef3c7; color:#92400e; border-color:#fcd34d; }

  /* ===== Modules chips ===== */
  .modules-chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-size:11px; background:var(--mono-bg); border:1px solid var(--border); border-radius:6px; padding:3px 8px; font-family:monospace; }
  .kv-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; }
  .kv { display:flex; flex-direction:column; gap:3px; padding:8px 12px; background:var(--mono-bg); border-radius:8px; border:1px solid var(--border); }
  .kv .k { color:var(--text-muted); font-size:11px; }
  .kv .v { color:var(--text); font-weight:600; word-break:break-all; }

  /* ===== Match cases ===== */
  .match-section { margin-bottom:22px; }
  .match-section:last-child { margin-bottom:0; }
  .match-cases { display:flex; flex-direction:column; gap:12px; }
  .match-cases.collapsed .match-case:not(:first-child) { display:none; }

  /* 三类案例分组 */
  .match-group { margin-bottom:18px; }
  .match-group:last-child { margin-bottom:0; }
  .mg-head {
    display:flex; align-items:center; gap:9px; font-size:14.5px; font-weight:700;
    color:var(--text); margin-bottom:3px;
  }
  .mg-dot { width:10px; height:10px; border-radius:3px; flex-shrink:0; }
  .mg-dot.internal { background:#2563eb; }
  .mg-dot.community { background:#059669; }
  .mg-dot.online { background:#d97706; }
  .mg-count {
    font-size:11px; font-weight:700; padding:1px 9px; border-radius:10px;
    background:#eef2f7; color:#64748b;
  }
  .mg-tag {
    font-size:10.5px; font-weight:600; padding:1px 8px; border-radius:4px;
    background:#fef3e8; color:#b45309; border:1px solid #f5d9b0;
  }
  .mg-desc { font-size:12.5px; color:var(--text-muted); line-height:1.6; margin:0 0 10px 19px; }
  .match-group + .match-group { border-top:1px dashed var(--border); padding-top:16px; }
  .match-case {
    width:100%; flex:0 0 auto; min-width:0;
    background:var(--mono-bg); border:1px solid var(--border);
    border-radius:10px; padding:14px 16px; position:relative; overflow:hidden;
  }
  .match-case .mc-score {
    display:inline-block; font-size:11px; font-weight:700; padding:2px 10px; border-radius:10px;
    margin-bottom:8px;
  }
  .match-case .mc-score.high { background:#dcfce7; color:#166534; }
  .match-case .mc-score.mid { background:#fef3c7; color:#92400e; }
  .match-case .mc-score.low { background:#f1f5f9; color:#64748b; }
  .match-case .mc-level {
    display:inline-block; font-size:10px; font-weight:800; padding:2px 8px; border-radius:10px;
    margin-bottom:8px; margin-left:6px; letter-spacing:.5px;
  }
  .match-case .mc-level.L1 { background:#dcfce7; color:#15803d; border:1px solid #86efac; }
  .match-case .mc-level.L2 { background:#dbeafe; color:#1d4ed8; border:1px solid #93c5fd; }
  .match-case .mc-level.L3 { background:#fef3c7; color:#b45309; border:1px solid #fcd34d; }
  /* L3 弱匹配兜底：未获一手证据确认时，强制警示样式，不携带"高匹配" */
  .match-case.l3-weak { border-color:#fcd34d; background:#fffdf5; }
  .match-case .mc-score.weak { background:#fef3c7; color:#b45309; border:1px dashed #f59e0b; }
  .match-case .mc-level.L3.weak { background:#fff7ed; color:#c2410c; border:1px solid #fb923c; }
  .mc-l3-note {
    background:#fffbeb; border:1px solid #fde68a; border-left:3px solid #f59e0b;
    border-radius:0 6px 6px 0; padding:7px 11px; font-size:12px; line-height:1.7;
    color:#92400e; margin-bottom:10px;
  }
  .match-case .mc-verdict {
    display:inline-block; font-size:11px; font-weight:700; padding:2px 9px; border-radius:10px;
    margin-bottom:8px; margin-left:6px;
  }
  .match-case .mc-verdict.confirmed { background:#dcfce7; color:#15803d; border:1px solid #86efac; }
  .match-case .mc-verdict.same_area { background:#fef3c7; color:#b45309; border:1px solid #fcd34d; }
  .match-case .mc-verdict.not_relevant { background:#f1f5f9; color:#94a3b8; border:1px solid #e2e8f0; }
  .match-case .mc-verdict.unverified { background:#fff; color:#94a3b8; border:1px dashed #cbd5e1; }
  .match-case.excluded { opacity:.6; }
  .mc-evidence { margin-top:10px; border:1px solid var(--border); border-radius:8px; background:var(--mono-bg); }
  .mc-evidence summary {
    cursor:pointer; padding:7px 10px; font-size:11px; font-weight:600; color:var(--text-muted);
    list-style:none; user-select:none;
  }

  .mc-evidence summary::before { content:"▸ "; color:var(--primary); }

  .mc-evidence .mc-ev-body { padding:0 10px 10px; }
  .mc-evidence .mc-quote {
    font-size:12px; color:var(--text); background:#fff; border-left:3px solid var(--primary);
    padding:6px 10px; margin:4px 0 6px; white-space:pre-wrap; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;

  }
  .mc-evidence .mc-files { display:flex; flex-wrap:wrap; gap:4px; margin:4px 0; }
  .mc-evidence .mc-file { font-size:10px; font-family:ui-monospace,Menlo,monospace; background:#eef2ff; color:#4338ca; border-radius:5px; padding:2px 7px; }
  .mc-evidence .mc-fns { display:flex; flex-wrap:wrap; gap:4px; margin:4px 0; }
  .mc-evidence .mc-fn { font-size:10px; font-family:ui-monospace,Menlo,monospace; background:#dcfce7; color:#15803d; border:1px solid #86efac; border-radius:5px; padding:2px 7px; }
  .match-level-legend {
    display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px; padding:8px 12px;
    background:#f8fafc; border-radius:8px; font-size:11px; color:#64748b; line-height:1.5;
  }
  .match-level-legend .leg { display:flex; align-items:center; gap:4px; }
  .match-level-legend .leg-dot {
    display:inline-block; width:16px; height:16px; border-radius:50%; font-size:8px; font-weight:800;
    text-align:center; line-height:16px; color:#fff; flex-shrink:0;
  }
  .match-level-legend .leg-dot.L1 { background:#15803d; }
  .match-level-legend .leg-dot.L2 { background:#1d4ed8; }
  .match-level-legend .leg-dot.L3 { background:#b45309; }
  .match-case .mc-reason-list { margin:4px 0 0; padding:0; list-style:none; }
  .match-case .mc-reason-list li {
    font-size:12px; line-height:1.6; color:#475569; padding:3px 0 3px 16px; position:relative;
    overflow-wrap:break-word; word-break:break-word;
  }
  .match-case .mc-reason-list li::before {
    content:"✓"; position:absolute; left:0; top:3px; color:#22c55e; font-weight:700; font-size:11px;
  }
  .match-case .mc-reason-list li.miss::before { content:"✗"; color:#ef4444; }
  .match-case .mc-reason-list li.warn::before { content:"!"; color:#f59e0b; }
  .match-case .mc-id { font-size:11px; color:var(--text-muted); margin-bottom:4px; font-family:monospace; overflow-wrap:break-word; word-break:break-all; }
  .match-case .mc-label { font-size:11px; color:var(--text-muted); font-weight:600; margin:8px 0 4px; }
  .match-case .mc-text { font-size:13px; color:var(--text); line-height:1.6; overflow-wrap:break-word; word-break:break-word; }
  .match-case .mc-chips { display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }
  .match-case .mc-chip { font-size:10px; background:var(--primary); color:#1e40af; border-radius:5px; padding:2px 7px; font-family:monospace; font-weight:500; background:#e8eefb; }
  .match-expand { text-align:center; margin-top:10px; }
  .match-expand button {
    padding:6px 16px; border-radius:8px; border:1px dashed #94a3b8; background:transparent;
    color:#64748b; font-size:12px; cursor:pointer; font-family:inherit;
  }
  .match-expand button:hover { background:#f1f5f9; color:#475569; }
  .match-empty { color:var(--text-muted); font-style:italic; font-size:13px; }

  /* 在线案例 */
  .match-case.online { border-color:#f0d9b0; background:#fffdf8; }
  .mc-kind {
    display:inline-block; font-size:11px; font-weight:700; padding:2px 10px;
    border-radius:10px; margin:0 6px 8px 0;
  }
  .mc-kind.commit, .mc-kind.issue { background:#e8eefb; color:#2563eb; }
  .mc-kind.mail { background:#fef3e8; color:#b45309; }
  .mc-online-title { font-size:14px; font-weight:700; line-height:1.6; color:var(--text); margin:2px 0 6px; word-break:break-word; }
  .mc-online-title a { color:inherit; text-decoration:none; border-bottom:1px solid #cbd5e1; }
  .mc-online-title a:hover { color:var(--primary-dark); border-bottom-color:var(--primary-dark); }
  .mc-mail-meta { font-size:12px; color:var(--text-muted); margin-bottom:8px; }
  .mc-mail-meta .ml-list { font-family:Consolas, monospace; }

  /* 邮件：讨论主线（角色化交流链） */
  .mail-thread { margin:4px 0 2px; }
  .mail-turn { display:flex; align-items:flex-start; gap:10px; position:relative; padding-bottom:12px; }
  .mail-turn:not(:last-child)::before {
    content:""; position:absolute; left:37px; top:20px; bottom:0; width:2px; background:#e2e8f0;
  }
  .mail-turn .mt-role {
    flex-shrink:0; width:76px; text-align:center; font-size:11px; font-weight:700;
    padding:2px 0; border-radius:4px; margin-top:1px; position:relative; z-index:1;
  }
  .mt-role.reporter { background:#e8eefb; color:#2563eb; }
  .mt-role.maintainer { background:#e6f7f0; color:#057a55; }
  .mt-role.reviewer { background:#fef3e8; color:#c25700; }
  .mt-role.stable_maintainer { background:#f0ecfc; color:#6d28d9; }
  .mt-role.community { background:#eef2f7; color:#64748b; }
  .mail-turn .mt-text { flex:1; min-width:0; font-size:13px; line-height:1.7; color:var(--text); padding-top:2px; }

  /* 邮件：分析思路链 */
  .mail-reasoning { list-style:none; margin:2px 0 4px; padding:0; counter-reset:mr; }
  .mail-reasoning li {
    position:relative; padding:5px 0 5px 30px; font-size:13px; line-height:1.7;
    color:var(--text); counter-increment:mr;
  }
  .mail-reasoning li::before {
    content:counter(mr); position:absolute; left:0; top:7px;
    width:19px; height:19px; border-radius:50%; background:#fef3e8; color:#b45309;
    font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center;
  }

  /* 邮件：对本次分析的指导 */
  .mail-guidance {
    background:#f8fafc; border-left:3px solid #0d9488; border-radius:0 6px 6px 0;
    padding:9px 13px; font-size:13px; line-height:1.8; color:#1f2937; margin:4px 0 2px;
  }
  .mail-guidance b { color:#0d9488; }
  .mc-relevance {
    background:#f8fafc; border-left:3px solid #d97706; border-radius:0 6px 6px 0;
    padding:8px 12px; font-size:13px; line-height:1.75; color:#334155; margin-top:6px;
  }
  .mc-relevance b { color:#b45309; }
  .mc-orig-link { display:inline-block; margin-top:8px; font-size:12px; font-weight:600; color:var(--primary-dark); }
  .mc-orig-link:hover { text-decoration:underline; }

  /* 多维匹配论证 */
  .corrob { margin-top:4px; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .corrob-item {
    display:flex; align-items:flex-start; gap:10px; padding:8px 12px;
    background:#fff; border-bottom:1px solid #eef1f5;
  }
  .corrob-item:last-child { border-bottom:none; }
  .corrob-item.mismatch { background:#fdf5f5; }
  .corrob-dim {
    flex-shrink:0; width:64px; text-align:center; font-size:11px; font-weight:700;
    padding:2px 0; border-radius:4px; margin-top:1px;
  }
  .corrob-body { flex:1; min-width:0; font-size:13px; line-height:1.7; color:var(--text); }
  .corrob-state { font-weight:700; margin-right:6px; white-space:nowrap; }
  .corrob-item.support .corrob-state { color:#059669; }
  .corrob-item.partial .corrob-state { color:#c25700; }
  .corrob-item.mismatch .corrob-state { color:#dc2626; }
  .corrob-text { word-break:break-word; }

  /* 证据对照表（current vs reference 并列展示） */
  .corrob-table { width:100%; border-collapse:collapse; margin-top:4px; font-size:12.5px; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .corrob-table thead th { background:#f8fafc; color:#475569; font-weight:700; font-size:11px; text-align:left; padding:7px 10px; border-bottom:1px solid var(--border); white-space:nowrap; }
  .corrob-table tbody td { padding:8px 10px; border-bottom:1px solid #eef1f5; vertical-align:top; line-height:1.65; color:var(--text); word-break:break-word; }
  .corrob-table tbody tr:last-child td { border-bottom:none; }
  .corrob-table .ct-dim { width:70px; font-weight:600; color:#334155; }
  .corrob-table .ct-verdict { width:60px; white-space:nowrap; color:#475569; }
  .corrob-table .ct-cur { width:42%; border-right:1px solid #eef1f5; background:#fff; }
  .corrob-table .ct-ref { width:42%; background:#fbfcfe; }
  .corrob-table .ct-span { background:#fff; }
  .corrob-row.mismatch td { background:#fdf5f5; }
  .corrob-row.mismatch .ct-cur, .corrob-row.mismatch .ct-ref { background:transparent; }
  .corrob-row.support .corrob-state { color:#059669; }
  .corrob-row.partial .corrob-state { color:#c25700; }
  .corrob-row.mismatch .corrob-state { color:#dc2626; }

  /* 适用条件（采用前提） */
  .mc-applicability {
    background:#f0f9ff; border:1px solid #bae6fd; border-left:3px solid #0ea5e9;
    border-radius:0 6px 6px 0; padding:9px 12px; font-size:12.5px; line-height:1.7;
    color:#0c4a6e; margin-top:8px;
  }
  .mc-applicability b { color:#0369a1; }

  /* 分析阶段边界提示 */
  .rc-stage-hint { font-size:11px; color:var(--text-muted); margin-left:6px; font-weight:400; }

  /* ===== Workflow trace ===== */
  .wf-header { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px; font-size:12px; color:var(--text-muted); }
  .wf-badge { font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px; letter-spacing:.3px; }
  .wf-badge.export { background:#dbeafe; color:#1e40af; }
  .wf-badge.manual { background:#fef3c7; color:#92400e; }
  .wf-duration { font-variant-numeric:tabular-nums; }
  .wf-step { display:flex; gap:12px; margin-bottom:2px; position:relative; }
  .wf-step:not(:last-child)::after { content:""; position:absolute; left:11px; top:26px; bottom:-2px; width:2px; background:var(--border); }
  .wf-dot-col { flex:0 0 24px; display:flex; flex-direction:column; align-items:center; padding-top:4px; }
  .wf-dot { width:24px; height:24px; border-radius:50%; background:var(--primary); color:#fff; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; z-index:1; }
  .wf-dot.fail { background:#ef4444; }
  .wf-dot.partial { background:#f59e0b; }
  .wf-card-col { flex:1; min-width:0; padding-bottom:14px; }
  .wf-card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:10px 14px; }
  .wf-card-head { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
  .wf-stage { font-size:10px; font-weight:700; padding:2px 8px; border-radius:4px; letter-spacing:.3px; }
  .wf-stage.init { background:#f1f5f9; color:#475569; }
  .wf-stage.baseline_collection { background:#ecfdf5; color:#065f46; }
  .wf-stage.crash_feature_extraction { background:#fef3c7; color:#92400e; }
  .wf-stage.log_detection { background:#ede9fe; color:#5b21b6; }
  .wf-stage.knowledge_retrieval { background:#e0f2fe; color:#075985; }
  .wf-stage.online_retrieval { background:#cffafe; color:#155e75; }
  .wf-stage.deep_analysis { background:#fce7f3; color:#9d174d; }
  .wf-stage.root_cause_validation { background:#fee2e2; color:#991b1b; }
  .wf-stage.report_generation { background:#dbeafe; color:#1e40af; }
  .wf-step-status { font-size:10px; font-weight:600; padding:1px 7px; border-radius:8px; margin-left:auto; }
  .wf-step-status.success { background:#dcfce7; color:#166534; }
  .wf-step-status.failed { background:#fee2e2; color:#991b1b; }
  .wf-step-status.partial { background:#fef3c7; color:#92400e; }
  .wf-step-status.skipped { background:#f1f5f9; color:#64748b; }
  .wf-decision { font-size:13px; font-weight:600; line-height:1.6; margin-bottom:4px; }
  .wf-observations { font-size:12px; color:#475569; line-height:1.7; background:#f8fafc; border-left:3px solid #cbd5e1; padding:7px 10px; border-radius:0 6px 6px 0; margin:4px 0 6px; white-space:pre-wrap; word-break:break-word; }
  .wf-judgment { font-size:12px; color:#64748b; font-style:italic; line-height:1.6; margin:2px 0 6px; }
  .wf-reason { font-size:12px; color:#991b1b; background:#fef2f2; border-left:3px solid #fca5a5; padding:6px 10px; border-radius:0 6px 6px 0; margin:4px 0 6px; }
  .wf-tools { display:flex; flex-direction:column; gap:3px; margin-top:6px; }
  .wf-tool { font-size:11px; display:flex; align-items:center; gap:8px; padding:4px 8px; background:var(--bg); border:1px solid var(--border); border-radius:5px; color:var(--text-muted); line-height:1.4; }
  .wf-tool-icon { flex-shrink:0; font-size:12px; }
  .wf-tool-icon.ok { color:#16a34a; }
  .wf-tool-icon.err { color:#dc2626; }
  .wf-tool-icon.warn { color:#d97706; }
  .wf-tool-title { flex:1; font-family:"SFMono-Regular",Consolas,monospace; font-size:11px; color:#334155; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .wf-tool-meta { flex-shrink:0; font-size:10px; color:#94a3b8; font-variant-numeric:tabular-nums; }
  .wf-time { font-size:11px; color:#94a3b8; margin-top:5px; font-variant-numeric:tabular-nums; }

  /* ===== Collapsible details ===== */
  details { background:var(--card); border:1px solid var(--border); border-radius:12px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.04); overflow:hidden; }
  details summary { padding:16px 28px; cursor:pointer; font-weight:600; font-size:14px; user-select:none; list-style:none; display:flex; align-items:center; gap:9px; }
  details summary::-webkit-details-marker { display:none; }
  details summary::before { content:"▸"; color:var(--primary); font-size:12px; display:inline-block; }
  details[open] summary::before { transform:rotate(90deg); }
  details summary:hover { background:#f8fafc; }
  .detail-body { padding:0 28px 20px; }

  .empty-line { color:var(--text-muted); font-style:italic; }
  .error { color:var(--danger); padding:28px; text-align:center; }
  .sec-label { font-size:11px; color:var(--text-muted); margin:12px 0 6px; font-weight:700; letter-spacing:.4px; }
  .prose { white-space:pre-wrap; word-break:break-word; line-height:1.8; color:#334155; }

  .footer {
    text-align: center; color: var(--text-muted); font-size: 12.5px;
    margin-top: 36px; padding-top: 18px; border-top: 1px solid var(--border);
  }
  @media print {
    body { background: #fff; }
    section { box-shadow: none; break-inside: avoid; }
  }

/* ================= v2 追加样式 ================= */
/* —— 执行摘要 · 方案卡 —— */
.sol { border-radius:10px; padding:16px 20px; margin:14px 0; }
.sol-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
.sol-title { font-size:15.5px; font-weight:700; display:flex; align-items:center; gap:8px; }
.sol-type { font-size:10.5px; font-weight:700; padding:2px 9px; border-radius:999px; }
.sol-type.patch { background:#e0f2fe; color:#075985; border:1px solid #7dd3fc; }
.sol-type.config { background:#fef3c7; color:#92400e; border:1px solid #fcd34d; }
.sol-type.upgrade { background:#ede9fe; color:#5b21b6; border:1px solid #c4b5fd; }

.sol-lead { font-size:13.5px; line-height:1.8; color:#1e293b; }

.sol-block { margin-top:10px; }
.sol-block-t { font-size:12px; font-weight:700; color:var(--text-muted); margin:0 0 6px; letter-spacing:.3px; }
.basis-list { display:flex; flex-direction:column; gap:6px; }
.basis-item { display:flex; gap:9px; align-items:flex-start; font-size:12.5px; background:#f8fafc; border:1px solid var(--border); border-radius:7px; padding:7px 10px; }
.basis-kind { flex-shrink:0; font-size:10.5px; font-weight:700; padding:1px 8px; border-radius:999px; white-space:nowrap; margin-top:1px; }
.basis-kind.mail { background:#fef3e8; color:#b45309; }
.basis-kind.meeting { background:#f0ecfc; color:#6d28d9; }
.basis-kind.bugzilla { background:#e8eefb; color:#1d4ed8; }
.basis-kind.commit { background:#dcfce7; color:#166534; }
.basis-kind.bugfix { background:#fee2e2; color:#b91c1c; }
.basis-txt { line-height:1.6; color:#334155; }
.basis-txt a { color:#2563eb; text-decoration:none; border-bottom:1px dotted #93c5fd; word-break:break-all; }
.fixed-in { font-size:12.5px; margin-top:8px; padding:8px 12px; background:#f0fdf6; border-left:3px solid #34d399; border-radius:0 6px 6px 0; color:#065f46; line-height:1.7; }
.patch-card { border:1px solid var(--border); border-radius:9px; margin-top:8px; background:#fcfcfd; overflow:hidden; }
.patch-card > .pc-top { padding:10px 14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; background:#f8fafc; border-bottom:1px solid #eef1f5; }
.patch-sha { font-family:Consolas,monospace; font-size:12px; background:#eef2ff; color:#3730a3; padding:2px 8px; border-radius:4px; }
.patch-subject { font-weight:700; font-size:13.5px; color:#1e293b; flex:1; min-width:180px; }
.patch-mode { font-size:10.5px; font-weight:700; padding:2px 9px; border-radius:999px; }
.patch-mode.full { background:#dcfce7; color:#166534; }
.patch-mode.part { background:#fef3c8; color:#92400e; }
.patch-mode.pick { background:#e0e7ff; color:#4338ca; }
.patch-body { padding:2px 14px 12px; }
.patch-files { display:flex; flex-wrap:wrap; gap:5px; margin:8px 0; }
.patch-file { font-size:10.5px; font-family:ui-monospace,Menlo,monospace; background:#eef2ff; color:#4338ca; border-radius:5px; padding:2px 7px; }
.patch-diff { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.8px; line-height:1.55; background:#0f172a; color:#e2e8f0; border-radius:8px; padding:11px 13px; overflow:auto; max-height:300px; margin:6px 0 0; white-space:pre; }
.patch-why { font-size:12.5px; color:#475569; margin-top:7px; line-height:1.7; }
details.picker { border:none; box-shadow:none; background:transparent; margin:0; }
details.picker > summary { padding:7px 2px 3px; font-size:12px; color:var(--primary-dark); cursor:pointer; list-style:none; user-select:none; font-weight:600; display:flex; align-items:center; gap:6px; }

.sol-step { font-size:12.5px; color:#334155; line-height:1.7; }
.sol-step b { color:#b45309; }

.callout .callout-foot { margin-top:8px; font-size:12.5px; color:var(--text-muted); }

/* 标准解决方案：简短主述 + 补充信息（收起，内部滚动） */
details.sol-supp { margin-top:12px; background:#f0fdf6; border:1px solid #bbf7d0; border-radius:10px; overflow:hidden; }
details.sol-supp > summary { padding:10px 14px; font-size:13px; font-weight:700; color:#047857; background:#ecfdf5; cursor:pointer; user-select:none; list-style:none; display:flex; align-items:center; gap:8px; }
details.sol-supp > summary::-webkit-details-marker { display:none; }

details.sol-supp[open] > summary::before { transform:rotate(90deg); }
.sol-supp-body { max-height:440px; overflow:auto; padding:8px 16px 12px; }

/* —— 崩溃详情 · 日志特征分组（一类一行） —— */
.lf { margin-top:6px; display:flex; flex-direction:column; gap:12px; }
.lf-row { border:1px solid var(--border); border-radius:9px; background:#fcfcfd; padding:12px 14px; }
.lf-row-head { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
.lf-ico { width:24px; height:24px; border-radius:7px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:700; flex-shrink:0; }
.lf-row-name { font-size:13.5px; font-weight:700; color:#1e293b; }
.lf-count { font-size:10.5px; font-weight:700; padding:1px 9px; border-radius:999px; }
.lf-count.bad { background:#fde8e8; color:#b91c1c; }
.lf-count.mid { background:#fef3c7; color:#92400e; }
.lf-count.info { background:#e8eefb; color:#1d4ed8; }
.lf-rel { font-size:10.5px; font-weight:700; padding:1px 8px; border-radius:999px; white-space:nowrap; }
.lf-rel.high { background:#fde8e8; color:#b91c1c; }
.lf-rel.mid  { background:#fef3c7; color:#92400e; }
.lf-rel.low  { background:#f3f4f6; color:#64748b; }
.lf-scope { font-size:11px; color:var(--text-muted); font-family:Consolas,monospace; }
.lf-body { margin-top:8px; }
.lf-item { font-size:12px; font-family:Consolas,"SFMono-Regular",Menlo,monospace; line-height:1.6; background:#fff; border:1px solid #eef1f5; border-left:3px solid var(--border); border-radius:0 6px 6px 0; padding:6px 10px; margin-bottom:5px; color:#334155; white-space:pre-wrap; word-break:break-all; max-height:150px; overflow:auto; }
.lf-row p.lf-note { font-size:12px; color:var(--text-muted); margin:6px 0 0; }
details.lf-more { border:none; box-shadow:none; margin:6px 0 0; background:transparent; }
details.lf-more summary { padding:4px 2px; font-size:11.5px; cursor:pointer; color:var(--primary-dark); font-weight:600; user-select:none; list-style:none; }
details.lf-more summary::-webkit-details-marker { display:none; }
details.lf-more summary::before { content:"▸ "; }
details.lf-more[open] summary::before { content:"▾ "; }
.lf-line { font-size:11.3px; font-family:Consolas,Menlo,monospace; line-height:1.55; color:#64748b; white-space:pre-wrap; word-break:break-all; padding:3px 0; border-bottom:1px dashed #f0f2f5; }
.lf-line:last-child { border-bottom:none; }

/* —— 事件时序图 · 对象泳道 —— */
.sec-sub { font-size:12px; color:var(--text-muted); margin:-6px 0 14px; line-height:1.7; }
.tf-wrap { position:relative; margin:10px 0 6px; border:1px solid var(--border); border-radius:10px; background:linear-gradient(180deg,#fafbfc,#fff); }
.tf-scroll { overflow:auto; max-height:640px; }
.tf-inner { position:relative; min-width:860px; padding:6px 8px 10px; }
.tf-rail { position:relative; height:52px; border-bottom:1px solid #eef1f5; margin-bottom:4px; }
.tf-lane-head { position:absolute; top:0; display:flex; align-items:center; gap:7px; transform:translateX(-50%); flex-direction:column; justify-content:center; height:48px; }
.tf-head-type { font-size:9px; font-weight:800; letter-spacing:1px; color:#64748b; padding:1px 6px; border-radius:999px; border:1px solid #d1d5db; background:#fff; }
.tf-head-name { font-size:11.5px; font-weight:700; color:#1e293b; text-align:center; line-height:1.25; max-width:170px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tf-vlines { position:absolute; top:56px; bottom:0; left:0; right:0; pointer-events:none; }
.tf-row { position:relative; padding:7px 0 5px; }
.tf-row .tf-lane-mark { position:absolute; top:0; bottom:0; width:1px; }
.tf-time { position:absolute; left:-6px; top:8px; transform:translateX(-100%); font-size:10.5px; font-family:Consolas,monospace; color:#64748b; text-align:right; white-space:nowrap; }
.tf-time small { display:block; color:#a8b0bd; font-size:9px; }
.tf-arrow { position:absolute; top:17px; height:0; border-top:2px solid #7b8aa5; z-index:1; }
.tf-arrow::before, .tf-arrow::after { content:""; position:absolute; border:4px solid transparent; }
.tf-arrow.to-right::after { right:-2px; top:-5px; border-left-color:#7b8aa5; border-left-width:5px; }
.tf-arrow.to-left::before { left:-2px; top:-5px; border-right-color:#7b8aa5; border-right-width:5px; }
.tf-arrow.crash { border-top-color:#dc2626; }
.tf-arrow.crash.to-right::after { border-left-color:#dc2626; }
.tf-arrow.crash.to-left::before { border-right-color:#dc2626; }
.tf-msg { position:absolute; top:1px; z-index:2; background:#fff; border:1px solid #d8dee9; border-radius:8px; box-shadow:0 1px 3px rgba(15,23,42,.06); overflow:hidden; }
.tf-msg-head { display:flex; align-items:center; gap:6px; padding:5px 9px 3px; font-size:12px; }
.tf-msg-head .tf-kind { font-size:9.5px; font-weight:800; padding:1px 6px; border-radius:999px; color:#fff; white-space:nowrap; }
.tf-msg-title { font-weight:700; color:#1e293b; line-height:1.35; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; flex:1; }
.tf-msg-txt { padding:0 9px 5px; font-size:11.8px; color:#475569; line-height:1.55; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.tf-msg.is-open .tf-msg-txt { -webkit-line-clamp:unset; max-height:56px; overflow:auto; }
.tf-msg-val { padding:3px 9px; background:#f6f8fb; font-family:Consolas,Menlo,monospace; font-size:10.8px; color:#334155; border-top:1px dashed #e6eaf0; white-space:pre-wrap; word-break:break-all; }
.tf-msg-foot { display:flex; align-items:center; justify-content:space-between; padding:3px 8px; background:#fafbfc; border-top:1px solid #eef1f5; }
.tf-src { font-size:10px; font-weight:700; color:#94a3b8; }
.tf-exp { font-size:10.5px; color:var(--primary); cursor:pointer; font-weight:600; user-select:none; border:none; background:none; font-family:inherit; }
.tf-exp:hover { text-decoration:underline; }
.tf-msg.crash { border-color:#f3b4b4; background:#fdf5f5; }
.tf-msg.self { left:50%; transform:translateX(-50%); }
.tf-selfpin { position:absolute; top:3px; transform:translateX(-50%); width:1.5px; background:#d8dee9; }
.tf-note { font-size:11px; color:var(--text-muted); margin:4px 2px 0; line-height:1.6; }
.kind-meta { font-size:10px; font-weight:700; padding:1px 6px; border-radius:4px; white-space:nowrap; }

/* —— 根因分析 · 推理流 —— */
.rf-conclusion { margin-bottom:14px; }
.rf-stage { padding:4px 0 8px 34px; }
.rf-chain { position:relative; }
.rf-step { display:flex; gap:14px; padding:0 0 6px; position:relative; }
.rf-step:last-child { padding-bottom:0; }
.rf-step-dot { flex-shrink:0; width:26px; display:flex; justify-content:center; padding-top:3px; position:relative; }
.rf-step-dot-inner { width:24px; height:24px; border-radius:50%; color:#fff; font-size:10.5px; font-weight:800; display:flex; align-items:center; justify-content:center; z-index:1; box-shadow:0 0 0 3px #fff; }
.rf-step-dot::after { content:''; position:absolute; top:27px; bottom:-6px; left:50%; width:2px; background:#e2e8f0; transform:translateX(-50%); z-index:0; }
.rf-step:last-child .rf-step-dot::after { display:none; }
.rf-step-card { flex:1; min-width:0; background:#fff; border:1px solid var(--border); border-radius:9px; padding:12px 16px; margin-bottom:12px; }
.rf-step-card.is-final { background:#f0fdf6; border:1px solid #6ee7b7; border-left-width:3px; }
.rf-step-card.is-path { background:#fbfcff; }
.rf-tag { font-size:10px; font-weight:800; letter-spacing:.5px; padding:1px 8px; border-radius:999px; display:inline-block; margin-bottom:6px; }
.rf-title { font-size:14.5px; font-weight:700; color:#1e293b; line-height:1.5; }
.rf-title .rf-no { font-family:Consolas,monospace; color:#94a3b8; font-weight:600; margin-right:4px; }
.rf-text { margin-top:5px; font-size:13px; line-height:1.85; color:#475569; white-space:pre-wrap; word-break:break-word; }
.rf-evidence { margin-top:8px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px; line-height:1.7; background:#1e293b; color:#cbd5e1; border-radius:8px; padding:10px 12px; white-space:pre; overflow:auto; max-height:240px; }
.rf-evidence.plain { background:#f1f5f9; color:#334155; }
.rf-refs { display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
.rf-ref { font-size:11px; font-weight:700; padding:2px 9px; border-radius:999px; cursor:pointer; border:1px solid; }
.rf-ref:hover { filter:brightness(.97); }
.rf-ref .lnk { text-decoration:none; color:inherit; }
.rf-branch { display:flex; align-items:flex-start; gap:7px; margin-top:9px; font-size:12px; line-height:1.6; padding:6px 11px; border-radius:0 7px 7px 0; }
.rf-branch b { font-size:10.5px; letter-spacing:.4px; }
.rf-branch.stop { background:#fdf2f2; border-left:3px solid var(--danger); color:#991b1b; }
.rf-branch.go { background:#f0fdf6; border-left:3px solid var(--success); color:#065f46; }
.rf-flow-legend { display:flex; gap:14px; flex-wrap:wrap; margin:2px 0 12px; font-size:11.5px; color:var(--text-muted); }
.rf-flow-legend .it { display:inline-flex; align-items:center; gap:5px; }

/* 推理流中的崩溃路径小链 */
.rf-path { display:flex; flex-direction:column; gap:0; margin-top:8px; }
.rf-path .pn { display:flex; align-items:center; gap:7px; font-size:12px; padding:3px 0; }
.rf-path .pn .pno { width:17px; height:17px; border-radius:50%; background:#e0e7ff; color:#4338ca; font-size:9.5px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.rf-path .pn .fn { font-family:Consolas,Menlo,monospace; font-weight:700; color:#334155; }
.rf-path .pn .rel { font-size:10px; padding:0 6px; border-radius:999px; }
.rf-path .pn .at { font-size:10.5px; color:#94a3b8; font-family:Consolas,monospace; }
.rf-path .pn.crash { background:#fdf5f5; border:1px solid #f3b4b4; border-radius:6px; padding:3px 7px; }
.rf-path .pn.crash .fn { color:#b91c1c; }

/* —— 知识库匹配 · 分组（内部/社区邮件·会议·bugzilla/commit） —— */
.kb-section-title { font-size:15px; font-weight:700; margin:4px 0 10px; color:#1e293b; }
.kbg { margin:0 0 6px; }
.kbg-head { display:flex; align-items:center; gap:9px; margin:14px 0 4px; }
.kbg-dot { width:11px; height:11px; border-radius:3px; }
.kbg-name { font-size:14px; font-weight:700; }
.kbg-desc { font-size:12.5px; color:var(--text-muted); margin:0 0 8px; line-height:1.6; }
.kbg .cards { display:flex; flex-direction:column; gap:12px; }
.kbg .cards.collapsed .card:not(:first-child){ display:none; }
.card { border:1px solid var(--border); border-radius:10px; padding:13px 15px; background:#fff; }
.card.in-weak { border-color:#fcd34d; background:#fffdf5; }
.card .c-kind { display:inline-block; font-size:10px; font-weight:800; padding:1px 8px; border-radius:999px; margin-bottom:7px; letter-spacing:.4px; }
.c-kind.internal { background:#e8eefb; color:#1d4ed8; }
.c-kind.mail { background:#fef3e8; color:#b45309; }
.c-kind.meeting { background:#f0ecfc; color:#6d28d9; }
.c-kind.bugzilla { background:#ecfdf5; color:#047857; }
.c-kind.commit { background:#dcfce7; color:#166534; }
.card .c-score { display:inline-block; font-size:10.5px; font-weight:700; padding:1px 8px; border-radius:999px; margin-left:5px; }
.c-score.high { background:#dcfce7; color:#166534; } .c-score.mid { background:#fef3c7; color:#92400e; } .c-score.low { background:#f1f5f9; color:#64748b; }
.c-score.weak { background:#fef3c7; color:#b45309; border:1px dashed #f59e0b; }
.c-level { display:inline-block; font-size:9.5px; font-weight:800; padding:1px 7px; border-radius:999px; margin-left:5px; }
.c-level.L1 { background:#dcfce7; color:#15803d; } .c-level.L2 { background:#dbeafe; color:#1d4ed8; } .c-level.L3 { background:#fef3c7; color:#b45309; }
.c-verdict { display:inline-block; font-size:10px; font-weight:800; padding:1px 8px; border-radius:999px; margin-left:5px; }
.c-verdict.confirmed { background:#dcfce7; color:#15803d; } .c-verdict.same_area { background:#fef3c7; color:#b45309; }
.c-verdict.not_relevant { background:#f1f5f9; color:#94a3b8; } .c-verdict.unverified { background:#fff; color:#94a3b8; border:1px dashed #cbd5e1; }
.card .c-title { font-size:14px; font-weight:700; line-height:1.55; color:#1e293b; margin-bottom:4px; word-break:break-word; }
.card .c-title a { color:inherit; text-decoration:none; border-bottom:1px dotted #cbd5e1; }
.card .c-meta { font-size:11.5px; color:var(--text-muted); margin-bottom:7px; font-family:Consolas,monospace; }
.card .c-snippet { font-size:12.5px; color:#334155; background:#f8fafc; border-left:3px solid #cbd5e1; border-radius:0 6px 6px 0; padding:8px 11px; line-height:1.7; margin:6px 0; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.card.is-open .c-snippet { -webkit-line-clamp:unset; }
.card .c-more { display:inline; font-size:11px; color:var(--primary); cursor:pointer; font-weight:600; }
.card .c-derive { margin-top:8px; font-size:12.5px; line-height:1.7; padding:8px 12px; border-radius:0 7px 7px 0; background:#f0f9ff; border-left:3px solid #0ea5e9; color:#0c4a6e; }
.card .c-derive b { color:#0369a1; }
.card .c-derive .chain { font-weight:600; }
.card .c-link { font-size:11.5px; font-weight:600; color:var(--primary-dark); text-decoration:none; margin-top:6px; display:inline-block; }
.card .c-link:hover { text-decoration:underline; }
.c-ev { margin-top:7px; }
.kb-expand { text-align:center; margin:8px 0 4px; }
  .kb-expand button { padding:5px 15px; border-radius:8px; border:1px dashed #94a3b8; background:transparent; color:#64748b; font-size:12px; cursor:pointer; font-family:inherit; }
  .kb-expand button:hover { background:#f1f5f9; }

/* ================= 整体主题统一（去卡通化） ================= */
:root{
  --primary:#2f5bd8; --primary-deep:#1e3f9e;
  --danger:#c03a2e; --warning:#b26a00; --success:#12805c;
  --text:#1c2733; --text-2:#52637b; --muted:#8494ab;
  --bg:#f5f7fa; --line:#dde3ec; --line-2:#eef1f6;
  --tint-blue:#eef3ff; --tint-green:#eaf7f1; --tint-amber:#fbf4e6; --tint-red:#fbeeec; --tint-grey:#f4f6f9;
}
body{ background:var(--bg); color:var(--text); }
section, details, .card, .patch-card, .mc-evidence, .lf-row, .tf-wrap{ box-shadow:none; }
section{ border-radius:8px; }
.report-header{ background:linear-gradient(135deg,#1b2f63,#2f5bd8); box-shadow:0 2px 10px rgba(27,47,99,.18); border-radius:8px; }
h2{ color:#223a6b; border-bottom:1px solid var(--line-2); }
h2 .num{ background:var(--primary); border-radius:6px; }
.callout{ border-radius:6px; border-left-width:3px; }
.callout-danger{ background:var(--tint-red); border-color:var(--danger); }
.callout-warning{ background:var(--tint-amber); border-color:var(--warning); }
.callout-success{ background:var(--tint-green); border-color:var(--success); }
.callout-info{ background:var(--tint-blue); border-color:var(--primary); }
.callout .title{ color:var(--text); }
.badge, .sol-type, .patch-mode, .lf-count, .basis-kind, .c-kind, .c-level, .c-verdict, .c-score, .rf-tag, .tf-kind, .kind-meta, .patch-sha{ border-radius:5px; }
pre{ border-radius:6px; }
.sec-sub, .tf-note, .kbg-desc{ color:var(--muted); }
.mg-count, .mc-id{ color:var(--muted); }
.kb-expand button, .match-expand button{ border-color:#b9c4d4; color:#52637b; }
code{ background:#eef1f6; color:#8a2d2d; }
a.kb-ref, a.path, .pc-src-link{ color:var(--primary); }
.mc-kind.mail, .basis-kind.mail{ background:var(--tint-amber); color:#8a5200; }

/* 悬浮提示（hover 显示详细信息） */
#tip{ position:fixed; z-index:9999; max-width:420px; background:#0f1b30; color:#e6ecf5;
  border:1px solid #26334d; border-radius:6px; padding:8px 11px; font-size:12px; line-height:1.65;
  box-shadow:0 6px 20px rgba(15,27,48,.28); pointer-events:none; display:none; }
#tip .tip-t{ font-weight:700; color:#fff; margin-bottom:3px; }
#tip .tip-m{ color:#aab8d0; font-size:11px; margin-bottom:4px; }
#tip .tip-b{ max-height:220px; overflow:auto; white-space:pre-wrap; word-break:break-word; }
[data-tip]{ cursor:help; }

/* ================= 事件时序图 v2（简洁行泳道 + 全局变量侧栏） ================= */
.tl-sec-note{ font-size:12.5px; color:var(--muted); margin:-4px 0 10px; line-height:1.7; }
.tlx{ border:1px solid var(--line); border-radius:8px; background:#fff; }
.tlx-scroll{ overflow:auto; max-height:620px; }
.tlx-inner{ display:flex; align-items:stretch; min-width:1180px; }
.tlx-gbox{ flex:0 0 236px; border-right:1px solid var(--line); background:#fbfcfe; position:relative; }
.tlx-ghead{ position:sticky; top:0; z-index:5; background:#eef3ff; padding:8px 10px; font-size:12px; font-weight:700; color:#223a6b; border-bottom:1px solid var(--line); }
.tlx-grow{ height:116px; border-bottom:1px dashed var(--line-2); padding:10px 10px 6px; box-sizing:border-box; overflow:hidden; }
.tlx-grow:last-child{ border-bottom:none; }
.tlx-gempty{ color:#c3ccd9; font-size:11px; padding-top:4px; }
.tlx-gvar{ font-size:10.5px; font-weight:700; color:#223a6b; font-family:Consolas,monospace; margin-bottom:2px; display:flex; align-items:center; gap:5px; }
.tlx-gvar .dot{ width:6px;height:6px;border-radius:50%; }
.tlx-gchg{ font-family:Consolas,monospace; font-size:11px; line-height:1.6; color:#334155; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tlx-gchg .old{ color:#94a3b8; text-decoration:line-through; }
.tlx-gchg .new{ color:#12805c; font-weight:700; }
.tlx-gchg.down .new{ color:#c03a2e; }
.tlx-gtag{ font-size:9px; color:var(--muted); }
.tlx-seq{ flex:1; position:relative; min-width:880px; }
.tlx-lanes{ position:absolute; inset:0; pointer-events:none; }
.tlx-lane-line{ position:absolute; top:0; bottom:0; width:0; border-left:1px dashed #d7deea; }
.tlx-head{ position:relative; height:66px; border-bottom:1px solid var(--line); display:flex; }
.tlx-hcell{ flex:1; display:flex; align-items:center; justify-content:center; text-align:center; gap:6px; min-width:0; }
.tlx-hkind{ font-size:9px; font-weight:800; letter-spacing:.6px; padding:1px 6px; border-radius:4px; }
.tlx-hname{ font-size:12px; font-weight:700; color:#1c2733; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:170px; }
.tlx-head.has4 .tlx-hcell:nth-child(2),.tlx-head.has4 .tlx-hcell:nth-child(3),.tlx-head.has4 .tlx-hcell:nth-child(4){ justify-content:center; }
.tlx-row{ position:relative; height:116px; box-sizing:border-box; border-bottom:1px dashed var(--line-2); }
.tlx-row:last-child{ border-bottom:none; }
.tlx-time{ position:absolute; left:6px; top:4px; font-size:10px; font-family:Consolas,monospace; color:var(--muted); white-space:nowrap; }
.tlx-time small{ display:block; font-size:8.5px; color:#a9b6c8; }
.tlx-arrow{ position:absolute; height:0; border-top:2px solid #9aa8bd; z-index:1; }
.tlx-arrow.r{ border-top-color:#5b7bb0; } .tlx-arrow.r::after{ content:""; position:absolute; right:-2px; top:-5px; border:5px solid transparent; border-left-color:#5b7bb0; }
.tlx-arrow.l{ border-top-color:#5b7bb0; } .tlx-arrow.l::before{ content:""; position:absolute; left:-2px; top:-5px; border:5px solid transparent; border-right-color:#5b7bb0; }
.tlx-arrow.bad{ border-top-color:#c03a2e; } .tlx-arrow.bad.r::after{ border-left-color:#c03a2e; } .tlx-arrow.bad.l::before{ border-right-color:#c03a2e; }
.tlx-selfarrow{ position:absolute; width:0; border-left:2px solid #9aa8bd; }
.tlx-selfarrow::after{ content:""; position:absolute; left:-5px; bottom:-2px; border:5px solid transparent; border-top-color:#9aa8bd; }
.tlx-selfarrow.bad{ border-left-color:#c03a2e; } .tlx-selfarrow.bad::after{ border-top-color:#c03a2e; }
.tlx-sloop{ position:absolute; pointer-events:none; z-index:1; }
.tlx-card{ position:absolute; top:12px; z-index:2; background:#fff; border:1px solid var(--line); border-left-width:3px; border-radius:5px; box-shadow:0 1px 2px rgba(28,39,51,.05); overflow:hidden; }
.tlx-card .k-tag{ display:inline-block; font-size:8.5px; font-weight:800; padding:0 5px; border-radius:3px; margin-right:4px; letter-spacing:.3px; color:#fff; vertical-align:1px; }

<div class="container" id="app">

    <div class="report-header" id="report-header">
    <span class="tag">KERNEL CRASH · 综合分析报告</span>
    <h1 id="header-title">加载中...</h1>
    <div class="subtitle" id="header-subtitle"></div>
    <div class="meta-grid" id="header-meta-grid"></div>
  </div>

  <section id="exec-summary-section">
    <h2><span class="num">1</span>执行摘要</h2>
    <div id="exec-summary-body"></div>
  </section>

    <section id="crash-detail-section">
    <h2><span class="num">2</span>崩溃详情</h2>
    <div id="crash-detail-body"></div>
  </section>

    <h2><span class="num">3</span>事件时序图</h2>
    <div id="event-timeline-body"></div>
  </section>

    <h2><span class="num">4</span>根因分析</h2>
    <div id="rootcause-body"></div>
  </section>

    <details id="kb-wrap" class="kb-wrap">
    <summary><span class="num">5</span>知识库匹配 <span id="kb-count" class="mg-count" style="margin-left:2px"></span></summary>
    <div class="detail-body" style="padding:16px 24px 4px"><div id="kb-body"></div></div>
  </details>

    <details id="workflow-details" style="margin-top:24px;">
    <summary>诊断工作流追踪</summary>
    <div class="detail-body" id="workflow-body"></div>
  </details>

  <div class="footer" id="footer-text"></div>
</div>

<script>
const FULL_URL='report.json';
const EMBED_FULL = /*__FULL_DATA__*/null;

/* ================= 基础工具 ================= */
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const toArr = v => Array.isArray(v) ? v : (v==null || v==='' ? [] : [v]);
function linkify(s){
  return esc(s).replace(/https?:\/\/[^\s<]+/g, m=>{
    const url=m.replace(/[)\].,，。；;！!？?'"'"'”）】]+$/,'');
    const tail=m.slice(url.length);
    return `<a href="${url}" target="_blank" rel="noopener" style="color:#2563eb;text-decoration:underline;word-break:break-all">${url}</a>${tail}`;
  });
}

/* KB 锚点跳转（跨章节引用） */
let KB_REF_MAP={}, KB_REF_REGEX=null;
const GENERIC_TOKENS=['内部知识库','内部案例','社区邮件','会议纪要','bugzilla','社区案例','上游 commit','匹配案例','知识库案例','commit','补丁'];
function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function shaOf(v){ if(v==null)return ''; const m=String(v).match(/[0-9a-f]{7,40}/i); return m?m[0]:''; }
function buildKBRefMap(report){
  const map={}, add=(a,vals)=>vals.forEach(v=>{const s=String(v==null?'':v).trim(); if(s.length>=4){const k=s.toLowerCase(); if(!(k in map)) map[k]=a;}});
  const diag=report.diagnosis_repair_result||{};
  const hlp=(arr,kind)=>{
    (arr||[]).forEach((c,i)=>{
      const aid=c.anchor||('kb-'+(c.id||kind||'x'));
      add(aid,[c.knowledge_id,c.id,c.title,c.subject,c.bug_summary,shaOf(c.url),shaOf(c.source_file)]);
    });
  };
  hlp(diag.internal_kernel_result,'internal');
  hlp((diag.online_result||[]).filter(c=>c.kind==='mail'),'mail');
  hlp(diag.community_meetings,'meeting');
  hlp(diag.community_kernel_result,'bugzilla');
  hlp((diag.online_result||[]).filter(c=>c.kind==='commit'),'commit');
  KB_REF_MAP=map;
  const tokens=[...Object.keys(map),...GENERIC_TOKENS].sort((a,b)=>b.length-a.length);
  KB_REF_REGEX = tokens.length ? new RegExp('('+[...new Set(tokens)].map(escRe).join('|')+')','gi') : null;
  return map;
}
function gotoKB(id){
  const w=document.getElementById('kb-wrap'); if(w && !w.open) w.open=true;
  const el=document.getElementById(id)||document.getElementById('kb-body');
  if(el){ setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'center'}),40); }
  return false;
}
function rich(s){
  let html=linkify(s); if(!KB_REF_REGEX) return html;
  return html.split(/(<a\b[^>]*>.*?<\/a>)/gs).map(seg=>{
    if(/^<a\b/.test(seg)) return seg;
    return seg.replace(KB_REF_REGEX, m=>{
      const a=KB_REF_MAP[m.toLowerCase()];
      return a?`<a class="kb-ref" href="#${a}" onclick="return gotoKB('${a}')">${m}</a>`:m;
    });
  }).join('');
}
function fmtTime(t){
  if(!t) return '时间未知';
  const d=new Date(t);
  if(!isNaN(d.getTime())) return d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  return String(t);
}

/* ================= 1 执行摘要 ================= */
const SOL_TYPE = {
  patch:{label:'需合入补丁', cls:'patch', verdict:'未修复 · 建议合入上游补丁'},
  config:{label:'配置/命令行修复', cls:'config', verdict:'无需补丁 · 调整配置修复'},
  upgrade:{label:'建议升级内核', cls:'upgrade', verdict:'未修复 · 建议升级内核'},
  none:{label:'无需处理', cls:'none', verdict:'当前内核已修复 · 无需处理'},
};
const BASIS_KIND = {mail:'社区邮件', meeting:'会议纪要', bugzilla:'Bugzilla/Issue', commit:'上游 commit', bugfix:'上游 bugfix 描述'};
function renderExecSummary(report){
  const ra=report.root_cause_analysis||{};
  let h='';
  if(ra.conclusion) h+=`<div class="callout callout-danger"><div class="title">结论</div>${rich(ra.conclusion)}</div>`;

  const ss=ra.standard_solution||null;
  if(ss){
    const t=SOL_TYPE[ss.type]||SOL_TYPE.patch;
    h+=`<div class="callout callout-success sol"><div class="sol-head">`;
    h+=`<span class="sol-title">标准解决方案</span><span class="sol-type ${t.cls}">${t.label}</span>`;
    if(ss.claim_tag) h+=`<span style="font-size:11px;color:var(--text-muted)">${esc(ss.claim_tag)}</span>`;
    h+=`</div>`;

    /* —— 简短的解决动作（合入补丁；若为纯配置修复则附执行命令） —— */
    const brief=ss.short||ss.summary_short||ss.claim||'';
    if(brief) h+=`<div class="sol-lead">${rich(brief)}</div>`;
    if(ss.type==='config' && toArr(ss.commands).length){
      h+=`<div class="sol-block"><div class="sol-block-t">执行命令 / 配置</div>`;
      h+=`<pre class="patch-diff" style="background:#0f172a;max-height:180px;overflow:auto;">${esc(toArr(ss.commands).join('\n'))}</pre>`;
      h+=`</div>`;
    }

    /* —— 补充信息（收起 + 滚动） —— */
    let sup='';
    if(toArr(ss.basis).length){
      sup+=`<div class="sol-block"><div class="sol-block-t">修复依据（社区邮件 / 会议纪要 / bugfix）</div><div class="basis-list">`;
      toArr(ss.basis).forEach(b=>{
        const k=BASIS_KIND[b.kind]||b.kind;
        sup+=`<div class="basis-item"><span class="basis-kind ${esc(b.kind||'bugfix')}">${esc(k)}</span>`;
        sup+=`<span class="basis-txt">${b.text?rich(b.text)+' ':''}${b.title?esc(b.title):''}${b.url?` <a href="${esc(b.url)}" target="_blank" rel="noopener">原文 ↗</a>`:''}</span></div>`;
      });
      sup+=`</div></div>`;
    }
    if(ss.fixed_in) sup+=`<div class="fixed-in"><b>修复版本判定：</b>${rich(ss.fixed_in)}</div>`;
    if(toArr(ss.patch_list).length){
      sup+=`<div class="sol-block"><div class="sol-block-t">建议合入补丁（${toArr(ss.patch_list).length} 个）</div>`;
      toArr(ss.patch_list).forEach(p=>{
        const mode={full:['整体合入','full'],part:['局部合入(最小改动)','part'],pick:['取其思路改造','pick']}[p.mode]||[p.mode,'full'];
        sup+=`<div class="patch-card"><div class="pc-top">`;
        sup+=`<span class="patch-sha">${esc(p.sha)}</span><span class="patch-subject">${esc(p.subject)}</span><span class="patch-mode ${mode[1]}">${mode[0]}</span>`;
        sup+=`</div><div class="patch-body">`;
        if(p.why) sup+=`<div class="patch-why">${rich(p.why)}</div>`;
        if(toArr(p.files).length) sup+=`<div class="patch-files">${toArr(p.files).map(f=>`<span class="patch-file">${esc(f)}</span>`).join('')}</div>`;
        if(p.diff) sup+=`<details class="picker"><summary>查看补丁差异（diff）</summary><div class="picker-body"><pre class="patch-diff">${esc(p.diff)}</pre></div></details>`;
        sup+=`</div></div>`;
      });
      sup+=`</div>`;
    }
    if(toArr(ss.method_steps).length){
      sup+=`<div class="sol-block"><div class="sol-block-t">合入方案（步骤）</div><div class="basis-list">`;
      toArr(ss.method_steps).forEach(s=>sup+=`<div class="basis-item"><span class="basis-txt">${rich(s)}</span></div>`);
      sup+=`</div></div>`;
    }
    if(ss.detail) sup+=`<details class="picker"><summary>完整说明 / 回退与验证</summary><div class="picker-body"><div class="sol-full">${rich(ss.detail)}</div></div></details>`;
    if(ss.rollback) sup+=`<details class="picker"><summary>回退方案</summary><div class="picker-body"><div class="sol-full">${rich(ss.rollback)}</div></div></details>`;
    if(ss.verification) sup+=`<details class="picker"><summary>验证方案</summary><div class="picker-body"><div class="sol-full">${rich(ss.verification)}</div></div></details>`;
    if(sup) h+=`<details class="picker sol-supp" style="margin-top:10px"><summary>补充信息（修复依据 / 版本判定 / 补丁 diff / 合入步骤）</summary><div class="picker-body sol-supp-body">${sup}</div></details>`;
    h+=`</div>`;
  }

  const w=ra.temporary_workaround||null;
  if(w){
    h+=`<div class="callout callout-warning sol"><div class="sol-head">`;
    h+=`<span class="sol-title">临时规避方案</span><span class="sol-type config">${w.type==='config'?'命令行/配置规避':w.type==='none'?'无临时规避方案':'操作规避'}</span>`;
    h+=`</div>`;
    h+=`<div class="sol-lead">${rich(w.summary)}</div>`;
    /* 步骤 / 风险 / 回退统一收起，需要时展开（滚动） */
    let wr='';
    if(toArr(w.steps).length){
      wr+=`<div class="sol-block"><div class="sol-block-t">操作步骤</div>`;
      if(w.type==='config'){
        wr+=`<pre class="patch-diff" style="background:#0f172a;max-height:220px;overflow:auto;">${esc(toArr(w.steps).join('\n'))}</pre>`;
      } else {
        wr+=`<ol style="margin:4px 0 0 22px;font-size:13px;line-height:1.8">${toArr(w.steps).map(s=>`<li>${rich(s)}</li>`).join('')}</ol>`;
      }
      wr+=`</div>`;
    }
    if(w.risk) wr+=`<div class="callout-foot" style="margin-top:6px"><b>风险与注意：</b>${rich(w.risk)}</div>`;
    if(w.detail) wr+=`<div class="sol-full" style="margin-top:6px">${rich(w.detail)}</div>`;
    if(wr) h+=`<details class="picker sol-supp warn" style="margin-top:10px"><summary>操作步骤 / 风险与回退方法</summary><div class="picker-body sol-supp-body">${wr}</div></details>`;
    h+=`</div>`;
  }
  if(!h) h='<div class="empty-line">无</div>';
  document.getElementById('exec-summary-body').innerHTML=h;
}

/* ================= 2 崩溃详情（含日志特征分组） ================= */
const LF_ICONS={err:'✕',rep:'⟳',other:'!'};
function logFeaturesHtml(lf){
  if(!lf) return '';
  const refTag=r=>r&&(r.file||r.lines)?`<span class="lf-ref">${esc(r.file||'')}${r.lines?` · L${esc(String(r.lines))}`:''}</span>`:'';
  const relBadge=r=>{
    const m={强相关:['high','强相关'],一般相关:['mid','一般相关'],弱相关:['low','弱相关']}[r];
    return m?`<span class="lf-rel ${m[0]}">${m[1]}</span>`:'';
  };
  const cat=(icoClr,ico,name,countTxt,ref,inner)=>`<details class="lf-cat"><summary>`+
    `<span class="lf-ico" style="background:${icoClr}">${ico}</span>`+
    `<span class="lf-row-name">${name}</span>${countTxt||''}${ref||''}`+
    `</summary><div class="lf-cat-body">${inner}</div></details>`;
  const item=txt=>`<div class="lf-item">${txt}</div>`;
  let h='<div class="lf">';

  const errs=Array.isArray(lf.related_errors)?lf.related_errors:[];
  if(errs.length){
    const inner=errs.map(e=>{
      const loc=e.file||e.lines?`<span class="loc">[${esc(e.file||'')}${e.lines?` L${esc(String(e.lines))}`:''}]</span>`:'';
      return item(relBadge(e.relevance||'强相关')+' '+loc+esc(e.t?`[${e.t}] `:'')+esc(e.line));
    }).join('');
    h+=cat('#c03a2e',LF_ICONS.err,'相关报错信息',`<span class="lf-count bad">${errs.length} 条</span>`,refTag(lf.related_ref),inner);
  }

  const reps=Array.isArray(lf.repeated)?lf.repeated:[];
  reps.forEach((r,i)=>{
    const ex=Array.isArray(r.examples)?r.examples:[];
    let inner=(r.note?`<p class="lf-note">${rich(r.note)}</p>`:'');
    if(ex.length){
      inner+=`<div class="lf-examples">`+ex.map(l=>`<div class="lf-line">${esc(l)}</div>`).join('')+`</div>`;
    }
    h+=cat('#b26a00',LF_ICONS.rep,esc(r.title||('强相关可疑日志组 '+(i+1))),
      `${relBadge(r.relevance)}<span class="lf-count bad">重复 ${esc(String(r.count))} 次</span>${r.window?`<span class="lf-scope">窗口 ${esc(r.window)}</span>`:''}`,
      refTag(r.ref||(r.file?{file:r.file,lines:r.lines}:null)), inner);
  });

  const others=Array.isArray(lf.other)?lf.other:[];
  others.forEach((o,i)=>{
    const lines=Array.isArray(o.lines)?o.lines:[];
    let inner=(o.note?`<p class="lf-note">${rich(o.note)}</p>`:'');
    if(lines.length) inner+=`<div class="lf-examples">${lines.map(l=>`<div class="lf-line">${esc(l)}</div>`).join('')}</div>`;
    h+=cat('#2f5bd8',LF_ICONS.other,esc(o.name||('其他关联异常 '+(i+1))),
      `${relBadge(o.relevance)}${o.count?`<span class="lf-count mid">${esc(String(o.count))}</span>`:''}${o.span?`<span class="lf-scope">${esc(o.span)}</span>`:''}`,
      refTag(o.ref||(o.file?{file:o.file,lines:o.lines}:null)), inner);
  });

  h+='</div>';
  return h;
}
function renderCrashDetail(report){
