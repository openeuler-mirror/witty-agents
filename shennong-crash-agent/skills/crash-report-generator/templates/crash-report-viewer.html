/* ================= 3 事件时序图（对象泳道） ================= */
const TYPES_META={
  process:{label:'进程', color:'#1d4ed8'},
  kernel:{label:'内核', color:'#0d9488'},
  thread:{label:'线程', color:'#0284c7'},
  global:{label:'全局变量', color:'#7c3aed'},
  local:{label:'局部变量', color:'#c25700'},
  hardware:{label:'硬件', color:'#475569'},
};
const KIND_META={
  irq:{label:'硬件中断', color:'#5b7bb0'},
  softirq:{label:'软中断', color:'#5b7bb0'},
  call:{label:'调用', color:'#5b7bb0'},
  hw:{label:'硬件', color:'#5b7bb0'},
  mutex:{label:'互斥访问', color:'#2f5bd8'},
  alloc:{label:'引用/分配', color:'#12805c'},
  local:{label:'局部变量(值)', color:'#b26a00'},
  race:{label:'竞态缺口', color:'#c03a2e'},
  free:{label:'释放', color:'#c03a2e'},
  global:{label:'全局变化', color:'#7a5bd8'},
  crash:{label:'崩溃爆发', color:'#c03a2e'},
};
function renderEventTimeline(report){
  const ra=report.root_cause_analysis||{};
  const sc=ra.event_scene||null;
  const body=document.getElementById('event-timeline-body');
  if(!sc || !Array.isArray(sc.participants) || !sc.participants.length){
    body.innerHTML='<div class="empty-line">无事件时序数据</div>'; return;
  }
  const parts=sc.participants, evs=sc.events||[], n=parts.length;
  const kindOf=e=>({irq:{n:'硬件中断',c:'#5b7bb0'},softirq:{n:'软中断',c:'#5b7bb0'},call:{n:'调用',c:'#5b7bb0'},hw:{n:'硬件',c:'#5b7bb0'},mutex:{n:'互斥/锁',c:'#2f5bd8'},alloc:{n:'引用/分配',c:'#12805c'},local:{n:'局部变量(值)',c:'#b26a00'},race:{n:'竞态缺口',c:'#c03a2e'},free:{n:'释放',c:'#c03a2e'},global:{n:'全局变化',c:'#7a5bd8'},crash:{n:'崩溃爆发',c:'#c03a2e'}}[e.kind]||{n:e.kind||'事件',c:'#5b7bb0'});
  const typeL=p=>p&&((TYPES_META[p.type]||{}).label||p.type);
  const mm=p=>{const m={user:{n:'用户态',c:'#0e7490'},sys:{n:'用户→内核',c:'#4f46e5'},kern:{n:'内核态',c:'#1e293b'},hw:{n:'硬件',c:'#5b7bb0'}}[p]; return m||{n:'',c:'#64748b'};};
  const pad=v=>String(v).padStart(2,'0');
  const mkTime=(ev)=>{
    if(sc.anchor && ev.dt_ms!=null){
      const t=new Date(Date.parse(sc.anchor)-ev.dt_ms);
      if(!isNaN(t.getTime())) return `${pad(t.getHours())}:${pad(t.getMinutes())}:${pad(t.getSeconds())}.${String(t.getMilliseconds()).padStart(3,'0')}`;
    }
    return ev.t||'';
  };

  const GUT=132, ROW=120, HEAD=80;
  const LANE=Math.max(210, Math.floor((1180-GUT)/(n||1))-40);
  const seqW=Math.max(560, GUT+LANE*n);
  const xAt=i=>GUT+LANE*(i+0.5);

  let html=`<p class="tl-sec-note"><b>泳道</b>：三类对象——进程(用户态) / 内核(CPU) / 硬件，每类可有多个；事件带<b>时分秒</b>与箭头（对象指向自身时用弯折回环箭头指回自身），并在对象间<b>传递变量/值</b>。悬停事件或对象可看详细信息（进程 PID/名称、内核序号、硬件类型等）。最左为全局变量状态列。</p>`;
  html+=`<div class="tlx-legend">`+
   `<span class="lg"><span class="sq" style="background:#0e7490"></span>用户态(进程)</span>`+
   `<span class="lg"><span class="sq" style="background:#1e293b"></span>内核态(CPU)</span>`+
   `<span class="lg"><span class="sq" style="background:#5b7bb0"></span>硬件</span>`+
   `<span class="lg"><span class="sq" style="background:#12805c"></span>锁/引用变化</span>`+
   `<span class="lg"><span class="sq" style="background:#c03a2e"></span>竞态/崩溃</span>`+
   `<span class="lg"><span class="sq" style="background:#b26a00"></span>变量/值传递</span></div>`;

  const st={}; (sc.ginit||[]).forEach(g=>st[g.k]=g.v);
  const changeLog=evs.map(ev=>(ev.g||[]).map(c=>{const f=st[c.v]; st[c.v]=c.t; return {name:c.n||c.v,f,t:c.t,down:c.dir==='down'||((Number(f)!=null&&Number(c.t)!=null&&Number(c.t)<Number(f))),bad:/NULL|0x0/.test(String(c.t))};}));

  html+=`<div class="tlx"><div class="tlx-scroll"><div class="tlx-inner" style="min-width:${236+seqW}px">`;

  /* 全局变量列 */
  html+=`<div class="tlx-gbox" style="flex:0 0 236px"><div class="tlx-ghead">全局变量 · 随事件变化</div>`;
  evs.forEach((ev,i)=>{
    const ch=changeLog[i];
    html+=`<div class="tlx-grow" style="height:${ROW}px;border-bottom:1px dashed var(--line-2);box-sizing:border-box;padding:10px 10px 6px">`;
    if(!ch.length){ html+=`<div class="tlx-gempty">—</div>`; }
    else ch.forEach(c=>{
      html+=`<div class="tlx-gvar"><span class="dot" style="background:${c.down?'#c03a2e':'#12805c'}"></span>${esc(c.name)}</div>`;
      html+=`<div class="tlx-gchg${c.down?' down':''}" style="font-family:Consolas,monospace;font-size:11px;color:#334155"><span class="old" style="color:#8494ab">${esc(String(c.f))}</span> → <span class="new" style="font-weight:700;color:${c.bad?'#c03a2e':'#12805c'}">${esc(String(c.t))}</span></div>`;
    });
    html+=`</div>`;
  });
  html+=`</div>`;

  /* 事件序列区 */
  html+=`<div class="tlx-seq" style="width:${seqW}px;flex:0 0 ${seqW}px;position:relative">`;
  html+=`<div class="tlx-lanes">`+ parts.map((p,i)=>`<div class="tlx-lane-line" style="left:${xAt(i)}px"></div>`).join('') +`</div>`;

  /* 对象头 */
  html+=`<div style="position:relative;height:${HEAD}px;border-bottom:1px solid var(--line)">`;
  parts.forEach((p,i)=>{
    const x=xAt(i), c=(TYPES_META[p.type]||{}).color||'#5b7bb0', mk=mm(p.mode);
    html+=`<div style="position:absolute;top:6px;left:${x}px;transform:translateX(-50%);text-align:center;width:${LANE-20}px" data-tip data-tipbody="${esc(p.name+' · '+(typeL(p)||'')+(p.init?' · '+p.init:'')+(p.tip?' · '+p.tip:''))}">`;
    html+=`<div><span class="tlx-hkind" style="background:${c}14;color:${c};border:1px solid ${c}44">${esc(typeL(p))}</span>`;
    if(mk.n) html+=` <span class="tlx-hmode" style="background:${mk.c}16;color:${mk.c};border:1px solid ${mk.c}44">${esc(mk.n)}</span></div>`;
    else html+=`</div>`;
    html+=`<div style="margin-top:3px;font-size:12px;font-weight:700;color:#1c2733;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.name)}</div>`;
    if(p.init) html+=`<div style="font-size:9px;color:#8494ab;font-family:Consolas,monospace">${esc(p.init)}</div>`;
    html+=`</div>`;
  });
  html+=`</div>`;

  /* 事件行 */
  evs.forEach((ev,i)=>{
    const fi=parts.findIndex(p=>p.id===ev.from), ti=parts.findIndex(p=>p.id===(ev.to||''));
    const fromX=fi>=0?xAt(fi):(GUT+LANE);
    const hasT=fi>=0&&ti>=0&&ev.to!==ev.from;
    const toX=hasT?xAt(ti):fromX;
    const kM=kindOf(ev), mk=mm(ev.m), isCrash=ev.kind==='crash';
    const d=Math.abs(toX-fromX);
    const timeLbl=mkTime(ev);

    html+=`<div class="tlx-row" style="height:${ROW}px;border-bottom:1px dashed var(--line-2);box-sizing:border-box;position:relative">`;
    html+=`<div class="tlx-time" style="position:absolute;left:2px;top:3px;font-size:10px;font-family:Consolas,monospace;color:#1c2733">${esc(timeLbl)}<br><small style="font-size:8.5px;color:#8494ab">${esc(ev.origin||'')}</small></div>`;

    let cardW,L;
    if(hasT){ const mid=(fromX+toX)/2; cardW=Math.min(300,Math.max(170,Math.round(d*0.7))); L=Math.max(0,Math.min(mid-cardW/2, seqW-cardW-4)); }
    else { const x=fi>=0?fromX:(GUT+LANE); cardW=Math.min(260,seqW-(x+12)-4); cardW=Math.max(150,cardW); L=Math.min(x+12,Math.max(0,seqW-cardW-4)); }

    /* 悬停只显示一行概要（少而精） */
    const tipBody=(ev.title||'')+(ev.val?('\n值：'+ev.val):'')+(ev.full?('\n'+ev.full):'');
    html+=`<div class="tlx-card${isCrash?' crash':''}" style="left:${L}px;width:${cardW}px;top:6px" data-tip data-tipbody="${esc(tipBody)}">`;
    html+=`<div style="padding:5px 8px 4px"><div class="t-title" style="font-size:11.5px;color:#1c2733;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">`;
    if(mk.n) html+=`<span class="tlx-mtag" style="background:${mk.c}">${esc(mk.n)}</span>`;
    html+=`<span class="k-tag" style="background:${kM.c}">${esc(kM.n)}</span>${esc(ev.title||'')}</div>`;
    if(ev.val) html+=`<div class="t-val" style="font-family:Consolas,monospace;font-size:9.5px;color:#52637b;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(ev.val)}</div>`;
    html+=`</div></div>`;

    if(hasT){
      const right=toX>fromX;
      const bad=isCrash||ev.kind==='race'||ev.kind==='free';
      html+=`<div class="tlx-arrow ${right?'r':'l'}${bad?' bad':''}" style="left:${Math.min(fromX,toX)+6}px;width:${Math.max(0,d-12)}px;top:${ROW/2}px"></div>`;
    } else {
      /* 对象指向自身：画一个弯折的回环箭头（从生命线弯出并指回自身） */
      const bad=isCrash||ev.kind==='race'||ev.kind==='free';
      const col=bad?'#c03a2e':'#5b7bb0';
      html+=`<svg class="tlx-sloop" style="left:${fromX-10}px;top:${Math.round(ROW*0.5)}px" width="30" height="52" viewBox="0 0 30 52" xmlns="http://www.w3.org/2000/svg">`+
        `<path d="M10 2 C 30 2, 30 50, 10 50" fill="none" stroke="${col}" stroke-width="1.6"/>`+
        `<polygon points="24,44 10,50 24,56" fill="${col}"/></svg>`;
    }
    html+=`</div>`;
  });

  html+=`</div>`;
  html+=`</div></div></div>`;
  if(sc.anchor) html+=`<p class="tlx-foot">纵虚线=对象生命线；箭头=事件/变量在对象间传递，对象指向自身时用弯折回环箭头指回自身。时刻为以崩溃时点(${esc(sc.anchor)})为锚的推算显示（约数），请以主机时钟为准。</p>`;
  else html+=`<p class="tlx-foot">纵虚线=对象生命线；箭头=事件/变量在对象间传递，对象指向自身时用弯折回环箭头指回自身。悬停可看一行概要；可横向/纵向滚动。</p>`;
  body.innerHTML=html;
}


/* 悬浮提示：事件/对象详细信息（hover 展示，默认隐藏） */
let TIP_EL=null;
function initTip(){
  if(!TIP_EL){ TIP_EL=document.createElement('div'); TIP_EL.id='tip'; document.body.appendChild(TIP_EL); }
  document.addEventListener('mousemove', e=>{
    const el=e.target&&e.target.closest?e.target.closest('[data-tip]'):null;
    if(!el){ TIP_EL.style.display='none'; return; }
    const meta=el.getAttribute('data-tipmeta')||'';
    const body=el.getAttribute('data-tipbody')||'';
    if(!meta && !body){ TIP_EL.style.display='none'; return; }
    TIP_EL.innerHTML=(meta?`<div class="tip-m">${esc(meta)}</div>`:'')+(body?`<div class="tip-b">${esc(body)}</div>`:'');
    TIP_EL.style.display='block';
    const tw=TIP_EL.offsetWidth||400, th=TIP_EL.offsetHeight||220;
    let x=e.clientX+14, y=e.clientY+14;
    if(x+tw>window.innerWidth-8) x=Math.max(8,e.clientX-tw-14);
    if(y+th>window.innerHeight-8) y=Math.max(8,e.clientY-th-14);
    TIP_EL.style.left=x+'px'; TIP_EL.style.top=y+'px';
  });
  document.addEventListener('mouseleave', ()=>{ if(TIP_EL) TIP_EL.style.display='none'; });
}
/* ================= 4 根因分析 ================= */
function pathMini(ra){
  const chain=Array.isArray(ra)?ra:[];
  if(!chain.length) return '';
  const relLabel={call:'调用',uaf_free:'UAF 释放',data_pollution:'数据污染',null_deref:'空指针解引用'};
  let h='<div class="pp-wrap">';
  chain.forEach((s,i)=>{
    const crash=s.crash||i===chain.length-1;
    const rel=relLabel[s.type]||s.type||'调用';
    const file=s.file||s.source_file||'';
    const line=s.line||'';
    const fnUrl=s.source_url||s.fn_url||'';
    h+=`<div class="pp${crash?' pp-crash':''}">`;

function renderRootCause(report){

    if(st==='path_analysis'||st==='propagation') return 'chain';
    return 'case';
  };
  const PARTS=[
    {key:'feature',no:'①',title:'崩溃特征分析（含函数栈）',color:'#2f5bd8',
     desc:'从崩溃函数栈提取 函数/偏移/调用关系/寄存器，还原“在哪一条路径上、以什么方式崩”（含函数栈与寄存器证据）。'},
    {key:'chain',no:'②',title:'崩溃链路分析',color:'#c2660f',
     desc:'把崩溃栈按跳转拆解成扩散链：每跳给出 栈帧↔源码(文件/行号)、源码位置与 实参/寄存器↔源码形参（异常参数标红）。'},
    {key:'case',no:'③',title:'相关案例分析（基于崩溃栈 + 内部/上游案例 + 源码对照）',color:'#12805c',
     desc:'以崩溃栈特征为锚，交叉分析 内部知识库案例、社区邮件/会议纪要/Bugzilla、上游 commit，并与当前内核对应源码逐行对照，得出修复与结论。'}
  ];
  const buckets={feature:[],chain:[],case:[]};
  flow.forEach((s,i)=>{
    const st=s.stage||'step';
    buckets[partOf(st)].push(s);
  });

  let h='';
  if(ra.deep && ra.deep.lead){
    h+=`<div class="callout callout-danger rf-conclusion"><div class="title">根因结论</div>`;
    if(ra.deep.lead) h+=`<div class="rf-text" style="margin:0 0 4px">${rich(ra.deep.lead)}</div>`;

    h+='</div>';

  PARTS.forEach(P=>{
    const steps=buckets[P.key];
    if(!steps.length) return;
    h+=`<details class="rf-part" style="border:1px solid ${P.color}44;border-left:4px solid ${P.color};background:${P.color}0a;border-radius:8px;margin:14px 0 6px">`;
    h+=`<summary style="padding:12px 16px"><span class="rf-part-no" style="background:${P.color}">${P.no}</span><span style="font-size:15px;font-weight:700;color:#1c2733">${esc(P.title)}</span><span class="mg-count" style="margin-left:8px">${steps.length} 个环节</span></summary>`;
    h+=`<div class="rf-part-body"><div class="rf-part-desc">${esc(P.desc)}</div>`;
    h+=`<div class="rf-chain">${steps.map((s,i)=>rfStep(s,i+1)).join('')}</div>`;
    h+=`</div></details>`;
  });

  if(!h) h='<div class="empty-line">无</div>';
  document.getElementById('rootcause-body').innerHTML=h;
}

  let h='<div class="kb-section-title">案例匹配总览</div>';

  const internal=(diag.internal_kernel_result||[]).slice().sort((a,b)=>({'高':0,'中':1,'低':2}[a.match_score]??9)-({'高':0,'中':1,'低':2}[b.match_score]??9));
  const commMails=(diag.online_result||[]).filter(c=>c.kind==='mail');
  const meetings=(diag.community_meetings||[]).filter(c=>c.kind==='meeting');
  const bugz=(diag.community_kernel_result||[]).concat((diag.online_result||[]).filter(c=>c.kind==='issue'));
  const commits=(diag.online_result||[]).filter(c=>c.kind==='commit');

  let idx=0;
  const tag=a=>a.map(c=>({c,__i:idx++}));

  const inCards=tag(internal).map(o=>internalCard(o.c));
  const mailCards=tag(commMails).map(o=>commCard(o.c));
  const meetCards=tag(meetings).map(o=>commCard(o.c));
  const bugzCards=tag(bugz).map(o=>commCard(o.c));
  const comCards=tag(commits).map(o=>commitCard(o.c));

  h+=groupHtml('internal','#2f5bd8','内部知识库',internal.length,'本地已知问题库（历史确诊/入库案例），含指纹、RAG 评分与多维匹配论证。若命中高相似内部案例且附一手补丁证据，可直接采信其结论并终止社区检索。',inCards,internal.length>1);
  const commDesc='openEuler / Linux 社区资料按来源分组：邮件列表、会议纪要、Bugzilla/Issue。每条摘录只保留与崩溃直接相关的关键段落，并说明这些段落是如何推导出下方“上游 commit”的。';
  h+=`<div class="kbg"><div class="kbg-head"><span class="kbg-dot" style="background:#b26a00"></span><span class="kbg-name">社区邮件 / 会议纪要 / Bugzilla</span><span class="mg-count">${commMails.length+meetings.length+bugz.length} 条</span></div>`;
  h+=`<p class="kbg-desc">${esc(commDesc)}</p>`;
  h+=commSub('社区邮件','#b26a00',mailCards,'本次未检索到独立邮件讨论；修复以上游提交形式落地（见下方“上游 commit”组）。');
  h+=commSub('社区会议纪要','#6d4fc2',meetCards,'本次未检索到相关社区会议纪要。');
  h+=commSub('社区 Bugzilla / Issue','#12805c',bugzCards,'本次未检索到相关社区 Bugzilla / Issue 记录。');
  h+='</div>';
  h+=groupHtml('commit','#12805c','上游 commit（深度关联的修复补丁）',comCards.length,'由社区/上游检索推导出的、直接修复崩溃路径的补丁，并与当前内核源码/反汇编逐行对照。',comCards,comCards.length>2);

  const total=internal.length+commMails.length+meetings.length+bugz.length+commits.length;
  const cnt=document.getElementById('kb-count');
  if(cnt) cnt.textContent=(total?('共 '+total+' 条匹配'):'');
  if(!total) h='<div class="match-empty">本地知识库、社区资料与在线检索均无匹配案例</div>';
  document.getElementById('kb-body').innerHTML=h;
}

/* ================= 工作流追踪 ================= */
function renderWorkflow(report){
  const wt=report.workflow_trace||{}, steps=wt.steps||[];
  const sourceBadge = wt.source==='opencode_export'
    ? '<span class="wf-badge export">Session Export</span>'
    : wt.source==='manual' ? '<span class="wf-badge manual">LLM Summarized</span>' : '';
  const dur = wt.total_duration_ms!=null ? `${(wt.total_duration_ms/1000).toFixed(1)}s` : '';
  let h='<div class="wf-header">';
  if(sourceBadge) h+=sourceBadge;
  h+=`<span>${esc(wt.step_count??steps.length)} 个关键决策</span>`;
  if(dur) h+=`<span class="wf-duration">总耗时 ${dur}</span>`;
  h+='</div>';
  if(!steps.length){h+='<div class="empty-line">无工作流记录</div>';}
  steps.forEach(s=>{
    const isFail=s.status==='failed', isPartial=s.status==='partial';
    const dotCls=isFail?'fail':(isPartial?'partial':'');
    const stageLabel=(s.stage||'').replace(/_/g,' ');
    let tools='';
    (s.tools||[]).forEach(t=>{
      const ok=t.status==='success'||t.status==='completed';
      const warn=t.status==='timeout'||t.status==='partial';
      const err=t.status==='failed'||t.status==='error';
      const icon=ok?'<span class="wf-tool-icon ok">OK</span>':warn?'<span class="wf-tool-icon warn">TIMEOUT</span>':err?'<span class="wf-tool-icon err">ERR</span>':'<span class="wf-tool-icon">•</span>';
      let d=''; if(t.duration_ms!=null) d=t.duration_ms<1000?t.duration_ms+'ms':(t.duration_ms/1000).toFixed(1)+'s';
      tools+=`<div class="wf-tool">${icon}<span class="wf-tool-title" title="${esc(t.tool_name+': '+(t.title||''))}">${esc(t.tool_name)}${t.title?': '+esc(t.title):''}</span>${d?`<span class="wf-tool-meta">${d}</span>`:''}</div>`;
    });
    const statusText=s.status==='success'?'成功':s.status==='failed'?'失败':s.status==='partial'?'部分成功':s.status==='skipped'?'跳过':(s.status||'');
    h+=`<div class="wf-step"><div class="wf-dot-col"><div class="wf-dot ${dotCls}">${esc(s.step)}</div></div><div class="wf-card-col"><div class="wf-card">`;
    h+=`<div class="wf-card-head"><span class="wf-stage ${esc(s.stage||'')}">${esc(stageLabel)}</span><span class="wf-step-status ${esc(s.status||'success')}">${esc(statusText)}</span></div>`;
    h+=`<div class="wf-decision">${esc(s.decision||'')}</div>`;
    if(s.src) h+=`<div class="wf-src">来源：${esc(s.src)}</div>`;
    if(s.observations) h+=`<div class="wf-observations">${esc(s.observations)}</div>`;
    if(s.judgment) h+=`<div class="wf-judgment">${esc(s.judgment)}</div>`;
    if(s.cross) h+=`<div class="wf-cross">与上文交叉验证：${esc(s.cross)}</div>`;
    if(tools) h+=`<div class="wf-tools">${tools}</div>`;
    h+=`</div></div></div>`;
  });
  document.getElementById('workflow-body').innerHTML=h;
}

/* ================= 头部 ================= */
function renderHeader(report){
  const cf=report.crash_feature_info||{}, hb=report.host_base_info||{};
  document.getElementById('header-title').textContent=report.report_id||cf.bug_type||'内核崩溃分析报告';
  const sub=[hb.machine_model,hb.cpu_model].filter(Boolean);
  if(hb.kernel_version) sub.push('内核 '+hb.kernel_version);
  document.getElementById('header-subtitle').textContent=sub.join(' · ');
  const items=[
    ['主机名',hb.host_name],['内核版本',hb.kernel_version],['崩溃时间',cf.crash_time],
    ['崩溃类型',cf.bug_type],['CPU',(hb.cpu_num||'')+' 核'+(hb.cpu_model?' · '+hb.cpu_model:'')],['内存',hb.memory_size],
  ];
  document.getElementById('header-meta-grid').innerHTML=items.map(([k,v])=>`<div class="meta-item"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join('');
}

/* ================= 主流程 ================= */
const loadFull = EMBED_FULL ? Promise.resolve(EMBED_FULL) : fetch(FULL_URL).then(r=>{ if(!r.ok) throw new Error(FULL_URL+' HTTP '+r.status); return r.json(); });
loadFull.then(report=>{
  buildKBRefMap(report);
  renderHeader(report);
  renderExecSummary(report);
  renderCrashDetail(report);
  renderEventTimeline(report);
  renderRootCause(report);
  renderKB(report);
  renderWorkflow(report);
  initTip();
  const cf=report.crash_feature_info||{}, hb=report.host_base_info||{};
  document.getElementById('footer-text').innerHTML=`本报告基于崩溃数据分析生成 · ${cf.crash_time||''} · 内核 ${hb.kernel_version||''}`;
}).catch(err=>{
  const isFile=location.protocol==='file:' && /fetch/.test(err.message||'');
  let hint=''; if(isFile) hint='<br><br>提示：需要内嵌数据，或通过 HTTP 服务访问（如 python3 -m http.server）。';
  document.getElementById('app').innerHTML=`<div class="error">加载失败: ${esc(err.message||err)}${hint}</div>`;
});
</script>
