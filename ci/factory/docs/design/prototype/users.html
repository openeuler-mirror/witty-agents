<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>用户管理 · witty-agent-factor</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-shell="plain" data-page="users">
<div class="content">
  <div class="page-header"><h1>用户管理</h1><span class="tag p">仅系统管理员可见（菜单层权限演示）</span><span class="spacer"></span>
    <div class="actions"><a class="btn" href="audit.html">🧾 审计日志</a><button class="btn primary" id="uAdd">＋ 添加用户</button></div>
  </div>

  <div class="card">
    <div class="card-b tight">
      <table class="tbl">
        <thead><tr><th>用户名</th><th>姓名</th><th>系统角色</th><th>状态</th><th>最近登录</th><th>操作</th></tr></thead>
        <tbody id="usersTbody"></tbody>
      </table>
    </div>
    <div class="pager">共 6 名用户 · 禁用后立即踢出会话（RBAC-03）</div>
  </div>

  <div class="card">
    <div class="card-h"><b>角色权限矩阵（只读展示）</b><span class="dim">RBAC-05 · 详细用例见 docs/01-用例设计.md §6</span></div>
    <div class="card-b tight">
      <table class="tbl">
        <thead><tr><th>操作</th><th>系统管理员</th><th>项目管理员</th><th>开发成员</th><th>只读访客</th></tr></thead>
        <tbody>
          <tr><td>用户管理 / 系统角色分配</td><td>✔</td><td>—</td><td>—</td><td>—</td></tr>
          <tr><td>全局 Jenkins / 凭据配置</td><td>✔</td><td>—</td><td>—</td><td>—</td></tr>
          <tr><td>Agent 新建 / 编辑</td><td>✔</td><td>✔</td><td>✔（MR 需审批）</td><td>—</td></tr>
          <tr><td>触发构建（PUBLISH=false）</td><td>✔</td><td>✔</td><td>✔</td><td>—</td></tr>
          <tr><td>修改 PUBLISH 等发布参数</td><td>✔</td><td>✔</td><td>—</td><td>—</td></tr>
          <tr><td>npm 发布 / 回滚</td><td>✔</td><td>✔</td><td>—</td><td>—</td></tr>
          <tr><td>AI 低危代执行（重跑/取消）</td><td>✔</td><td>✔</td><td>✔（自己触发的）</td><td>—</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<script src="assets/proto.js"></script>

</html>
